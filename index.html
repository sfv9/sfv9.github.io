<style>
  *{box-sizing:border-box;}
  body{margin:0;font-family:var(--font-body);background:var(--paper);color:var(--text-strong);}
  .overlay{position:fixed;inset:0;background:rgba(15,15,15,0.45);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:50;animation:fade .2s var(--ease-out);}
  @keyframes fade{from{opacity:0}to{opacity:1}}
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="_ds/sfv9-design-system-6362146f-437f-41dc-b194-b18b08ce9086/_ds_bundle.js?v=1"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="website/SiteHeader.jsx"></script>
<script type="text/babel" src="website/Hero.jsx"></script>
<script type="text/babel" src="website/Services.jsx"></script>
<script type="text/babel" src="website/StatStrip.jsx"></script>
<script type="text/babel" src="website/AlliedMarkets.jsx"></script>
<script type="text/babel" src="website/CTASection.jsx"></script>
<script type="text/babel" src="website/SiteFooter.jsx"></script>

<script type="text/babel">
const { Card, Button, Input, Logo } = window.SFV9DesignSystem_636214;

function GoalsField({ label, placeholder }) {
  const [focus, setFocus] = React.useState(false);
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
      <label htmlFor="in-goals" style={{ fontFamily: 'var(--font-body)', fontSize: 13, fontWeight: 'var(--fw-semibold)', color: 'var(--text-strong)' }}>{label}</label>
      <textarea id="in-goals" rows={3} placeholder={placeholder}
        onFocus={() => setFocus(true)} onBlur={() => setFocus(false)}
        style={{
          fontFamily: 'var(--font-body)', fontSize: 15, color: 'var(--text-strong)',
          padding: '11px 14px', background: 'var(--paper)',
          border: `1px solid ${focus ? 'var(--accent)' : 'var(--border-default)'}`,
          borderRadius: 'var(--radius-md)', outline: 'none', resize: 'vertical', minHeight: 84,
          boxShadow: focus ? 'var(--focus-ring)' : 'none',
          transition: 'border var(--dur-fast), box-shadow var(--dur-fast)',
        }} />
    </div>
  );
}

function ContactDialog({ onClose }) {
  const [sent, setSent] = React.useState(false);
  return (
    <div className="overlay" onClick={onClose}>
      <Card onClick={(e) => e.stopPropagation()} accent="blue" padding="var(--space-8)"
        style={{ width: 440, maxWidth: '90vw', boxShadow: 'var(--shadow-xl)' }}>
        {sent ? (
          <div style={{ textAlign: 'center', padding: '12px 0' }}>
            <Logo size={40} wordmark={false} src="assets/logo-mark.png" />
            <h3 style={{ fontFamily: 'var(--font-display)', fontSize: 24, margin: '18px 0 8px' }}>Course plotted.</h3>
            <p style={{ color: 'var(--text-muted)', margin: '0 0 24px' }}>We'll be in touch within one business day.</p>
            <Button full onClick={onClose}>Close</Button>
          </div>
        ) : (
          <React.Fragment>
            <h3 style={{ fontFamily: 'var(--font-display)', fontSize: 24, margin: '0 0 6px', letterSpacing: '-0.3px' }}>Start a conversation</h3>
            <p style={{ color: 'var(--text-muted)', fontSize: 14, margin: '0 0 22px' }}>Tell us where you're headed in the federal market.</p>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
              <Input label="Work email" type="email" placeholder="you@company.com" />
              <Input label="Company" placeholder="Acme Defense" />
              <GoalsField label="Your goals" placeholder="Where are you headed in the federal market?" />
              <Button full iconRight="→" onClick={() => setSent(true)}>Send</Button>
            </div>
          </React.Fragment>
        )}
      </Card>
    </div>
  );
}

function Site() {
  const [contact, setContact] = React.useState(false);
  const open = () => setContact(true);
  return (
    <React.Fragment>
      <window.SiteHeader onContact={open} />
      <window.Hero onContact={open} />
      <window.Services />
      <window.StatStrip />
      <window.AlliedMarkets />
      <window.CTASection onContact={open} />
      <window.SiteFooter />
      {contact && <ContactDialog onClose={() => setContact(false)} />}
    </React.Fragment>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Site />);
</script>
<script src="website/globe-loader.js"></script>
</body></html>
