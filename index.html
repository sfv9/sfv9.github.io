<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SFV9</title>
  <meta name="description" content="SFV9 LLC — internal applications">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #0F172A;
    }

    .container {
      max-width: 400px;
      margin: 0 auto;
      padding: 4rem 1rem;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .logo-section {
      text-align: center;
      margin-bottom: 3rem;
    }

    .logo-section img {
      height: 80px;
      object-fit: contain;
    }

    .apps-grid {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .app-link {
      text-decoration: none;
      color: inherit;
    }

    .app-box {
      background: #60A5FA;
      border-radius: 6px;
      padding: 1.5rem;
      text-align: center;
      cursor: pointer;
      transition: background 0.2s ease;
      font-size: 18px;
      font-weight: 500;
      color: white;
    }

    .app-box:hover {
      background: #3B82F6;
    }

    .footer {
      margin-top: auto;
      padding-top: 3rem;
      text-align: center;
      font-size: 13px;
      color: #94A3B8;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-section">
      <img src="logo.png" alt="SFV9">
    </div>

    <div class="apps-grid">
      <a class="app-link" href="https://apps.sfv9.com/timesheet/">
        <div class="app-box">Timesheet</div>
      </a>
      <a class="app-link" href="https://apps.sfv9.com/outreach">
        <div class="app-box">Automated Outreach</div>
      </a>
      <a class="app-link" href="https://apps.sfv9.com/trading">
        <div class="app-box">Options Income Tracker</div>
      </a>
      <a class="app-link" href="https://apps.sfv9.com/spanish/">
        <div class="app-box">Spanish Learning</div>
      </a>
      <a class="app-link" href="https://apps.sfv9.com/FRIS">
        <div class="app-box">FRIS</div>
      </a>
    </div>

    <div class="footer">&copy; SFV9 LLC</div>
  </div>
</body>
</html>
