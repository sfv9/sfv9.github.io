document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  <script type="__bundler/template">
"<!DOCTYPE html>\n<html lang=\"en\"><head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>SFV9 Globe Loader<\u002Ftitle>\n\n<style>/* ============================================================\n   SFV9 — COLORS\n   Primary blue + secondary coral, on a clean light ground.\n   \"Plotting a course through the federal market.\"\n   ============================================================ */\n:root {\n  /* ---- Brand: Blue (primary / trajectory) ---- */\n  --blue-50:  #EFF5FF;\n  --blue-100: #DBE8FE;\n  --blue-200: #BFD5FE;\n  --blue-300: #93B8FD;\n  --blue-400: #6097FA;\n  --blue-500: #2563EB;  /* core brand blue */\n  --blue-600: #1D4ED8;\n  --blue-700: #1E40AF;\n  --blue-800: #1E3A8A;\n  --blue-900: #172E6B;\n\n  /* ---- Brand: Coral (secondary / signal) ---- */\n  --coral-50:  #FEF2F3;\n  --coral-100: #FDE2E5;\n  --coral-200: #FBC9CF;\n  --coral-300: #F6A3AD;\n  --coral-400: #EF7886;\n  --coral-500: #E85D6D;  /* core brand coral */\n  --coral-600: #D43E50;\n  --coral-700: #B12C3C;\n  --coral-800: #932734;\n  --coral-900: #7C2530;\n\n  /* ---- Ink / neutrals ---- */\n  --ink-900: #0F0F0F;  /* primary text, near-black */\n  --ink-800: #1A1D29;  /* deep slate for dark surfaces */\n  --ink-700: #2C3140;\n  --ink-600: #4B5563;\n  --ink-500: #6B7280;  /* secondary text */\n  --ink-400: #9CA3AF;\n  --ink-300: #D1D5DB;\n  --ink-200: #E5E7EB;\n  --ink-100: #F1F2F4;\n  --ink-50:  #F8F9FA;\n  --paper:   #FFFFFF;\n  --ground:  #F3F3F3;  /* slide & card backgrounds */\n\n  /* ---- Semantic / status ---- */\n  --success-bg: #ECFDF5;\n  --success-fg: #047857;\n  --warning-bg: #FFFBEB;\n  --warning-fg: #D97706;\n  --danger-bg:  #FEF2F2;\n  --danger-fg:  #DC2626;\n  --info-bg:    #EFF5FF;\n  --info-fg:    #1D4ED8;\n\n  /* ============================================================\n     SEMANTIC ALIASES — reference these in components\n     ============================================================ */\n  --accent:            var(--blue-500);\n  --accent-hover:      var(--blue-600);\n  --accent-press:      var(--blue-700);\n  --accent-soft:       var(--blue-50);\n  --signal:            var(--coral-500);\n  --signal-hover:      var(--coral-600);\n  --signal-soft:       var(--coral-50);\n\n  --text-strong:       var(--ink-900);\n  --text-body:         var(--ink-700);\n  --text-muted:        var(--ink-500);\n  --text-faint:        var(--ink-400);\n  --text-on-accent:    #FFFFFF;\n  --text-on-dark:      #FFFFFF;\n  --text-on-dark-dim:  var(--ink-400);\n\n  --surface-page:      var(--ground);\n  --surface-card:      var(--paper);\n  --surface-sunken:    var(--ink-50);\n  --surface-dark:      var(--ink-900);\n  --surface-dark-2:    var(--ink-800);\n\n  --border-subtle:     var(--ink-200);\n  --border-default:    var(--ink-300);\n  --border-strong:     var(--ink-400);\n\n  /* Signature gradient: blue -> coral (use sparingly, for depth/accents) */\n  --gradient-brand: linear-gradient(135deg, var(--blue-500) 0%, var(--coral-500) 100%); /* @kind color */\n  --gradient-ink:   linear-gradient(135deg, #0F0F0F 0%, #1A1D29 100%); /* @kind color */\n}\n<\u002Fstyle>\n<script src=\"fed10e5b-eebe-436c-a306-de9d9e837d43\"><\u002Fscript>\n<script src=\"3572d27d-edf7-422e-929c-ff3a6dcf09c1\"><\u002Fscript>\n<style>\n  html, body {\n    margin: 0;\n    height: 100%;\n  }\n  body {\n    background: #F8F9FA; /* off-white */\n    display: flex;\n    align-items: center;\n    justify-content: center;\n  }\n\n  /* 200 x 200 loader */\n  .loader {\n    position: relative;\n    width: 200px;\n    height: 200px;\n    perspective: 720px;\n  }\n\n  /* spinning globe canvas */\n  #globe {\n    position: absolute;\n    inset: 0;\n    width: 200px;\n    height: 200px;\n    z-index: 2;\n    transform-origin: 50% 50%;\n    will-change: transform, opacity;\n  }\n\n  /* whirl ring around the globe */\n  .whirl {\n    position: absolute;\n    top: 50%;\n    left: 50%;\n    width: 252px;\n    height: 252px;\n    margin: -126px 0 0 -126px;\n    z-index: 1;\n    border-radius: 50%;\n    background: conic-gradient(\n      from 0deg,\n      rgba(37,99,235,0)   0deg,\n      rgba(37,99,235,0)   55deg,\n      rgba(37,99,235,.55) 150deg,\n      rgba(96,151,250,.7) 200deg,\n      rgba(232,93,109,.65) 250deg,\n      rgba(232,93,109,0)  320deg,\n      rgba(37,99,235,0)   360deg\n    );\n    -webkit-mask: radial-gradient(closest-side, transparent 73%, #000 78%, #000 90%, transparent 96%);\n            mask: radial-gradient(closest-side, transparent 73%, #000 78%, #000 90%, transparent 96%);\n    filter: blur(1.5px);\n    will-change: transform, opacity;\n  }\n\n  /* leading arrow head of the whirl — rides in the foreground */\n  .comet-orbit {\n    position: absolute;\n    top: 50%;\n    left: 50%;\n    width: 0;\n    height: 0;\n    z-index: 3;\n    will-change: transform;\n  }\n  .arrow {\n    position: absolute;\n    left: -15px;\n    top: -122px;\n    width: 30px;\n    height: 30px;\n    transform-origin: 50% 50%;\n    filter: drop-shadow(0 0 7px rgba(37,99,235,.8)) drop-shadow(0 2px 4px rgba(15,15,15,.25));\n  }\n  .arrow svg { display: block; width: 100%; height: 100%; }\n\n  /* SFV9 logo that the globe spins into */\n  #logo {\n    position: absolute;\n    top: 50%;\n    left: 50%;\n    width: 168px;\n    height: auto;\n    margin: -100px 0 0 -84px; /* 168 * (462/387) ≈ 200 tall — matches globe */\n    transform-origin: 50% 50%;\n    transform-style: preserve-3d;\n    backface-visibility: hidden;\n    z-index: 5;\n    opacity: 0;\n    will-change: transform, opacity, filter;\n    pointer-events: none;\n  }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n  \n  <div class=\"loader\" aria-label=\"Loading\" role=\"img\">\n    <div class=\"whirl\" id=\"whirl\"><\u002Fdiv>\n    <div class=\"comet-orbit\" id=\"cometOrbit\"><div class=\"arrow\" id=\"arrow\"><svg viewBox=\"0 0 24 24\"><path d=\"M12 1.5 L21 21 L12 16 L3 21 Z\" fill=\"#2563EB\"><\u002Fpath><\u002Fsvg><\u002Fdiv><\u002Fdiv>\n    <canvas id=\"globe\" width=\"400\" height=\"400\"><\u002Fcanvas>\n    <img id=\"logo\" src=\"a8d77258-b7ca-41fd-b5d7-214519e4dc65\" alt=\"\">\n  <\u002Fdiv>\n\n<script>\n(function () {\n  const SIZE = 200;\n  const dpr = Math.min(window.devicePixelRatio || 1, 2);\n  const canvas = document.getElementById('globe');\n  canvas.width = SIZE * dpr;\n  canvas.height = SIZE * dpr;\n  const ctx = canvas.getContext('2d');\n  ctx.scale(dpr, dpr);\n\n  const whirlEl = document.getElementById('whirl');\n  const cometEl = document.getElementById('cometOrbit');\n  const arrowEl = document.getElementById('arrow');\n  const ARROW_ANGLE = 45; // fixed NE heading, matching the logo's paper-plane arrow\n  const ARROW_R = 107;    // orbit radius of the arrow's center\n  // where the logo's own arrow sits, relative to loader center (logo ends ~200px tall)\n  const ARROW_TARGET_X = 60;\n  const ARROW_TARGET_Y = -75;\n  const logoEl  = document.getElementById('logo');\n\n  const projection = d3.geoOrthographic()\n    .scale(SIZE / 2 - 3)\n    .translate([SIZE / 2, SIZE / 2])\n    .clipAngle(90);\n  const path = d3.geoPath(projection, ctx);\n  const graticule = d3.geoGraticule10();\n\n  // ocean shading\n  const ocean = ctx.createRadialGradient(\n    SIZE * 0.40, SIZE * 0.36, SIZE * 0.12,\n    SIZE * 0.50, SIZE * 0.50, SIZE * 0.55\n  );\n  ocean.addColorStop(0, '#FFFFFF');\n  ocean.addColorStop(1, '#E7EEFB');\n\n  // allies (drawn blue)\n  const ALLIES = new Set([\n    'united states of america','canada','united kingdom','france','germany',\n    'italy','spain','netherlands','belgium','luxembourg','portugal','norway',\n    'denmark','iceland','poland','czechia','czech republic','slovakia','hungary',\n    'romania','bulgaria','greece','turkey','türkiye','slovenia','croatia',\n    'estonia','latvia','lithuania','albania','montenegro','north macedonia',\n    'macedonia','finland','sweden','australia','new zealand','japan',\n    'south korea','korea','republic of korea','israel'\n  ]);\n  const isAlly = (f) => ALLIES.has(String(f.properties && f.properties.name || '').toLowerCase());\n\n  let landAllies = [];\n  let landOther = [];\n  let ready = false;\n\n  function draw() {\n    ctx.clearRect(0, 0, SIZE, SIZE);\n\n    // sphere / ocean\n    ctx.beginPath(); path({ type: 'Sphere' });\n    ctx.fillStyle = ocean; ctx.fill();\n\n    // graticule\n    ctx.beginPath(); path(graticule);\n    ctx.lineWidth = 0.5; ctx.strokeStyle = 'rgba(37,99,235,0.07)'; ctx.stroke();\n\n    if (ready) {\n      // non-ally land\n      ctx.beginPath();\n      for (const f of landOther) path(f);\n      ctx.fillStyle = '#DBE0E6'; ctx.fill();\n      ctx.lineWidth = 0.4; ctx.strokeStyle = '#F4F6F8'; ctx.stroke();\n\n      // ally land — blue\n      ctx.beginPath();\n      for (const f of landAllies) path(f);\n      ctx.fillStyle = '#DBE0E6'; ctx.fill();\n      ctx.lineWidth = 0.4; ctx.strokeStyle = '#F4F6F8'; ctx.stroke();\n    }\n\n    // sphere edge\n    ctx.beginPath(); path({ type: 'Sphere' });\n    ctx.lineWidth = 1; ctx.strokeStyle = '#C9D2DD'; ctx.stroke();\n  }\n\n  // ---- timeline ----\n  const SPIN_END   = 2600;   // ms\n  const FINALE_END = 3550;   // globe -> logo\n  const HOLD_END   = 4750;   // logo holds\n  const CYCLE      = 5150;   // + brief reset\n\n  const easeInOut = (t) => t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t+2, 2)/2;\n  const easeOut   = (t) => 1 - Math.pow(1 - t, 3);\n  const easeIn    = (t) => t*t*t;\n  const clamp01   = (t) => Math.max(0, Math.min(1, t));\n\n  const US_LON = 98.5;  // rotate[0] to center the United States (~ -98.5° lon)\n  const US_LAT = -38;   // rotate[1] to center ~38°N\n  const TURNS  = 2;     // whole turns so it starts and ends on the US\n  let lon = US_LON;     // globe rotation longitude\n  let whirl = 0;        // whirl angle\n  let last = performance.now();\n  let cycleStart = performance.now();\n\n  function frame(now) {\n    const dt = Math.min((now - last) / 1000, 0.05);\n    last = now;\n    let t = now - cycleStart;\n    if (t >= CYCLE) { cycleStart = now; t = 0; }\n\n    // whirl speed ramp during finale\n    let whirlSpeed = 55;    // deg/s\n    if (t > SPIN_END && t <= FINALE_END) {\n      const p = (t - SPIN_END) / (FINALE_END - SPIN_END);\n      whirlSpeed = 55 + 240 * easeIn(p);\n    }\n    whirl = (whirl + whirlSpeed * dt) % 360;\n\n    // globe rotation: eased over exactly TURNS full turns, so it begins\n    // and ends centered on the United States (slow start → fast into finale)\n    const q = clamp01(t / FINALE_END);\n    const rot = TURNS * 360 * (0.25 * q + 0.75 * easeIn(q));\n    lon = US_LON + rot;\n\n    projection.rotate([lon, US_LAT, 0]);\n    draw();\n\n    // stage transforms\n    let globeScale = 1, globeOpacity = 1;\n    let logoScale = 0.3, logoOpacity = 0, logoRotY = -135, logoRotX = 22;\n    let whirlScale = 1, whirlOpacity = 1;\n\n    if (t <= SPIN_END) {\n      whirlOpacity = easeOut(clamp01(t / 600));\n    } else if (t <= FINALE_END) {\n      const p = (t - SPIN_END) / (FINALE_END - SPIN_END);\n      const e = easeInOut(p);\n      const eo = easeOut(p);\n      // globe shrinks away as it fades\n      globeScale   = 1 - 0.78 * easeIn(p);\n      globeOpacity = 1 - easeIn(clamp01((p - 0.25) / 0.5));\n      // logo grows from small into the globe's place as it fades in\n      logoOpacity  = easeOut(clamp01((p - 0.12) / 0.5));\n      logoScale    = 0.3 + 0.7 * eo;\n      // hand the globe's spin off into a 3D flip that settles flat\n      logoRotY     = -135 * (1 - eo);\n      logoRotX     = 22 * (1 - eo);\n      whirlScale   = 1 + 0.18 * e;\n      whirlOpacity = 1 - easeIn(clamp01((p - 0.4) / 0.6));\n    } else if (t <= HOLD_END) {\n      globeOpacity = 0; globeScale = 0.22;\n      logoOpacity = 1; logoScale = 1; logoRotY = 0; logoRotX = 0;\n      whirlOpacity = 0;\n    } else {\n      // brief reset: logo out, globe back in for the loop\n      const p = (t - HOLD_END) / (CYCLE - HOLD_END);\n      logoOpacity  = 1 - easeIn(p);\n      logoScale    = 1 - 0.1 * p;\n      logoRotY = 0; logoRotX = 0;\n      globeOpacity = easeOut(p);\n      globeScale   = 0.22 + 0.78 * easeOut(p);\n      whirlOpacity = easeOut(p);\n    }\n\n    canvas.style.opacity = globeOpacity;\n    canvas.style.transform = `scale(${globeScale})`;\n    logoEl.style.opacity = logoOpacity;\n    logoEl.style.transform = `rotateX(${logoRotX}deg) rotateY(${logoRotY}deg) scale(${logoScale})`;\n    // depth shadow that flattens as the logo lands\n    const tilt = Math.min(1, (Math.abs(logoRotY) + Math.abs(logoRotX)) / 90);\n    logoEl.style.filter = tilt > 0.02\n      ? `drop-shadow(${-logoRotY * 0.12}px ${8 + logoRotX * 0.3}px ${10 + 14 * tilt}px rgba(15,15,15,${0.10 + 0.22 * tilt}))`\n      : 'none';\n    whirlEl.style.opacity = whirlOpacity;\n    whirlEl.style.transform = `rotate(${whirl}deg) scale(${whirlScale})`;\n\n    // blue arrow: orbits the globe at a fixed heading, then flies to the logo's\n    // fixed arrow spot and dissolves into it\n    const orbitRad = (whirl + 150) * Math.PI / 180;\n    let ax = ARROW_R * Math.sin(orbitRad);\n    let ay = -ARROW_R * Math.cos(orbitRad);\n    let arrowOpacity, arrowScale = 1;\n    if (t <= SPIN_END) {\n      arrowOpacity = easeOut(clamp01(t / 600));\n    } else if (t <= FINALE_END) {\n      const p = (t - SPIN_END) / (FINALE_END - SPIN_END);\n      const m = easeInOut(clamp01(p / 0.8));           // travel-to-target progress\n      ax += (ARROW_TARGET_X - ax) * m;\n      ay += (ARROW_TARGET_Y - ay) * m;\n      arrowScale  = 1 - 0.30 * m;\n      arrowOpacity = 1 - easeIn(clamp01((p - 0.62) / 0.38)); // fade into the logo\n    } else {\n      arrowOpacity = 0;\n    }\n    cometEl.style.opacity = arrowOpacity;\n    cometEl.style.transform = `translate(${ax}px, ${ay + ARROW_R}px)`;\n    arrowEl.style.transform = `rotate(${ARROW_ANGLE}deg) scale(${arrowScale})`;\n\n    requestAnimationFrame(frame);\n  }\n\n  // load country geometry (offline: blob URL injected by the bundler)\n  fetch((window.__resources && window.__resources.worldAtlas) || 'https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json')\n    .then(r => r.json())\n    .then(world => {\n      const feats = topojson.feature(world, world.objects.countries).features;\n      landAllies = feats.filter(isAlly);\n      landOther  = feats.filter(f => !isAlly(f));\n      ready = true;\n    })\n    .catch(() => { ready = false; });\n\n  requestAnimationFrame(frame);\n})();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
