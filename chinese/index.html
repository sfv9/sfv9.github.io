<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>漢字配對 · Mandarin Matchup</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1e3a5f">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#f4f1ea; --surface:#fffdf8; --surface2:#f7f3ea;
  --ink:#1c2733; --muted:#6b7280; --line:#e6ded0;
  --jade:#0f766e; --jade-soft:#d6f3ee; --jade-ink:#0b5650;
  --verm:#c0362c; --verm-soft:#fbe5e2;
  --gold:#b5872a; --gold-soft:#f6ecd2;
  --navy:#1e3a5f; --navy2:#2c4d75;
  --shadow:0 1px 2px rgba(28,39,51,.06),0 4px 14px rgba(28,39,51,.07);
  --shadow-lg:0 10px 40px rgba(28,39,51,.18);
  --rad:16px; --rad-s:11px;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --hanzi:"PingFang TC","PingFang SC","Hiragino Sans GB","Heiti TC","Microsoft JhengHei",-apple-system,sans-serif;
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
[data-theme=dark]{
  --bg:#0d1117; --surface:#161b22; --surface2:#1c232d;
  --ink:#e6edf3; --muted:#9aa6b2; --line:#2a313c;
  --jade:#2dd4bf; --jade-soft:#0e312d; --jade-ink:#5eead4;
  --verm:#f8746a; --verm-soft:#36201e;
  --gold:#e3b341; --gold-soft:#332a16;
  --navy:#16263d; --navy2:#21385a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.4);
  --shadow-lg:0 12px 44px rgba(0,0,0,.6);
}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{font-family:var(--ui);background:var(--bg);color:var(--ink);min-height:100vh;line-height:1.5;
  background-image:radial-gradient(circle at 12% 8%,rgba(181,135,42,.05),transparent 42%),radial-gradient(circle at 88% 0%,rgba(15,118,110,.05),transparent 40%);
  transition:background .3s,color .3s}
#app{max-width:780px;margin:0 auto;padding:0 16px;padding-top:max(18px,env(safe-area-inset-top));padding-bottom:max(28px,env(safe-area-inset-bottom))}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.hide{display:none!important}

/* ===== HOME ===== */
.brand{display:flex;flex-direction:column;align-items:center;text-align:center;padding:22px 0 8px}
.brand .seal{width:62px;height:62px;border-radius:16px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(150deg,var(--navy),var(--navy2));color:var(--gold);font-family:var(--hanzi);font-size:34px;font-weight:700;
  box-shadow:var(--shadow);border:1.5px solid rgba(181,135,42,.45);margin-bottom:12px}
.brand h1{font-family:var(--hanzi);font-size:30px;font-weight:700;letter-spacing:2px}
.brand .en{font-family:var(--serif);font-size:15px;color:var(--muted);font-style:italic;margin-top:3px}
.brand .tag{font-size:12px;color:var(--muted);margin-top:9px;max-width:30ch;line-height:1.45}

.statbar{display:flex;gap:10px;margin:16px 0 4px}
.stat{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:var(--rad-s);padding:11px 8px;text-align:center;box-shadow:var(--shadow)}
.stat b{display:block;font-size:21px;font-family:var(--serif);color:var(--jade)}
.stat span{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

.section-h{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:22px 4px 10px}
.opts{display:flex;flex-direction:column;gap:10px}
.optrow{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--rad-s);padding:11px 13px;box-shadow:var(--shadow)}
.optrow .lbl{font-size:13.5px;font-weight:600}
.optrow .lbl small{display:block;font-weight:400;color:var(--muted);font-size:11px;margin-top:1px}
.seg{display:flex;background:var(--surface2);border-radius:9px;padding:3px;border:1px solid var(--line)}
.seg button{padding:6px 12px;border-radius:7px;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap;transition:.15s}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
[data-theme=dark] .seg button.on{background:var(--navy2);color:#fff}
.toggles{display:flex;gap:9px;margin-top:2px}
.tgl{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:var(--rad-s);padding:10px;font-size:12.5px;font-weight:600;color:var(--muted);box-shadow:var(--shadow);transition:.15s}
.tgl.on{color:var(--jade);border-color:var(--jade);background:var(--jade-soft)}

.decks{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.deck{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--rad);padding:15px 14px 13px;box-shadow:var(--shadow);text-align:left;transition:transform .12s,box-shadow .2s,border-color .2s;overflow:hidden}
.deck:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);border-color:var(--gold)}
.deck:active{transform:translateY(0)}
.deck .emo{font-size:26px;line-height:1}
.deck .cn{font-family:var(--hanzi);font-size:19px;font-weight:700;margin-top:8px;letter-spacing:1px}
.deck .enn{font-size:11.5px;color:var(--muted);margin-top:1px;line-height:1.3}
.deck .cnt{position:absolute;top:13px;right:13px;font-size:10px;font-weight:700;color:var(--gold);background:var(--gold-soft);padding:2px 7px;border-radius:20px}
.deck .study{margin-top:9px;font-size:11px;font-weight:700;color:var(--jade);letter-spacing:.03em}
.deck.mix{grid-column:1/-1;display:flex;align-items:center;gap:14px;background:linear-gradient(120deg,var(--navy),var(--navy2));border:none;color:#fff}
.deck.mix .emo{font-size:30px}
.deck.mix .cn{color:#fff;margin-top:0}
.deck.mix .enn{color:rgba(255,255,255,.78)}
.deck.mix .cnt{color:var(--gold);background:rgba(0,0,0,.25)}
.deck.mix .study{color:var(--gold)}
.deck.mix .txt{flex:1}

.foot{text-align:center;font-size:11px;color:var(--muted);margin-top:24px;line-height:1.6}
.foot b{color:var(--jade)}

/* ===== GAME ===== */
.ghead{display:flex;align-items:center;gap:10px;padding:10px 0 14px;position:sticky;top:0;z-index:20;background:linear-gradient(var(--bg) 72%,transparent)}
.icbtn{width:38px;height:38px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:var(--shadow);flex-shrink:0}
.icbtn:active{transform:scale(.92)}
.gtitle{flex:1;min-width:0}
.gtitle .cn{font-family:var(--hanzi);font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gtitle .meta{font-size:11px;color:var(--muted);margin-top:1px}
.hud{display:flex;gap:7px}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 9px;text-align:center;min-width:46px;box-shadow:var(--shadow)}
.chip b{display:block;font-size:15px;font-family:var(--serif);line-height:1}
.chip span{font-size:9px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.chip.streak{background:var(--gold-soft);border-color:var(--gold)}
.chip.streak b{color:var(--gold)}

#board{display:grid;gap:9px;margin-top:4px;perspective:1400px}
.card{position:relative;aspect-ratio:1/1.16;border-radius:13px;cursor:pointer;transform-style:preserve-3d;transition:transform .42s cubic-bezier(.2,.7,.2,1)}
.card.flipped{transform:rotateY(180deg)}
.card.matched{cursor:default}
.card .face{position:absolute;inset:0;border-radius:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:6px;text-align:center;overflow:hidden}
.cover{background:linear-gradient(155deg,var(--navy),var(--navy2));border:1px solid rgba(181,135,42,.4);box-shadow:var(--shadow)}
.cover .ring{width:50%;aspect-ratio:1;border-radius:50%;border:1.5px solid rgba(181,135,42,.55);display:flex;align-items:center;justify-content:center}
.cover .ring span{font-family:var(--hanzi);color:rgba(181,135,42,.92);font-size:min(5.6vw,26px);font-weight:700}
.cover::after{content:"";position:absolute;inset:5px;border-radius:9px;border:1px solid rgba(255,255,255,.06)}
.front{transform:rotateY(180deg);background:var(--surface);border:1.5px solid var(--line);box-shadow:var(--shadow)}
.card.hz .front{background:var(--surface)}
.card.mn .front{background:var(--surface2)}
.front .hzt{font-family:var(--hanzi);color:var(--verm);font-weight:700;line-height:1.08;word-break:break-all}
.front .hz-py{font-family:var(--serif);font-style:italic;color:var(--jade-ink);font-size:clamp(9px,2.7vw,12px);line-height:1.15;margin-top:4px;opacity:.9;padding:0 3px}
.front .mnt{font-family:var(--ui);color:var(--ink);font-weight:600;font-size:clamp(11px,3.3vw,15px);line-height:1.25}
.front .pyt{font-family:var(--serif);color:var(--jade-ink);font-style:italic;font-size:clamp(11px,3.4vw,15px);line-height:1.2}
.card.matched .front{background:var(--jade-soft);border-color:var(--jade)}
.card.matched .hzt{color:var(--jade-ink)}
.card.matched .front::before{content:"✓";position:absolute;top:5px;right:7px;color:var(--jade);font-size:12px;font-weight:800}
.card.bad .front{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
/* open / vocabulary-match mode — all cards face-up */
.card.open{transition:transform .14s,box-shadow .14s}
.card.open .cover{display:none}
.card.open .front{transform:none}
.card.open.sel{transform:translateY(-3px)}
.card.open.sel .front{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold),var(--shadow-lg)}
.card.open.matched{transform:none;cursor:default}
.card.open.matched .front{opacity:.42}
.hint{font-size:12.5px;color:var(--muted);text-align:center;margin:0 2px 11px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:9px 12px;line-height:1.45}
.hint b{color:var(--verm);font-family:var(--hanzi);font-weight:700}
.tag-dot{position:absolute;top:5px;left:6px;width:7px;height:7px;border-radius:50%}

/* reveal toast */
#toast{position:fixed;left:50%;top:max(14px,env(safe-area-inset-top));transform:translateX(-50%) translateY(-18px);z-index:60;
  background:var(--surface);border:1px solid var(--jade);border-radius:14px;box-shadow:var(--shadow-lg);
  padding:11px 16px;display:flex;align-items:center;gap:11px;opacity:0;pointer-events:none;transition:.28s;max-width:92vw}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast .tz{font-family:var(--hanzi);font-size:22px;font-weight:700;color:var(--verm)}
#toast .ti{min-width:0}
#toast .ti .py{font-family:var(--serif);font-style:italic;color:var(--jade-ink);font-size:13px}
#toast .ti .en{font-size:13px;font-weight:600}
#toast .ti .nt{font-size:10.5px;color:var(--muted)}
.spk{width:30px;height:30px;border-radius:50%;background:var(--jade-soft);color:var(--jade-ink);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px}

/* ===== WIN ===== */
.win{text-align:center;padding:14px 0}
.win .big{font-family:var(--hanzi);font-size:40px;font-weight:700;color:var(--jade);letter-spacing:3px}
.win .sub{font-family:var(--serif);font-style:italic;color:var(--muted);margin-top:2px}
.stars{font-size:34px;letter-spacing:6px;margin:10px 0 4px}
.newbest{display:inline-block;background:var(--gold-soft);color:var(--gold);font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:4px 11px;border-radius:20px;margin-bottom:6px}
.wstats{display:flex;gap:10px;margin:14px 0}
.wstats .stat b{color:var(--ink)}
.review{background:var(--surface);border:1px solid var(--line);border-radius:var(--rad);box-shadow:var(--shadow);text-align:left;margin-top:8px;overflow:hidden}
.review .rh{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:12px 14px 6px}
.rv{display:flex;align-items:center;gap:11px;padding:9px 14px;border-top:1px solid var(--line)}
.rv .rz{font-family:var(--hanzi);font-size:20px;font-weight:700;color:var(--verm);min-width:2.4em}
.rv .ri{flex:1;min-width:0}
.rv .ri .py{font-family:var(--serif);font-style:italic;color:var(--jade-ink);font-size:12.5px}
.rv .ri .en{font-size:13px;font-weight:600}
.rv .ri .nt{font-size:10.5px;color:var(--muted)}
.btns{display:flex;gap:10px;margin-top:16px}
.btn{flex:1;padding:14px;border-radius:13px;font-size:15px;font-weight:700;box-shadow:var(--shadow);transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--jade);color:#fff}
.btn.ghost{background:var(--surface);border:1px solid var(--line);color:var(--ink)}

/* ===== BROWSE MODAL ===== */
.modal{position:fixed;inset:0;z-index:80;background:rgba(20,28,38,.5);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:.25s}
.modal.show{opacity:1;pointer-events:auto}
.sheet{background:var(--bg);width:100%;max-width:780px;max-height:86vh;border-radius:22px 22px 0 0;overflow:hidden;display:flex;flex-direction:column;transform:translateY(20px);transition:.28s;box-shadow:var(--shadow-lg)}
.modal.show .sheet{transform:translateY(0)}
.sheet .sh{display:flex;align-items:center;gap:10px;padding:16px 18px 12px;border-bottom:1px solid var(--line)}
.sheet .sh .cn{font-family:var(--hanzi);font-size:19px;font-weight:700;flex:1}
.sheet .sh .en{font-size:12px;color:var(--muted)}
.sheet .body{overflow-y:auto;padding:4px 0 max(20px,env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:90;pointer-events:none;border-radius:2px}
@media(min-width:560px){
  .decks .deck .cn{font-size:20px}
  .card .front .mnt,.card .front .pyt{font-size:15px}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<div class="modal" id="modal"><div class="sheet">
  <div class="sh"><span class="cn" id="m-cn"></span><span class="en" id="m-en"></span><button class="icbtn" onclick="closeBrowse()">✕</button></div>
  <div class="body" id="m-body"></div>
</div></div>

<script>
/* =========================================================================
   漢字配對 · Mandarin Matchup
   Curated professional Mandarin for the China hand: military, diplomacy,
   technology, cross-Strait affairs, industry, intelligence, strategic idioms.
   Fields: t=Traditional  s=Simplified  p=pinyin(TW reading)  sp=PRC pinyin
           e=English  n=note (usage / TW-PRC nuance)
   ========================================================================= */
const DECKS = [
  { id:'mil', emo:'🪖', cn:'軍事', en:'Military & Defense', words:[
    {t:'國防',s:'国防',p:'guófáng',e:'national defense'},
    {t:'軍隊',s:'军队',p:'jūnduì',e:'armed forces'},
    {t:'威懾',s:'威慑',p:'wēishè',e:'deterrence',n:'Taiwan also: 嚇阻 xiàzǔ'},
    {t:'演習',s:'演习',p:'yǎnxí',e:'military exercise / drill'},
    {t:'部署',s:'部署',p:'bùshǔ',e:'deployment'},
    {t:'飛彈',s:'飞弹',p:'fēidàn',e:'missile',n:'Taiwan term; PRC: 導彈 dǎodàn'},
    {t:'潛艇',s:'潜艇',p:'qiántǐng',e:'submarine'},
    {t:'戰機',s:'战机',p:'zhànjī',e:'fighter jet'},
    {t:'航空母艦',s:'航空母舰',p:'hángkōng mǔjiàn',e:'aircraft carrier'},
    {t:'後勤',s:'后勤',p:'hòuqín',e:'logistics'},
    {t:'戰略',s:'战略',p:'zhànlüè',e:'strategy'},
    {t:'戰術',s:'战术',p:'zhànshù',e:'tactics'},
    {t:'預備役',s:'预备役',p:'yùbèiyì',e:'(military) reserves',n:'Your world — the Army Reserve'},
    {t:'同盟',s:'同盟',p:'tóngméng',e:'alliance'},
    {t:'防禦',s:'防御',p:'fángyù',e:'defense (to defend)'},
    {t:'指揮',s:'指挥',p:'zhǐhuī',e:'to command'},
  ]},
  { id:'dip', emo:'🤝', cn:'外交', en:'Diplomacy & Statecraft', words:[
    {t:'外交',s:'外交',p:'wàijiāo',e:'diplomacy'},
    {t:'大使',s:'大使',p:'dàshǐ',e:'ambassador'},
    {t:'武官',s:'武官',p:'wǔguān',e:'military attaché',n:'Your former post in Taipei'},
    {t:'使館',s:'使馆',p:'shǐguǎn',e:'embassy'},
    {t:'領事館',s:'领事馆',p:'lǐngshìguǎn',e:'consulate'},
    {t:'談判',s:'谈判',p:'tánpàn',e:'negotiation'},
    {t:'條約',s:'条约',p:'tiáoyuē',e:'treaty'},
    {t:'制裁',s:'制裁',p:'zhìcái',e:'sanctions'},
    {t:'主權',s:'主权',p:'zhǔquán',e:'sovereignty'},
    {t:'雙邊',s:'双边',p:'shuāngbiān',e:'bilateral'},
    {t:'峰會',s:'峰会',p:'fēnghuì',e:'summit'},
    {t:'協議',s:'协议',p:'xiéyì',e:'agreement / accord'},
    {t:'邦交',s:'邦交',p:'bāngjiāo',e:'diplomatic relations'},
    {t:'斡旋',s:'斡旋',p:'wòxuán',e:'mediation / good offices'},
    {t:'外交部',s:'外交部',p:'wàijiāobù',e:'foreign ministry'},
    {t:'結盟',s:'结盟',p:'jiéméng',e:'to form an alliance'},
  ]},
  { id:'tech', emo:'🤖', cn:'科技', en:'Technology & AI', words:[
    {t:'人工智慧',s:'人工智能',p:'réngōng zhìhuì',sp:'réngōng zhìnéng',e:'artificial intelligence',n:'Taiwan: 智慧 · PRC: 智能'},
    {t:'演算法',s:'算法',p:'yǎnsuànfǎ',sp:'suànfǎ',e:'algorithm',n:'Taiwan: 演算法 · PRC: 算法'},
    {t:'數據',s:'数据',p:'shùjù',e:'data'},
    {t:'晶片',s:'芯片',p:'jīngpiàn',sp:'xīnpiàn',e:'chip / microchip',n:'Taiwan: 晶片 · PRC: 芯片'},
    {t:'無人機',s:'无人机',p:'wúrénjī',e:'drone / UAV'},
    {t:'網路',s:'网络',p:'wǎnglù',sp:'wǎngluò',e:'network / internet',n:'Taiwan: 網路 · PRC: 网络'},
    {t:'軟體',s:'软件',p:'ruǎntǐ',sp:'ruǎnjiàn',e:'software',n:'Taiwan: 軟體 · PRC: 软件'},
    {t:'硬體',s:'硬件',p:'yìngtǐ',sp:'yìngjiàn',e:'hardware'},
    {t:'量子',s:'量子',p:'liàngzǐ',e:'quantum'},
    {t:'機器學習',s:'机器学习',p:'jīqì xuéxí',e:'machine learning'},
    {t:'雲端',s:'云端',p:'yúnduān',e:'cloud (computing)'},
    {t:'加密',s:'加密',p:'jiāmì',e:'encryption'},
    {t:'自動化',s:'自动化',p:'zìdònghuà',e:'automation'},
    {t:'雷達',s:'雷达',p:'léidá',e:'radar'},
    {t:'衛星',s:'卫星',p:'wèixīng',e:'satellite'},
    {t:'監控',s:'监控',p:'jiānkòng',e:'surveillance / monitoring'},
  ]},
  { id:'strait', emo:'🌊', cn:'台海', en:'Taiwan Strait', words:[
    {t:'台灣海峽',s:'台湾海峡',p:'Táiwān Hǎixiá',e:'Taiwan Strait'},
    {t:'兩岸',s:'两岸',p:'liǎng’àn',e:'cross-strait',n:'Lit. "the two shores"'},
    {t:'統一',s:'统一',p:'tǒngyī',e:'unification'},
    {t:'獨立',s:'独立',p:'dúlì',e:'independence'},
    {t:'民主',s:'民主',p:'mínzhǔ',e:'democracy'},

/* ---------- audio (Web Audio SFX) ---------- */
let actx;
function tone(freq,dur,type,when,gain){
  if(!S.sound)return;
  try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();
  const o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime+(when||0);
  o.type=type||'sine';o.frequency.value=freq;o.connect(g);g.connect(actx.destination);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(gain||.18,t+.01);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.start(t);o.stop(t+dur);}catch(e){}
}
const sfxFlip=()=>tone(440,.08,'triangle',0,.1);
const sfxMatch=()=>{[523.25,659.25,783.99].forEach((f,i)=>tone(f,.22,'sine',i*.07,.16))};
const sfxBad=()=>{tone(220,.18,'sawtooth',0,.08);tone(180,.2,'sawtooth',.06,.07)};
const sfxWin=()=>{[523,659,784,1046].forEach((f,i)=>tone(f,.4,'sine',i*.12,.18))};

/* ---------- TTS ---------- */
let voices=[];
function loadVoices(){voices=window.speechSynthesis?speechSynthesis.getVoices():[]}
if(window.speechSynthesis){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}
function speak(text,force){
  if(!window.speechSynthesis||(!S.voice&&!force))return;
  try{speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  const lang=S.script==='simp'?'zh-CN':'zh-TW';
  u.lang=lang;u.rate=.82;
  const v=voices.find(v=>v.lang===lang)||voices.find(v=>v.lang.replace('_','-').toLowerCase().startsWith(S.script==='simp'?'zh-cn':'zh-tw'))||voices.find(v=>v.lang.toLowerCase().startsWith('zh'));
  if(v)u.voice=v;
  speechSynthesis.speak(u);}catch(e){}
}

let G=null;
function buildBoard(deckId){
  let pool;
  if(deckId==='mix'){pool=[];decksFor(S.level).forEach(d=>pool=pool.concat(d.words.map(w=>Object.assign({_deck:d.id},w))))}
  else{const d=DECK_BY_ID[deckId];pool=d.words.map(w=>Object.assign({_deck:d.id},w))}
  const picked=shuffle(pool).slice(0,Math.min(S.pairs,pool.length));
  const cards=[];
  picked.forEach((w,i)=>{
    cards.push({pid:i,face:'hz',w});
    cards.push({pid:i,face:'mn',w});
  });
  return {deckId,words:picked,cards:shuffle(cards)};
}
function colsFor(n){
  const mobile=window.matchMedia('(max-width:559px)').matches;
  if(mobile)return n<=12?3:4;
  return n<=12?4:(n<=16?4:5);
}
const deckColor=id=>({mil:'#c0362c',dip:'#b5872a',tech:'#0f766e',strait:'#1e3a5f',ind:'#9333ea',intel:'#0369a1',idiom:'#b45309'}[id]||'#6b7280');

function startGame(deckId){
  G=buildBoard(deckId);
  G.flipped=[];G.matched=new Set();G.moves=0;G.streak=0;G.bestStreak=0;G.lock=false;G.started=null;G.timer=null;G.sel=null;
  renderGame();
}
function renderGame(){
  const dk=G.deckId==='mix'?{cn:'綜合',en:'Mixed deck',emo:'🎲'}:DECK_BY_ID[G.deckId];
  const total=G.words.length;
  const open=S.play==='match';
  const against=S.against==='en'?'中 → English':'中 → 拼音';
  app.innerHTML=`
   <div class="ghead">
     <button class="icbtn" onclick="goHome()">‹</button>
     <div class="gtitle"><div class="cn">${G.deckId==='mix'?'🎲 綜合':dk.emo+' '+dk.cn}</div>
       <div class="meta">${dk.en} · ${against}</div></div>
     <div class="hud">
       <div class="chip"><b id="h-match">0/${total}</b><span>Pairs</span></div>
       <div class="chip"><b id="h-moves">0</b><span>Moves</span></div>
       <div class="chip"><b id="h-time">0:00</b><span>Time</span></div>
     </div>
     <button class="icbtn" onclick="startGame(G.deckId)" title="Restart">↻</button>
   </div>
   ${open
     ? `<div class="hint">Tap a <b>字</b> character, then tap its ${S.against==='en'?'English meaning':'拼音'}. All ${total} pairs are face-up — match by meaning, not memory.</div>`
     : `<div class="hint">Flip two cards to find a character and its meaning — remember where they are.</div>`}
   <div id="board"></div>`;
  const board=$('#board');
  board.style.gridTemplateColumns=`repeat(${colsFor(G.cards.length)},1fr)`;
  G.cards.forEach((c,idx)=>{
    const el=document.createElement('div');
    el.className='card '+c.face+(open?' open':'');el.dataset.idx=idx;
    const g=glyph(c.w);
    const hzSize=g.length>=4?'clamp(15px,5vw,24px)':g.length===3?'clamp(19px,6.5vw,30px)':'clamp(24px,9vw,40px)';
    const showPy=S.pinyinHint==='on'&&S.against==='en';
    const content=c.face==='hz'
      ? `<span class="hzt" style="font-size:${hzSize}">${g}</span>${showPy?`<span class="hz-py">${pin(c.w)}</span>`:''}`
      : (S.against==='en'?`<span class="mnt">${c.w.e}</span>`:`<span class="pyt">${pin(c.w)}</span>`);
    const front=`<div class="face front"><span class="tag-dot" style="background:${deckColor(c.w._deck)}"></span>${content}</div>`;
    el.innerHTML=open?front:`<div class="face cover"><div class="ring"><span>${c.face==='hz'?'字':'文'}</span></div></div>${front}`;
    board.appendChild(el);
  });
  board.onclick=e=>{const card=e.target.closest('.card');if(!card)return;const i=+card.dataset.idx;open?onPick(i):onFlip(i)};
}

/* open / vocabulary-match mode: cards visible, select a character then its meaning */
function onPick(idx){
  if(G.lock||G.matched.has(idx))return;
  if(G.started===null){G.started=Date.now();G.timer=setInterval(updTime,1000)}
  const el=$(`.card[data-idx="${idx}"]`);
  if(G.sel===idx){el.classList.remove('sel');G.sel=null;return}
  if(G.sel===null){
    G.sel=idx;el.classList.add('sel');sfxFlip();
    const c=G.cards[idx];if(c.face==='hz')speak(glyph(c.w));
    return;
  }
  const a=G.sel,b=idx;G.sel=null;
  const ca=G.cards[a],cb=G.cards[b];
  $(`.card[data-idx="${a}"]`).classList.remove('sel');
  G.moves++;$('#h-moves').textContent=G.moves;
  if(ca.pid===cb.pid){
    G.streak++;G.bestStreak=Math.max(G.bestStreak,G.streak);
    [a,b].forEach(i=>$(`.card[data-idx="${i}"]`).classList.add('matched'));
    sfxMatch();speak(glyph(ca.w));showToast(ca.w);
    G.matched.add(a);G.matched.add(b);STAT.matches++;saveAll();
    $('#h-match').textContent=(G.matched.size/2)+'/'+G.words.length;updStreak();
    if(G.matched.size===G.cards.length)setTimeout(win,520);
  }else{
    G.streak=0;updStreak();sfxBad();G.lock=true;
    [a,b].forEach(i=>$(`.card[data-idx="${i}"]`).classList.add('bad'));
    setTimeout(()=>{[a,b].forEach(i=>$(`.card[data-idx="${i}"]`).classList.remove('bad'));G.lock=false},560);
  }
}
function onFlip(idx){
  if(G.lock)return;
  const c=G.cards[idx];
  if(G.matched.has(idx)||G.flipped.includes(idx))return;
  if(G.flipped.length>=2)return;
  if(G.started===null){G.started=Date.now();G.timer=setInterval(updTime,1000)}
  const el=$(`.card[data-idx="${idx}"]`);
  el.classList.add('flipped');
  G.flipped.push(idx);
  sfxFlip();
  if(c.face==='hz')speak(glyph(c.w));
  if(G.flipped.length===2)evaluate();
}
function evaluate(){
  G.lock=true;G.moves++;$('#h-moves').textContent=G.moves;
  const [a,b]=G.flipped;
  const ca=G.cards[a],cb=G.cards[b];
  if(ca.pid===cb.pid){
    G.streak++;G.bestStreak=Math.max(G.bestStreak,G.streak);
    setTimeout(()=>{
      [a,b].forEach(i=>{G.matched.add(i);$(`.card[data-idx="${i}"]`).classList.add('matched')});
      sfxMatch();speak(glyph(ca.w));showToast(ca.w);
      STAT.matches++;saveAll();
      G.flipped=[];G.lock=false;
      $('#h-match').textContent=(G.matched.size/2)+'/'+G.words.length;
      updStreak();
      if(G.matched.size===G.cards.length)setTimeout(win,560);
    },360);
  }else{
    G.streak=0;updStreak();sfxBad();
    [a,b].forEach(i=>$(`.card[data-idx="${i}"]`).classList.add('bad'));
    setTimeout(()=>{
      [a,b].forEach(i=>{const el=$(`.card[data-idx="${i}"]`);el.classList.remove('flipped','bad')});
      G.flipped=[];G.lock=false;
    },820);
  }
}
function updTime(){if(G&&G.started)$('#h-time').textContent=fmtTime(Date.now()-G.started)}
function updStreak(){
  const hud=document.querySelector('.hud');
  let s=document.getElementById('h-streak-chip');
  if(G.streak>=2){
    if(!s){s=document.createElement('div');s.id='h-streak-chip';s.className='chip streak';hud.insertBefore(s,hud.firstChild)}
    s.innerHTML=`<b>🔥${G.streak}</b><span>Streak</span>`;
  }else if(s){s.remove()}
}
function showToast(w){
  const t=$('#toast');
  t.innerHTML=`<span class="tz">${glyph(w)}</span><div class="ti">
    <div class="py">${pin(w)}</div><div class="en">${w.e}</div>${w.n?`<div class="nt">${w.n}</div>`:''}</div>
    <button class="spk" onclick="speak('${glyph(w)}',true)">🔊</button>`;
  t.classList.add('show');
  clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2000);
}

/* =========================================================================
   WIN
   ========================================================================= */
function win(){
  clearInterval(G.timer);
  const ms=Date.now()-G.started;
  const perfect=G.words.length;
  const stars=G.moves<=Math.ceil(perfect*1.45)?3:G.moves<=Math.ceil(perfect*2.1)?2:1;
  const acc=Math.round(perfect/G.moves*100);
  sfxWin();confetti();
  // best tracking
  const key=G.deckId+'_'+G.words.length;
  const prev=STAT.best[key];
  let isBest=false;
  if(!prev||ms<prev.ms){STAT.best[key]={ms,moves:G.moves,stars};isBest=!!prev}
  STAT.games++;
  // daily streak
  const td=todayStr();
  if(STAT.lastDay!==td){
    const y=new Date();y.setDate(y.getDate()-1);
    const yd=y.getFullYear()+'-'+(y.getMonth()+1)+'-'+y.getDate();
    STAT.dailyStreak=(STAT.lastDay===yd)?STAT.dailyStreak+1:1;
    STAT.lastDay=td;
  }
  saveAll();
  const dk=G.deckId==='mix'?{cn:'綜合',en:'Mixed'}:DECK_BY_ID[G.deckId];
  app.innerHTML=`
    <div class="win">
      <div class="big">完成</div><div class="sub">Complete · ${dk.en}</div>
      <div class="stars">${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</div>
      ${isBest?'<div class="newbest">✦ New best time</div>':''}
      <div class="wstats">
        <div class="stat"><b>${fmtTime(ms)}</b><span>Time</span></div>
        <div class="stat"><b>${G.moves}</b><span>Moves</span></div>
        <div class="stat"><b>${acc}%</b><span>Accuracy</span></div>
        <div class="stat"><b>🔥${G.bestStreak}</b><span>Best run</span></div>
      </div>
      <div class="review">
        <div class="rh">Terms reviewed — tap 🔊 to hear</div>
        ${G.words.map(w=>`<div class="rv"><span class="rz">${glyph(w)}</span>
          <div class="ri"><span class="py">${pin(w)}</span> · <span class="en">${w.e}</span>${w.n?`<div class="nt">${w.n}</div>`:''}</div>
          <button class="spk" onclick="speak('${glyph(w)}',true)">🔊</button></div>`).join('')}
      </div>
      <div class="btns">
        <button class="btn ghost" onclick="goHome()">Choose deck</button>
        <button class="btn primary" onclick="startGame('${G.deckId}')">Play again</button>
      </div>
    </div>`;
  window.scrollTo(0,0);
}
function confetti(){
  const cols=['#c0362c','#b5872a','#0f766e','#1e3a5f','#e3b341'];
  for(let i=0;i<80;i++){
    const d=document.createElement('div');d.className='confetti';
    d.style.left=Math.random()*100+'vw';
    d.style.background=cols[i%cols.length];
    d.style.transform='rotate('+Math.random()*360+'deg)';
    const dur=2200+Math.random()*1600,dx=(Math.random()-.5)*240;
    document.body.appendChild(d);
    d.animate([{transform:`translate(0,0) rotate(0)`,opacity:1},
      {transform:`translate(${dx}px,${window.innerHeight+40}px) rotate(${Math.random()*720}deg)`,opacity:.9}],
      {duration:dur,easing:'cubic-bezier(.3,.6,.5,1)'}).onfinish=()=>d.remove();
  }
}

/* =========================================================================
   HOME
   ========================================================================= */
function seg(field,opts){
  return `<div class="seg">${opts.map(o=>`<button class="${S[field]===o.v?'on':''}" onclick="setOpt('${field}','${o.v}')">${o.l}</button>`).join('')}</div>`;
}

  G=null;
  app.innerHTML=`
   <div class="brand">
     <div class="seal">字</div>
     <h1>漢字配對</h1>
     <div class="en">Mandarin Matchup</div>
     <div class="tag">Keep your Mandarin sharp — defense, diplomacy, technology, cross-Strait affairs &amp; strategic idioms.</div>
   </div>
   <div class="statbar">
     <div class="stat"><b>${STAT.dailyStreak||0}</b><span>Day streak</span></div>

   </div>

   <div class="section-h">Setup</div>
   <div class="opts">
     <div class="optrow"><div class="lbl">Level<small>Foundational everyday vs. professional</small></div>

     <div class="optrow"><div class="lbl">Game mode<small>Open match (see all) · or flip-memory</small></div>
       ${seg('play',[{v:'match',l:'Match'},{v:'memory',l:'Memory'}])}</div>
     <div class="optrow"><div class="lbl">Script<small>Taiwan vs. mainland characters</small></div>
       ${seg('script',[{v:'trad',l:'繁體'},{v:'simp',l:'简体'}])}</div>
     <div class="optrow"><div class="lbl">Match against<small>What the partner card shows</small></div>
       ${seg('against',[{v:'en',l:'English'},{v:'pinyin',l:'拼音'}])}</div>
     <div class="optrow"><div class="lbl">Pinyin hints<small>Pronunciation under characters (when matching English)</small></div>
       ${seg('pinyinHint',[{v:'on',l:'On'},{v:'off',l:'Off'}])}</div>
     <div class="optrow"><div class="lbl">Board size<small>Pairs per round</small></div>
       ${seg('pairs',[{v:6,l:'6'},{v:8,l:'8'},{v:10,l:'10'}])}</div>
     <div class="toggles">
       <button class="tgl ${S.voice?'on':''}" onclick="setOpt('voice',!S.voice)">🔊 ${S.voice?'Voice on':'Voice off'}</button>
       <button class="tgl ${S.sound?'on':''}" onclick="setOpt('sound',!S.sound)">🎵 ${S.sound?'Sound on':'Sound off'}</button>
       <button class="tgl ${S.theme==='dark'?'on':''}" onclick="toggleTheme()">${S.theme==='dark'?'🌙 Dark':'☀️ Light'}</button>
     </div>
   </div>

   <div class="section-h">Choose a deck — ${S.level==='basic'?'基礎 Foundational':'專業 Professional'}</div>
   <div class="decks">
     <button class="deck mix" onclick="startGame('mix')">
       <span class="emo">🎲</span><div class="txt"><div class="cn">綜合 · Mixed</div>
       <div class="enn">A random draw from this level</div><div class="study">Play ▸</div></div>
       <span class="cnt">${decksFor(S.level).reduce((n,d)=>n+d.words.length,0)}</span>
     </button>
     ${decksFor(S.level).map(d=>`<button class="deck" onclick="startGame('${d.id}')">
        <span class="cnt">${d.words.length}</span>
        <span class="emo">${d.emo}</span>
        <div class="cn">${d.cn}</div><div class="enn">${d.en}</div>
        <div class="study" onclick="event.stopPropagation();browse('${d.id}')">Study list ▸</div>
      </button>`).join('')}
   </div>
   <div class="foot">Built for the China hand — <b>軍事 · 外交 · 科技 · 台海</b><br>Vocabulary at a professional level. 加油!</div>`;
}

/* ---------- options ---------- */
function setOpt(f,v){
  if(f==='pairs')v=+v;
  S[f]=v;saveAll();
  if(!G)renderHome();
}
function toggleTheme(){S.theme=S.theme==='dark'?'light':'dark';applyTheme();saveAll();renderHome()}
function applyTheme(){document.documentElement.setAttribute('data-theme',S.theme==='dark'?'dark':'light')}

/* ---------- browse / study list ---------- */
function browse(id){
  const d=DECK_BY_ID[id];
  $('#m-cn').textContent=d.emo+' '+d.cn;
  $('#m-en').textContent=d.en;
  $('#m-body').innerHTML=d.words.map(w=>`<div class="rv"><span class="rz">${glyph(w)}</span>
     <div class="ri"><span class="py">${pin(w)}</span> · <span class="en">${w.e}</span>${w.n?`<div class="nt">${w.n}</div>`:''}</div>
     <button class="spk" onclick="speak('${glyph(w)}',true)">🔊</button></div>`).join('');
  $('#modal').classList.add('show');
}
function closeBrowse(){$('#modal').classList.remove('show')}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeBrowse()});

/* ---------- nav ---------- */
function goHome(){if(G&&G.timer)clearInterval(G.timer);renderHome();window.scrollTo(0,0)}
window.addEventListener('resize',()=>{const b=$('#board');if(b&&G)b.style.gridTemplateColumns=`repeat(${colsFor(G.cards.length)},1fr)`});

/* ---------- boot ---------- */
applyTheme();
renderHome();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
