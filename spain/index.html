<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>¡Vámonos! · Familia España</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="España">
<meta name="theme-color" content="#d8412f">
<link rel="icon" href="./favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="./favicon-16.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#fff7ef; --surface:#ffffff; --surface2:#fdf0e4;
  --ink:#2c1d14; --muted:#6a5848; --line:#f1e4d5;
  --red:#d8412f; --red-soft:#fde7e2; --red-ink:#a52a1c;
  --blue:#1b6ec2; --blue-soft:#e3f0fb; --blue-ink:#155596;
  --gold:#ef9f00; --gold-soft:#fef0d2; --gold-ink:#9a6800;
  --green:#3a9d5d; --green-soft:#e3f5e9; --green-ink:#27764a;
  --purple:#7c5cd6; --purple-soft:#ede7fb;
  --shadow:0 1px 2px rgba(90,45,20,.06),0 4px 16px rgba(90,45,20,.07);
  --shadow-lg:0 14px 44px rgba(90,45,20,.20);
  --rad:18px; --rad-s:12px;
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --disp:"Trebuchet MS","Segoe UI",sans-serif;
}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{font-family:var(--ui);background:var(--bg);color:var(--ink);min-height:100vh;line-height:1.5;
  background-image:radial-gradient(circle at 8% 2%,rgba(239,159,0,.10),transparent 38%),radial-gradient(circle at 95% 4%,rgba(27,110,194,.08),transparent 36%);}
#app{max-width:760px;margin:0 auto;min-height:100vh}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
a{color:var(--blue-ink)}
.hide{display:none!important}
.main{padding:14px 16px 96px;}

/* ===== bottom nav ===== */
.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.94);backdrop-filter:saturate(1.4) blur(10px);
  border-top:1px solid var(--line);display:flex;z-index:100;padding-bottom:env(safe-area-inset-bottom);max-width:760px;margin:0 auto}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 8px;color:var(--muted);
  font-size:10px;font-weight:700;letter-spacing:.02em;transition:.15s;border-top:2px solid transparent}
.nb svg{width:23px;height:23px}
.nb.on{color:var(--red);border-top-color:var(--red)}

/* ===== hero / headers ===== */
.hero{background:linear-gradient(140deg,#e0492f,#f0a500);color:#fff;border-radius:22px;padding:20px 20px 22px;
  box-shadow:var(--shadow);position:relative;overflow:hidden;margin-top:6px}
.hero::after{content:"";position:absolute;right:-30px;top:-30px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero::before{content:"";position:absolute;right:34px;top:42px;width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.13)}
.hero h1{font-family:var(--disp);font-size:27px;font-weight:800;letter-spacing:.3px;line-height:1.1}
.hero .sub{font-size:13px;opacity:.95;margin-top:5px;font-weight:600}
.hero .who{font-size:12px;opacity:.9;margin-top:9px;background:rgba(255,255,255,.18);display:inline-block;padding:4px 11px;border-radius:20px;font-weight:700}

.cd{display:flex;gap:8px;margin-top:16px;position:relative;z-index:1}
.cd .u{flex:1;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.25);border-radius:14px;padding:10px 4px;text-align:center}
.cd .u b{display:block;font-size:26px;font-weight:800;font-family:var(--disp);line-height:1}
.cd .u span{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;opacity:.9;font-weight:700}
.cd-note{text-align:center;font-size:12px;color:var(--muted);margin-top:10px;font-weight:600}

.sect-h{font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);font-weight:800;margin:24px 4px 11px;display:flex;align-items:center;gap:8px}
.sect-h .ln{flex:1;height:1px;background:var(--line)}

/* ===== journey strip ===== */
.journey{background:var(--surface);border:1px solid var(--line);border-radius:var(--rad);padding:16px 14px;box-shadow:var(--shadow)}
.jrow{display:flex;align-items:stretch}
.jstop{flex:1;text-align:center;position:relative;min-width:0}
.jstop .dot{width:46px;height:46px;border-radius:50%;margin:0 auto;display:flex;align-items:center;justify-content:center;font-size:23px;
  background:var(--blue-soft);border:2px solid var(--blue);box-shadow:var(--shadow)}
.jstop.s0 .dot{background:var(--red-soft);border-color:var(--red)}
.jstop.s2 .dot{background:var(--gold-soft);border-color:var(--gold)}
.jstop .nm{font-size:13px;font-weight:800;margin-top:7px}
.jstop .mt{font-size:10.5px;color:var(--muted);margin-top:1px;font-weight:600}
.jlink{flex:0 0 58px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:11px;color:var(--muted)}
.jlink .ic{font-size:18px}
.jlink .ds{font-size:8.5px;letter-spacing:.04em;text-transform:uppercase;font-weight:700;margin-top:2px;text-align:center;line-height:1.2}
.jlink .dl{width:100%;height:2px;background:repeating-linear-gradient(90deg,var(--line) 0 6px,transparent 6px 11px);margin-top:8px}

/* ===== stat chips ===== */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--rad-s);padding:12px 6px;text-align:center;box-shadow:var(--shadow)}
.stat b{display:block;font-size:22px;font-weight:800;font-family:var(--disp);line-height:1;color:var(--red)}
.stat span{font-size:9.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-top:4px;display:block}

/* ===== generic card ===== */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--rad);padding:15px 16px;box-shadow:var(--shadow);margin-bottom:11px}
.card h3{font-size:16px;font-weight:800}
.lead{font-size:13.5px;color:var(--muted);font-weight:600}

/* ===== checklist ===== */
.chk{display:flex;align-items:flex-start;gap:12px;padding:12px 13px;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--rad-s);box-shadow:var(--shadow);margin-bottom:8px;cursor:pointer;transition:.12s}
.chk:active{transform:scale(.99)}
.chk .box{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);flex-shrink:0;display:flex;align-items:center;
  justify-content:center;font-size:14px;color:#fff;transition:.15s;margin-top:1px;background:var(--surface2)}
.chk.on .box{background:var(--green);border-color:var(--green)}
.chk .ct{flex:1;min-width:0}
.chk .ct b{font-size:14px;font-weight:700;display:block}
.chk.on .ct b{text-decoration:line-through;color:var(--muted)}
.chk .ct small{font-size:12px;color:var(--muted);display:block;margin-top:2px;line-height:1.45}
.chk .pr{flex-shrink:0;font-size:9px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:20px;margin-top:2px}
.pr-now{background:var(--red-soft);color:var(--red-ink)}
.pr-soon{background:var(--gold-soft);color:var(--gold-ink)}

/* ===== leg tabs ===== */
.legtabs{display:flex;gap:7px;background:var(--surface2);border-radius:13px;padding:4px;margin:2px 0 14px;border:1px solid var(--line)}
.legtab{flex:1;text-align:center;padding:9px 4px;border-radius:10px;font-size:12.5px;font-weight:800;color:var(--muted);transition:.15s;line-height:1.15}
.legtab small{display:block;font-weight:600;font-size:10px;opacity:.85;margin-top:1px}
.legtab.on{background:var(--surface);color:var(--red);box-shadow:var(--shadow)}

/* ===== day cards ===== */
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--rad);box-shadow:var(--shadow);margin-bottom:11px;overflow:hidden}
.day .dh{display:flex;align-items:center;gap:12px;padding:13px 15px}
.day .demo{width:44px;height:44px;border-radius:12px;background:var(--blue-soft);display:flex;align-items:center;justify-content:center;font-size:23px;flex-shrink:0}
.day.travel .demo{background:var(--gold-soft)}
.day .dti{flex:1;min-width:0}
.day .ddate{font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--red)}
.day .dttl{font-size:15px;font-weight:800;margin-top:1px}
.day .dsub{font-size:12px;color:var(--muted);font-weight:600;margin-top:1px}
.day .dbody{padding:0 15px 14px}
.tl{list-style:none;margin-top:2px}
.tl li{display:flex;gap:11px;padding:7px 0;font-size:13.5px;line-height:1.45}
.tl li .tm{flex:0 0 52px;font-size:11px;font-weight:800;color:var(--blue-ink);padding-top:2px}
.tl li .tx{flex:1}
.tl li .tx b{font-weight:700}
.tl li .tx em{font-style:normal;color:var(--muted);font-size:12px;display:block;margin-top:1px}

/* ===== place / getaway cards ===== */
.filters{display:flex;gap:7px;overflow-x:auto;padding:2px 0 12px;margin:0 -2px;-webkit-overflow-scrolling:touch}
.filters::-webkit-scrollbar{display:none}
.fchip{flex:0 0 auto;padding:7px 13px;border-radius:20px;font-size:12.5px;font-weight:700;background:var(--surface);
  border:1px solid var(--line);color:var(--muted);box-shadow:var(--shadow);white-space:nowrap}
.fchip.on{background:var(--red);color:#fff;border-color:var(--red)}
.place{background:var(--surface);border:1px solid var(--line);border-radius:var(--rad);box-shadow:var(--shadow);margin-bottom:11px;overflow:hidden}
.place .ph{display:flex;align-items:flex-start;gap:13px;padding:14px 15px}
.place .pemo{width:46px;height:46px;border-radius:13px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:25px;flex-shrink:0}
.place .pi{flex:1;min-width:0}
.place .pnm{font-size:15.5px;font-weight:800;line-height:1.2}
.place .pmeta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tag{font-size:10px;font-weight:800;letter-spacing:.02em;padding:3px 8px;border-radius:20px;background:var(--surface2);color:var(--muted)}
.tag.kid{background:var(--gold-soft);color:var(--gold-ink)}
.tag.drv{background:var(--blue-soft);color:var(--blue-ink)}
.tag.book{background:var(--red-soft);color:var(--red-ink)}
.place .pwhy{font-size:13px;color:var(--ink);padding:0 15px 4px;line-height:1.5}
.place .ptip{font-size:12.5px;color:var(--green-ink);background:var(--green-soft);margin:8px 15px 14px;padding:9px 11px;border-radius:10px;line-height:1.45}
.place .ptip b{color:var(--green-ink)}
.exp-toggle{font-size:12px;font-weight:800;color:var(--blue-ink);padding:0 15px 13px;display:flex;align-items:center;gap:5px}

/* ===== kids ===== */
.kidwrap{}
.kidhero{background:linear-gradient(135deg,#7c5cd6,#1b6ec2);color:#fff;border-radius:22px;padding:18px;box-shadow:var(--shadow);margin-top:6px;position:relative;overflow:hidden}
.kidhero::after{content:"⭐";position:absolute;right:14px;top:10px;font-size:60px;opacity:.18}
.kidhero h1{font-family:var(--disp);font-size:23px;font-weight:800}
.kidhero p{font-size:12.5px;opacity:.95;margin-top:3px;font-weight:600;max-width:30ch}
.rankbar{display:flex;align-items:center;gap:12px;margin-top:14px;background:rgba(255,255,255,.16);border-radius:14px;padding:11px 13px}
.rankbar .rk{font-size:30px}
.rankbar .ri{flex:1;min-width:0}
.rankbar .ri b{font-size:15px;font-weight:800;display:block}
.rankbar .ri .pmini{height:7px;background:rgba(255,255,255,.25);border-radius:5px;margin-top:6px;overflow:hidden}
.rankbar .ri .pmini i{display:block;height:100%;background:var(--gold);border-radius:5px;transition:.4s}
.rankbar .ri small{font-size:11px;opacity:.95;font-weight:600}
.rankbar .stars{text-align:center;flex-shrink:0}
.rankbar .stars b{font-size:24px;font-weight:800;display:block;line-height:1}
.rankbar .stars span{font-size:9px;letter-spacing:.06em;text-transform:uppercase;opacity:.9;font-weight:700}

.ageseg{display:flex;background:var(--surface2);border-radius:12px;padding:4px;border:1px solid var(--line);margin:14px 0 4px}
.ageseg button{flex:1;padding:9px 4px;border-radius:9px;font-size:12.5px;font-weight:800;color:var(--muted);line-height:1.15;transition:.15s}
.ageseg button small{display:block;font-weight:600;font-size:10px}
.ageseg button.on{background:var(--purple);color:#fff;box-shadow:var(--shadow)}

.passport{background:var(--surface);border:1px dashed var(--gold);border-radius:var(--rad);padding:14px;box-shadow:var(--shadow)}
.stampgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:10px}
.stamp{aspect-ratio:1;border-radius:14px;background:var(--surface2);border:2px dashed var(--line);display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;padding:4px;position:relative;transition:.2s}
.stamp .se{font-size:24px;filter:grayscale(1);opacity:.35;transition:.2s}
.stamp .sl{font-size:9px;font-weight:800;color:var(--muted);margin-top:3px;line-height:1.1}
.stamp.got{background:var(--gold-soft);border:2px solid var(--gold);transform:rotate(-3deg)}
.stamp.got .se{filter:none;opacity:1}
.stamp.got .sl{color:var(--gold-ink)}
.stamp.got::after{content:"✓";position:absolute;top:3px;right:5px;font-size:11px;font-weight:900;color:var(--green)}

.decks{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:2px}
.deck{background:var(--surface);border:1px solid var(--line);border-radius:var(--rad);padding:14px;box-shadow:var(--shadow);
  text-align:left;position:relative;transition:transform .12s,box-shadow .2s,border-color .2s;overflow:hidden}
.deck:active{transform:scale(.98)}
.deck .demo{font-size:30px}
.deck .dnm{font-size:15px;font-weight:800;margin-top:7px}
.deck .den{font-size:11px;color:var(--muted);font-weight:600;margin-top:1px}
.deck .dct{position:absolute;top:12px;right:12px;font-size:10px;font-weight:800;color:var(--purple);background:var(--purple-soft);padding:2px 8px;border-radius:20px}
.deck.mastered{border-color:var(--gold)}
.deck.mastered .dct{background:var(--gold-soft);color:var(--gold-ink)}

/* deck detail */
.gamebtns{display:flex;flex-direction:column;gap:9px;margin:4px 0 16px}
.gbtn{display:flex;align-items:center;gap:13px;background:var(--surface);border:1px solid var(--line);border-radius:var(--rad-s);
  padding:13px 15px;box-shadow:var(--shadow);text-align:left;transition:.12s}
.gbtn:active{transform:scale(.99)}
.gbtn .ge{width:42px;height:42px;border-radius:11px;background:var(--purple-soft);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.gbtn .gi{flex:1}
.gbtn .gi b{font-size:14.5px;font-weight:800;display:block}
.gbtn .gi small{font-size:12px;color:var(--muted);font-weight:600}
.gbtn .arr{color:var(--muted);font-size:18px}

.wordrow{display:flex;align-items:center;gap:13px;padding:11px 4px;border-bottom:1px solid var(--line)}
.wordrow:last-child{border-bottom:none}
.wordrow .we{font-size:28px;width:40px;text-align:center}
.wordrow .wi{flex:1}
.wordrow .wes{font-size:16px;font-weight:800;color:var(--red)}
.wordrow .wen{font-size:12px;color:var(--muted);font-weight:600}
.spk{width:40px;height:40px;border-radius:50%;background:var(--blue-soft);color:var(--blue-ink);display:flex;align-items:center;
  justify-content:center;font-size:18px;flex-shrink:0;border:1px solid var(--blue);box-shadow:var(--shadow)}
.spk:active{transform:scale(.9)}

/* flashcard */
.fc-wrap{display:flex;flex-direction:column;align-items:center;padding:8px 0}
.flashcard{width:100%;max-width:330px;aspect-ratio:3/3.6;perspective:1200px;margin:6px auto 4px}
.flashcard .inner{position:relative;width:100%;height:100%;transition:transform .5s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d;cursor:pointer}
.flashcard.flip .inner{transform:rotateY(180deg)}
.flashcard .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:24px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:var(--shadow-lg);padding:20px;text-align:center}
.flashcard .front{background:linear-gradient(150deg,#fff,var(--surface2));border:2px solid var(--gold)}
.flashcard .front .big{font-size:96px;line-height:1}
.flashcard .front .hint{font-size:13px;color:var(--muted);font-weight:700;margin-top:14px}
.flashcard .back{background:linear-gradient(150deg,var(--purple),var(--blue));color:#fff;transform:rotateY(180deg)}
.flashcard .back .es{font-size:38px;font-weight:800;font-family:var(--disp)}
.flashcard .back .en{font-size:17px;opacity:.95;margin-top:6px;font-weight:600}
.flashcard .back .sayit{margin-top:16px;background:rgba(255,255,255,.2);border-radius:20px;padding:8px 16px;font-size:13px;font-weight:800}
.fc-ctrls{display:flex;gap:10px;width:100%;max-width:330px;margin-top:12px}
.fc-ctrls button{flex:1;padding:13px;border-radius:13px;font-size:14px;font-weight:800;box-shadow:var(--shadow)}
.fc-nav{background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.fc-know{background:var(--green);color:#fff}
.fc-count{font-size:12px;color:var(--muted);font-weight:700;margin-top:12px}

/* listen & match game */
.gtop{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.gtop .gprog{flex:1}
.gtop .gprog .bar{height:9px;background:var(--surface2);border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.gtop .gprog .bar i{display:block;height:100%;background:var(--green);border-radius:6px;transition:.3s}
.gtop .gprog small{font-size:11px;font-weight:700;color:var(--muted);margin-top:3px;display:block}
.gtop .gstar{background:var(--gold-soft);color:var(--gold-ink);font-weight:800;font-size:14px;padding:6px 12px;border-radius:20px;border:1px solid var(--gold)}
.bigplay{width:100%;background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff;border-radius:18px;padding:22px;
  font-size:18px;font-weight:800;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:14px}
.bigplay .pic{font-size:30px}
.bigplay:active{transform:scale(.99)}
.opts4{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.opt{aspect-ratio:1.35;background:var(--surface);border:2px solid var(--line);border-radius:18px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;font-size:48px;box-shadow:var(--shadow);transition:.15s;position:relative}
.opt .ol{font-size:13px;font-weight:800;margin-top:4px;color:var(--ink)}
.opt:active{transform:scale(.96)}
.opt.right{border-color:var(--green);background:var(--green-soft);animation:pop .4s}
.opt.wrong{border-color:var(--red);background:var(--red-soft);opacity:.7}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.08)}100%{transform:scale(1)}}

/* match grid */
.matchgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:4px}
.mcard{aspect-ratio:1/1.18;border-radius:14px;cursor:pointer;position:relative;transform-style:preserve-3d;transition:transform .4s}
.mcard.flip{transform:rotateY(180deg)}
.mcard .mf{position:absolute;inset:0;border-radius:14px;display:flex;align-items:center;justify-content:center;text-align:center;
  padding:5px;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:var(--shadow)}
.mcard .cover{background:linear-gradient(150deg,var(--red),var(--gold));color:#fff;font-size:24px;border:2px solid rgba(255,255,255,.3)}
.mcard .reveal{transform:rotateY(180deg);background:var(--surface);border:2px solid var(--line)}
.mcard .reveal .em{font-size:34px}
.mcard .reveal .tx{font-size:11px;font-weight:800;color:var(--red);line-height:1.08;word-break:break-word;padding:2px}
.mcard.done .reveal{border-color:var(--green);background:var(--green-soft)}
.mcard.miss .reveal{border-color:var(--red)}

/* celebrate */
.celebrate{text-align:center;padding:30px 16px}
.celebrate .big{font-size:72px}
.celebrate h2{font-size:24px;font-weight:800;margin-top:6px;color:var(--red)}
.celebrate p{font-size:14px;color:var(--muted);font-weight:600;margin-top:6px}
.celebrate .got{font-size:14px;font-weight:800;color:var(--gold-ink);background:var(--gold-soft);display:inline-block;
  padding:8px 16px;border-radius:20px;margin-top:14px}

/* phrasebook / info */

/* ─────────────── STATE ─────────────── */
const LS = 'spain_trip_v1';
let ST = { view:'trip', leg:'madrid', exFilter:'all', age:'7',
           stars:0, mastered:{}, checks:{}, stamps:{}, packing:{}, expanded:{} };
function save(){
  try { localStorage.setItem(LS, JSON.stringify({
    stars:ST.stars, mastered:ST.mastered, checks:ST.checks, stamps:ST.stamps, packing:ST.packing, age:ST.age
  })); } catch(e){}
}
function load(){
  try { const d = JSON.parse(localStorage.getItem(LS)||'{}'); Object.assign(ST, d);
    ST.mastered=ST.mastered||{}; ST.checks=ST.checks||{}; ST.stamps=ST.stamps||{}; ST.packing=ST.packing||{}; ST.expanded={};
  } catch(e){}
}

/* ─────────────── TTS (es-ES) — mirrors the Calella app ─────────────── */
let ttsVoice = null;
function initTTS(){
  if(!window.speechSynthesis) return;
  function find(){ const vs=speechSynthesis.getVoices(); ttsVoice = vs.find(v=>v.lang && v.lang.startsWith('es')) || null; }
  find(); speechSynthesis.onvoiceschanged = find;
}
initTTS();
function speak(txt){
  if(!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(txt);
  u.lang='es-ES'; if(ttsVoice) u.voice=ttsVoice; u.rate=0.82; u.pitch=1.06;
  speechSynthesis.speak(u);
}

/* ─────────────── HELPERS ─────────────── */
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function todayMid(){ const d=new Date(); d.setHours(0,0,0,0); return d; }
function parseISO(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function fmtDate(iso){ return parseISO(iso).toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'}); }
function isoOf(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function daysBetween(a,b){ return Math.round((parseISO(b)-a)/86400000); }
function nights(aIso,bIso){ return Math.round((parseISO(bIso)-parseISO(aIso))/86400000); }
function totalWords(){ return DECK_ORDER.reduce((a,k)=>a+DECKS[k].words.length,0); }
function masteredCount(){ return Object.values(ST.mastered).reduce((a,o)=>a+Object.keys(o||{}).length,0); }
function deckMastered(k){ const o=ST.mastered[k]||{}; return Object.keys(o).length>=DECKS[k].words.length; }
function rankFor(stars){
  if(stars>=120) return {e:'🏆', n:'¡Campeón!', next:null, base:120};
  if(stars>=60)  return {e:'🌟', n:'Viajero', next:120, base:60};
  if(stars>=20)  return {e:'🗺️', n:'Aventurero', next:60, base:20};
  return {e:'🧭', n:'Explorador', next:20, base:0};
}
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function addStars(n){ ST.stars+=n; save(); }
function masterWord(deck,wi){ ST.mastered[deck]=ST.mastered[deck]||{}; if(!ST.mastered[deck][wi]){ ST.mastered[deck][wi]=1; } save(); }

function viewTrip(){
  const today=todayMid();
  const todayISO=isoOf(today);
  const totalNights=nights(TRIP.landISO,TRIP.endISO);
  // seed the countdown from the SAME 18:00 target the live ticker uses (no first-paint flash)
  const tgt=new Date(2026,6,5,18,0,0);
  let secs=Math.max(0,Math.floor((tgt-new Date())/1000));
  const pad2=n=>String(n).padStart(2,'0');
  const counter=`<div class="cd">
      <div class="u"><b id="cd-d">${Math.floor(secs/86400)}</b><span>days</span></div>
      <div class="u"><b id="cd-h">${pad2(Math.floor(secs%86400/3600))}</b><span>hours</span></div>
      <div class="u"><b id="cd-m">${pad2(Math.floor(secs%3600/60))}</b><span>min</span></div>
      <div class="u"><b id="cd-s">${pad2(secs%60)}</b><span>sec</span></div>
    </div>`;
  let cd;
  if(todayISO < TRIP.departISO){
    cd=counter+`<div class="cd-note">until you fly to España 🇪🇸</div>`;
  } else if(todayISO < TRIP.landISO){
    // departure day — in the air, landing Madrid mañana; keep the live countdown ticking
    cd=counter+`<div class="cd-note">✈️ En route to España — ¡Madrid por la mañana!</div>`;
  } else if(todayISO <= TRIP.endISO){
    const dayN=daysBetween(parseISO(TRIP.landISO),todayISO)+1;
    cd=`<div class="cd-note" style="color:#fff;font-size:14px;margin-top:14px">¡Ya estáis en España! Day ${dayN} of the adventure 🎉</div>`;
  } else {
    cd=`<div class="cd-note" style="color:#fff;margin-top:14px">¡Qué viaje! Hope it was unforgettable. 💛</div>`;
  }

  const journey=`
  <div class="journey">
    <div class="jrow">
      <div class="jstop s0"><div class="dot">🏙️</div><div class="nm">Madrid</div><div class="mt">Jul 6–10</div></div>
      <div class="jlink"><div class="ic">🚄</div><div class="ds">AVE train</div><div class="dl"></div></div>
      <div class="jstop s1"><div class="dot">🌆</div><div class="nm">Barcelona</div><div class="mt">Jul 10 · car</div></div>
      <div class="jlink"><div class="ic">🚗</div><div class="ds">50 min</div><div class="dl"></div></div>
      <div class="jstop s2"><div class="dot">🏖️</div><div class="nm">Calella</div><div class="mt">→ early Aug</div></div>
    </div>
  </div>`;

  const stats=`<div class="stats">
    <div class="stat"><b>${totalNights}</b><span>Nights</span></div>
    <div class="stat"><b>3</b><span>Home bases</span></div>
    <div class="stat"><b>${GETAWAYS.length}</b><span>Getaways</span></div>
    <div class="stat"><b>${totalWords()}</b><span>Spanish words</span></div>
  </div>`;

  const prepLeft=PREP.filter(p=>!ST.checks[p.k]).length;
  const prepCard=`
    <div class="sect-h">Before you go <span class="ln"></span><span style="color:var(--red)">${prepLeft} left</span></div>
    ${PREP.slice(0,4).map(p=>chkRow(p)).join('')}
    <button class="btn-ghost" onclick="goto('info')">See all ${PREP.length} prep items & packing →</button>`;

  return `<div class="main">
    <div class="hero">
      <h1>¡Vámonos a España!</h1>
      <div class="sub">Madrid · Barcelona · Calella — July 2026</div>
      <div class="who">👨‍👩‍👧‍👦 The Vaughn family adventure</div>
      ${cd}
    </div>
    <div class="sect-h">Your journey <span class="ln"></span></div>
    ${journey}
    ${stats}
    ${prepCard}
    <div class="sect-h">Jump in <span class="ln"></span></div>
    <div class="decks">
      <button class="deck" onclick="goto('plan')"><div class="demo">🗓️</div><div class="dnm">The Plan</div><div class="den">Day-by-day itinerary</div></button>
      <button class="deck" onclick="goto('explore')"><div class="demo">🧭</div><div class="dnm">Explore</div><div class="den">Sights & getaways</div></button>
      <button class="deck" onclick="goto('kids')"><div class="demo">⭐</div><div class="dnm">¡Niños!</div><div class="den">Spanish games</div></button>
      <button class="deck" onclick="goto('info')"><div class="demo">🧳</div><div class="dnm">Info</div><div class="den">Logistics & packing</div></button>
    </div>
    <div class="foot">Hecho con 💛 para la familia · <b>¡Buen viaje!</b></div>
  </div>`;
}

function chkRow(p){
  const on=!!ST.checks[p.k];
  const pr = p.pr==='now' ? '<span class="pr pr-now">do now</span>' : (p.pr==='soon'?'<span class="pr pr-soon">soon</span>':'');
  return `<div class="chk${on?' on':''}" role="checkbox" tabindex="0" aria-checked="${on}" onclick="toggleCheck('${p.k}')">
    <div class="box">${on?'✓':''}</div>
    <div class="ct"><b>${esc(p.t)}</b><small>${esc(p.d)}</small></div>
    ${pr}
  </div>`;
}

function placeCard(p,id,showDrive){
  const open=!!ST.expanded[id];
  const stars='⭐'.repeat(p.kid||0);
  const meta=[
    showDrive&&p.drive?`<span class="tag drv">🚗 ${p.drive}</span>`:'',
    p.kid?`<span class="tag kid">${stars} kids</span>`:'',
    ...(p.tags||[]).map(t=>`<span class="tag${/Tickets|Book/i.test(t)?' book':''}">${esc(t)}</span>`)
  ].filter(Boolean).join('');
  return `<div class="place">
    <div class="ph" role="button" tabindex="0" aria-expanded="${open}" onclick="toggleExp('${id}')">
      <div class="pemo">${p.emoji}</div>
      <div class="pi"><div class="pnm">${esc(p.nm)}</div><div class="pmeta">${meta}</div></div>
    </div>
    ${open?`<div class="pwhy">${esc(p.why)}</div><div class="ptip">💡 <b>Tip:</b> ${esc(p.tip)}</div>`:
      `<button class="exp-toggle" onclick="toggleExp('${id}')">Why go & pro tip ▾</button>`}
  </div>`;
}

  return `<div class="main">
    <div class="subhdr"><button class="bk" aria-label="Atrás" onclick="goto('kids')">←</button>
      <div class="st"><b>${d.emoji} ${esc(d.nm)}</b><small>${esc(d.en)} · ${d.words.length} words</small></div></div>
    <div class="gamebtns">
      <button class="gbtn" onclick="startListen('${k}')"><div class="ge">👂</div><div class="gi"><b>Escucha y toca</b><small>Hear it, tap the picture ${peque?'· best for age 5':''}</small></div><div class="arr">›</div></button>
      ${!peque?`<button class="gbtn" onclick="startMatch('${k}')"><div class="ge">🃏</div><div class="gi"><b>Encuentra la pareja</b><small>Match word to picture (memory)</small></div><div class="arr">›</div></button>`:''}
      <button class="gbtn" onclick="startFlash('${k}')"><div class="ge">📖</div><div class="gi"><b>Mira las tarjetas</b><small>Flip cards & say each word</small></div><div class="arr">›</div></button>
    </div>
    <div class="card"><div style="font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px">All the words</div>${words}</div>
  </div>`;
}

/* ═══════════════ GAMES ═══════════════ */
let GAME=null;

/* Flashcards */
function startFlash(k){ GAME={type:'flash',k,i:0,flip:false}; ST.view='game'; render(); }
function viewFlash(){
  const k=GAME.k, d=DECKS[k], w=d.words[GAME.i];
  return `<div class="main">
    <div class="subhdr"><button class="bk" aria-label="Atrás" onclick="openDeck('${k}')">←</button>
      <div class="st"><b>📖 ${esc(d.nm)}</b><small>Tap the card to flip</small></div></div>
    <div class="fc-wrap">
      <div class="flashcard${GAME.flip?' flip':''}" role="button" tabindex="0" aria-label="Flip card" onclick="flipCard()">
        <div class="inner">
          <div class="face front"><div class="big">${w[2]}</div><div class="hint">¿Qué es? Tap to see</div></div>
          <div class="face back"><div class="es">${esc(w[0])}</div><div class="en">${esc(w[1])}</div><div class="sayit">🔊 ¡Escucha!</div></div>
        </div>
      </div>
      <div class="fc-count">${GAME.i+1} / ${d.words.length}</div>
      <div class="fc-ctrls">
        <button class="fc-nav" onclick="flashNav(-1)">← Atrás</button>
        <button class="fc-know" onclick="flashKnow()">¡Lo sé! ⭐</button>
        <button class="fc-nav" onclick="flashNav(1)">Sig. →</button>
      </div>
    </div>
  </div>`;
}
function flipCard(){ GAME.flip=!GAME.flip; if(GAME.flip) speak(DECKS[GAME.k].words[GAME.i][0]); render(); }
function flashNav(dir){ const n=DECKS[GAME.k].words.length; GAME.i=(GAME.i+dir+n)%n; GAME.flip=false; render(); }
function flashKnow(){ masterWord(GAME.k,GAME.i); addStars(1); checkDeckStamp(GAME.k); const n=DECKS[GAME.k].words.length;
  if(GAME.i<n-1){ GAME.i++; GAME.flip=false; render(); } else { celebrate(GAME.k,'flash'); } }

/* Listen & Tap */
function startListen(k){
  const d=DECKS[k]; const order=shuffle(d.words.map((_,i)=>i)).slice(0,Math.min(6,d.words.length));
  GAME={type:'listen',k,order,round:0,score:0,answered:false};
  ST.view='game'; render(); setTimeout(()=>speak(d.words[order[0]][0]),420);
}
function viewListen(){
  const k=GAME.k, d=DECKS[k];
  const targetIdx=GAME.order[GAME.round]; const target=d.words[targetIdx];
  if(!GAME.opts){
    const others=shuffle(d.words.map((_,i)=>i).filter(i=>i!==targetIdx)).slice(0,3);
    GAME.opts=shuffle([targetIdx,...others]);
  }
  const total=GAME.order.length;
  const opts=GAME.opts.map(i=>{
    const w=d.words[i]; let cls='';
    if(GAME.answered){ if(i===targetIdx) cls=' right'; else if(i===GAME.picked) cls=' wrong'; }
    return `<button class="opt${cls}" onclick="pickListen(${i})">${w[2]}<div class="ol">${GAME.answered?esc(w[0]):'&nbsp;'}</div></button>`;
  }).join('');
  return `<div class="main">
    <div class="subhdr"><button class="bk" aria-label="Atrás" onclick="openDeck('${k}')">←</button>
      <div class="st"><b>👂 ${esc(d.nm)}</b><small>Listen, then tap the picture</small></div></div>
    <div class="gtop">
      <div class="gprog"><div class="bar"><i style="width:${Math.round(GAME.round/total*100)}%"></i></div><small>Round ${GAME.round+1} of ${total}</small></div>
      <div class="gstar">⭐ ${GAME.score}</div>
    </div>
    <button class="bigplay" onclick="speak('${esc(target[0]).replace(/&#39;/g,"\\'")}')"><span class="pic">🔊</span> ¡Escucha otra vez!</button>
    <div class="opts4">${opts}</div>
  </div>`;
}
function pickListen(i){
  if(GAME.answered) return;
  const k=GAME.k, d=DECKS[k]; const targetIdx=GAME.order[GAME.round];
  GAME.answered=true; GAME.picked=i;
  if(i===targetIdx){ GAME.score++; addStars(2); masterWord(k,targetIdx); confetti(8); speak(d.words[targetIdx][0]); }
  else { if(navigator.vibrate) navigator.vibrate(120); speak(d.words[targetIdx][0]); }
  render();
  setTimeout(()=>{
    GAME.round++; GAME.answered=false; GAME.picked=null; GAME.opts=null;
    if(GAME.round>=GAME.order.length){ checkDeckStamp(k); celebrate(k,'listen',GAME.score,GAME.order.length); }
    else { render(); setTimeout(()=>speak(DECKS[k].words[GAME.order[GAME.round]][0]),350); }
  },1150);
}

/* Match (memory) */
function startMatch(k){
  const d=DECKS[k]; const pick=shuffle(d.words.map((_,i)=>i)).slice(0,Math.min(6,d.words.length));
  let cards=[];
  pick.forEach(i=>{ cards.push({wi:i,kind:'es'}); cards.push({wi:i,kind:'emo'}); });
  cards=shuffle(cards).map((c,idx)=>({...c,id:idx,flip:false,done:false}));
  GAME={type:'match',k,cards,first:null,lock:false,matched:0,tries:0};
  ST.view='game'; render();
}
function viewMatch(){
  const k=GAME.k, d=DECKS[k];
  const grid=GAME.cards.map(c=>{
    const w=d.words[c.wi];
    const face = c.kind==='emo' ? `<div class="em">${w[2]}</div>` : `<div class="tx">${esc(w[0])}</div>`;
    const show = c.flip||c.done;
    return `<div class="mcard${show?' flip':''}${c.done?' done':''}" onclick="flipMatch(${c.id})">
      <div class="mf cover">?</div>
      <div class="mf reveal">${face}</div>
    </div>`;
  }).join('');
  const pairs=GAME.cards.length/2;
  return `<div class="main">
    <div class="subhdr"><button class="bk" aria-label="Atrás" onclick="openDeck('${k}')">←</button>
      <div class="st"><b>🃏 ${esc(d.nm)}</b><small>Find the word + picture pairs</small></div></div>
    <div class="gtop">
      <div class="gprog"><div class="bar"><i style="width:${Math.round(GAME.matched/pairs*100)}%"></i></div><small>${GAME.matched} / ${pairs} pairs · ${GAME.tries} tries</small></div>
      <div class="gstar">⭐ ${GAME.matched}</div>
    </div>
    <div class="matchgrid">${grid}</div>
  </div>`;
}
function flipMatch(id){
  if(GAME.lock) return;
  const c=GAME.cards.find(x=>x.id===id); if(!c||c.flip||c.done) return;
  c.flip=true;
  if(c.kind==='es') speak(DECKS[GAME.k].words[c.wi][0]);
  if(GAME.first===null){ GAME.first=id; render(); return; }
  const f=GAME.cards.find(x=>x.id===GAME.first); GAME.tries++;
  if(f.wi===c.wi){
    f.done=c.done=true; GAME.matched++; GAME.first=null; addStars(2); masterWord(GAME.k,c.wi); confetti(6);
    render();
    if(GAME.matched===GAME.cards.length/2){ checkDeckStamp(GAME.k); setTimeout(()=>celebrate(GAME.k,'match'),650); }
  } else {
    GAME.lock=true; render();
    setTimeout(()=>{ f.flip=c.flip=false; GAME.first=null; GAME.lock=false; render(); },950);
  }
}

/* deck stamp + celebration */
function checkDeckStamp(k){ if(deckMastered(k) && !ST.stamps['skill_'+k]){ ST.stamps['skill_'+k]=1; save(); } }
function celebrate(k,mode,score,total){
  const d=DECKS[k]; const gotStamp=deckMastered(k);
  let msg = mode==='listen' ? `You got ${score}/${total}! ` : (mode==='match'?'All pairs matched! ':'¡Bien hecho! ');
  GAME={type:'celebrate',k};
  document.getElementById('app').innerHTML = `<div class="main">
    <div class="celebrate">
      <div class="big">${gotStamp?'🏅':'🎉'}</div>
      <h2>¡Muy bien!</h2>
      <p>${esc(msg)}You earned stars for <b>${esc(d.nm)}</b>.</p>
      ${gotStamp?`<div class="got">🏅 Deck mastered — passport stamp earned!</div>`:''}
      <div style="display:flex;gap:10px;max-width:330px;margin:22px auto 0">
        <button class="fc-nav" style="flex:1;padding:13px;border-radius:13px;font-weight:800;border:1px solid var(--line);background:var(--surface)" onclick="openDeck('${k}')">Play again</button>
        <button class="fc-know" style="flex:1;padding:13px;border-radius:13px;font-weight:800;color:#fff" onclick="goto('kids')">¡Más juegos! →</button>
      </div>
    </div>${navBar()}</div>`;
  confetti(40);
}

function viewGame(){
  if(!GAME) return viewKids();
  if(GAME.type==='flash') return viewFlash();
  if(GAME.type==='listen') return viewListen();
  if(GAME.type==='match') return viewMatch();
  return viewKids();
}

/* ── INFO ── */
function viewInfo(){
  const cards=INFO_CARDS.map(c=>`
    <div class="info-card">
      <div class="ih"><div class="iemo">${c.emoji}</div><div><b>${esc(c.t)}</b><small>${esc(c.sub)}</small></div></div>
      <div class="ib">${c.rows.map(r=>`<div class="kv"><span>${esc(r[0])}</span><b>${esc(r[1])}</b></div>`).join('')}
        ${c.link?`<a class="btn-link" href="${c.link.u}" target="_blank" rel="noopener">🔗 ${esc(c.link.l)}</a>`:''}</div>
    </div>`).join('');

  const prep=PREP.map(p=>chkRow(p)).join('');

  const packing=Object.entries(PACKING).map(([cat,items])=>`
    <div class="info-card"><div class="ih"><div class="iemo">🎒</div><div><b>${esc(cat)}</b><small>${items.filter((_,i)=>ST.packing[cat+'_'+i]).length}/${items.length} packed</small></div></div>
      <div class="ib" style="padding-top:6px">${items.map((it,i)=>{
        const on=!!ST.packing[cat+'_'+i];
        return `<div class="chk" role="checkbox" tabindex="0" aria-checked="${on}" style="margin-bottom:6px" onclick="togglePack('${esc(cat).replace(/'/g,"\\'")}',${i})"><div class="box">${on?'✓':''}</div><div class="ct"><b style="${on?'text-decoration:line-through;color:var(--muted)':''}">${esc(it)}</b></div></div>`;
      }).join('')}</div></div>`).join('');

  const phrases=PARENT_PHRASES.map(p=>`
    <div class="ph-item"><div class="pt"><div class="pes">${esc(p[0])}</div><div class="pen">${esc(p[1])}</div><div class="pph">${esc(p[2])}</div></div>
      <button class="spk" aria-label="Escuchar" onclick="speak('${esc(p[0]).replace(/&#39;/g,"\\'")}')">🔊</button></div>`).join('');

  return `<div class="main">
    <div class="hero" style="background:linear-gradient(140deg,#7c5cd6,#1b6ec2)"><h1>Info & logistics</h1><div class="sub">Everything in one place</div></div>
    <div class="sect-h">Before you go <span class="ln"></span></div>
    ${prep}
    <div class="sect-h">Logistics <span class="ln"></span></div>
    ${cards}
    <div class="sect-h">Packing list <span class="ln"></span></div>
    ${packing}
    <div class="sect-h">Parent survival phrases <span class="ln"></span></div>
    <div class="info-card"><div class="ib">${phrases}
      <a class="btn-link" href="https://apps.sfv9.com/spanish/" target="_blank" rel="noopener">📚 Open your full “Spanish for Calella” course</a>
    </div></div>
    <div class="foot">112 = emergencies · Agua del grifo is safe to drink · <b>¡Buen viaje, familia!</b></div>
  </div>`;
}

/* ═══════════════ RENDER & ACTIONS ═══════════════ */
function render(){
  let html;
  switch(ST.view){
    case 'plan': html=viewPlan(); break;
    case 'explore': html=viewExplore(); break;
    case 'kids': html=viewKids(); break;
    case 'deck': html=viewDeck(); break;
    case 'game': html=viewGame(); break;
    case 'info': html=viewInfo(); break;
    default: html=viewTrip();
  }
  document.getElementById('app').innerHTML = html + navBar();
  if(ST.view==='trip') startCountdown();
  else if(cdTimer){ clearInterval(cdTimer); cdTimer=null; }
}
function goto(v){ if(window.speechSynthesis) speechSynthesis.cancel(); ST.view=v; save(); render(); window.scrollTo(0,0); }
function setLeg(k){ ST.leg=k; render(); window.scrollTo(0,0); }
function setFilter(k){ ST.exFilter=k; render(); }
function setAge(a){ ST.age=a; save(); render(); }
function toggleCheck(k){ ST.checks[k]=!ST.checks[k]; save(); render(); }
function togglePack(cat,i){ const key=cat+'_'+i; ST.packing[key]=!ST.packing[key]; save(); render(); }
function toggleExp(id){ ST.expanded[id]=!ST.expanded[id]; render(); }
function toggleStamp(k){ if(ST.stamps[k]) delete ST.stamps[k]; else { ST.stamps[k]=1; confetti(14); } save(); render(); }
function openDeck(k){ ST.deckKey=k; ST.view='deck'; GAME=null; save(); render(); window.scrollTo(0,0); }

/* countdown */
let cdTimer=null;
function startCountdown(){
  if(cdTimer) clearInterval(cdTimer);
  const elD=document.getElementById('cd-d'); if(!elD) return;
  function tick(){
    const now=new Date(); const target=new Date(2026,6,5,18,0,0); // Jul 5 2026, ~6pm departure
    let diff=Math.floor((target-now)/1000);
    if(diff<0){ clearInterval(cdTimer); return; }
    const d=Math.floor(diff/86400); diff-=d*86400;
    const h=Math.floor(diff/3600); diff-=h*3600;
    const m=Math.floor(diff/60); const s=diff-m*60;
    const set=(id,v)=>{ const e=document.getElementById(id); if(e) e.textContent=v; };
    set('cd-d',d); set('cd-h',h); set('cd-m',String(m).padStart(2,'0')); set('cd-s',String(s).padStart(2,'0'));
  }
  tick(); cdTimer=setInterval(tick,1000);
}

/* confetti */
function confetti(n){
  const colors=['#d8412f','#ef9f00','#1b6ec2','#3a9d5d','#7c5cd6','#f0a500'];
  for(let i=0;i<n;i++){
    const c=document.createElement('div'); c.className='confetti';
    c.style.left=Math.random()*100+'vw';
    c.style.background=colors[Math.floor(Math.random()*colors.length)];
    c.style.transform=`rotate(${Math.random()*360}deg)`;
    document.body.appendChild(c);
    const fall=600+Math.random()*900;
    c.animate([{transform:`translateY(-10px) rotate(0deg)`,opacity:1},
               {transform:`translateY(${window.innerHeight+40}px) rotate(${360+Math.random()*360}deg)`,opacity:.9}],
      {duration:fall,easing:'cubic-bezier(.3,.6,.6,1)'}).onfinish=()=>c.remove();
  }
}

/* ── INIT ── */
load();
render();

// keyboard a11y: Enter/Space activates the role=button / role=checkbox rows
document.addEventListener('keydown', e=>{
  if(e.key!=='Enter' && e.key!==' ') return;
  const el=e.target;
  if(el && el.matches && el.matches('[role="button"],[role="checkbox"]') && el.hasAttribute('onclick')){
    e.preventDefault(); el.click();
  }
});

if('serviceWorker' in navigator){
  let refreshing=false;
  const hadController=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(refreshing) return; refreshing=true;
    if(hadController) location.reload();   // auto-reload on UPDATES, not on first install
  });
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').then(reg=>{
      document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') reg.update(); });
    }).catch(()=>{});
  });
}
</script>
