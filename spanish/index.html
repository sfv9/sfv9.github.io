<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Spanish Advanced</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1e40af">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--b:#1e40af;--b2:#3b82f6;--b3:#dbeafe;--g:#059669;--g2:#d1fae5;--r:#dc2626;--r2:#fee2e2;--a:#d97706;--a2:#fef3c7;--gy:#64748b;--gy2:#f1f5f9;--gy3:#e2e8f0;--tx:#0f172a;--mu:#475569;--wh:#fff;--bg:#f8fafc;--rad:12px;--rads:8px;--sh:0 1px 3px rgba(0,0,0,.1),0 1px 2px rgba(0,0,0,.06);--shm:0 4px 6px rgba(0,0,0,.07),0 2px 4px rgba(0,0,0,.06)}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;line-height:1.5}
#app{min-height:100vh}
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--wh);border-top:1px solid var(--gy3);display:flex;z-index:100;padding-bottom:env(safe-area-inset-bottom)}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px;cursor:pointer;color:var(--gy);border:none;background:none;font-size:10px;font-weight:600;transition:.15s;text-transform:uppercase;letter-spacing:.04em}
.nb.on{color:var(--b2)}
.nb svg{width:22px;height:22px}
.hdr{background:var(--wh);border-bottom:1px solid var(--gy3);padding:14px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:50;min-height:60px}
.hbk{display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;background:var(--gy2);cursor:pointer;border:none;color:var(--tx);flex-shrink:0;font-size:18px}
.htx{font-size:17px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hsub{font-size:11px;color:var(--gy);margin-top:1px}
.main{padding:16px;padding-bottom:80px;max-width:680px;margin:0 auto}
.card{background:var(--wh);border-radius:var(--rad);box-shadow:var(--sh);padding:16px;margin-bottom:12px}
/* LESSON LIST */
.unit-lbl{padding:14px 0 6px;font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--gy);text-transform:uppercase}
.lc{background:var(--wh);border-radius:var(--rad);box-shadow:var(--sh);padding:14px 16px;margin-bottom:8px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:.15s;border:2px solid transparent}
.lc:hover{border-color:var(--b3);box-shadow:var(--shm)}
.lc.done{border-color:var(--g2)}
.le{font-size:26px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:var(--gy2);border-radius:10px;flex-shrink:0}
.li{flex:1;min-width:0}
.lt{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lm{font-size:12px;color:var(--gy);margin-top:2px;display:flex;align-items:center;gap:8px}
.bdg{font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;letter-spacing:.04em}
.b1{background:#e0e7ff;color:#3730a3}.b2{background:#f3e8ff;color:#7e22ce}.gd{background:var(--g2);color:var(--g)}
.pm{height:3px;background:var(--gy3);border-radius:2px;margin-top:6px}
.pf{height:100%;background:var(--g);border-radius:2px;transition:.3s}
/* TABS */
.tabs{display:flex;background:var(--gy2);border-radius:10px;padding:3px;margin-bottom:16px}
.tab{flex:1;text-align:center;padding:8px 4px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;color:var(--mu);transition:.15s;border:none;background:none}
.tab.on{background:var(--wh);color:var(--b);box-shadow:var(--sh)}
/* THEORY */
.th h3{font-size:16px;font-weight:700;margin:18px 0 8px;color:var(--b)}
.th h3:first-child{margin-top:0}
.th h4{font-size:14px;font-weight:600;margin:14px 0 6px}
.th p{font-size:14px;line-height:1.65;margin-bottom:10px;color:var(--tx)}
.th table{width:100%;border-collapse:collapse;margin:8px 0 14px;font-size:13px}
.th th{background:var(--b);color:white;padding:7px 10px;text-align:left;font-weight:600}
.th td{padding:7px 10px;border-bottom:1px solid var(--gy3)}
.th tr:nth-child(even) td{background:var(--gy2)}
.eg{background:var(--b3);border-left:3px solid var(--b2);padding:10px 12px;border-radius:0 var(--rads) var(--rads) 0;margin:8px 0;font-size:14px}
.eg em{display:block;color:var(--gy);font-style:normal;font-size:12px;margin-top:4px}
.note{background:var(--a2);border-left:3px solid var(--a);padding:10px 12px;border-radius:0 var(--rads) var(--rads) 0;margin:10px 0;font-size:13px}
.tip{background:var(--g2);border-left:3px solid var(--g);padding:10px 12px;border-radius:0 var(--rads) var(--rads) 0;margin:10px 0;font-size:13px}
/* VOCAB */
.vi{display:flex;align-items:flex-start;gap:10px;padding:11px 0;border-bottom:1px solid var(--gy3)}
.vi:last-child{border-bottom:none}
.ves{font-weight:700;font-size:15px}
.ven{font-size:12px;color:var(--mu);margin-top:1px}
.vex{font-size:12px;color:var(--gy);font-style:italic;margin-top:3px}
.vxt{font-size:11px;color:var(--mu);margin-top:2px}
.spk{background:none;border:none;cursor:pointer;color:var(--b2);padding:2px;flex-shrink:0;font-size:20px;margin-top:1px}
/* EXERCISES */
.exhdr{display:flex;align-items:center;margin-bottom:16px;gap:10px}
.excnt{font-size:12px;color:var(--gy);font-weight:500;white-space:nowrap}
.expb{flex:1;height:4px;background:var(--gy3);border-radius:2px}
.expf{height:100%;background:var(--b2);border-radius:2px;transition:.3s}
.excard{background:var(--wh);border-radius:var(--rad);box-shadow:var(--sh);padding:20px}
.extype{font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--mu);text-transform:uppercase;margin-bottom:8px}
.exq{font-size:16px;font-weight:600;line-height:1.55;margin-bottom:16px}
.exq .bl{display:inline-block;min-width:70px;border-bottom:2px solid var(--b2);text-align:center}
.opt{display:block;width:100%;text-align:left;padding:11px 14px;border:2px solid var(--gy3);border-radius:10px;margin-bottom:8px;font-size:14px;cursor:pointer;background:white;transition:.15s;color:var(--tx);font-family:inherit}
.opt:hover:not(:disabled){border-color:var(--b2);background:var(--b3)}
.opt.ok{border-color:var(--g);background:var(--g2);color:var(--g)}
.opt.no{border-color:var(--r);background:var(--r2);color:var(--r)}
.opt:disabled{cursor:default}
.fi{width:100%;padding:11px 14px;border:2px solid var(--gy3);border-radius:10px;font-size:15px;outline:none;font-family:inherit;transition:.15s}
.fi:focus{border-color:var(--b2)}
.fi.ok{border-color:var(--g);background:var(--g2)}
.fi.no{border-color:var(--r);background:var(--r2)}
.fb{margin-top:12px;padding:11px 13px;border-radius:var(--rads);font-size:14px;font-weight:500}
.fb.ok{background:var(--g2);color:var(--g)}
.fb.no{background:var(--r2);color:var(--r)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 20px;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;border:none;transition:.15s;font-family:inherit}
.bp{background:var(--b);color:white}.bp:hover{background:#1d3da8}
.bs{background:var(--gy2);color:var(--tx)}.bs:hover{background:var(--gy3)}
.bfw{width:100%}
.exact{display:flex;gap:10px;margin-top:16px}
/* FLASHCARDS */
.fcs{perspective:1200px;margin:16px 0;cursor:pointer}
.fcc{position:relative;height:220px;transform-style:preserve-3d;transition:transform .45s}
.fcc.fl{transform:rotateY(180deg)}
.fcf{position:absolute;inset:0;backface-visibility:hidden;border-radius:var(--rad);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;box-shadow:var(--shm)}
.fcfr{background:var(--b);color:white}
.fcbk{background:white;transform:rotateY(180deg)}
.fcw{font-size:26px;font-weight:800;margin-bottom:6px}
.fcs2{font-size:13px;opacity:.75}
.fchi{font-size:12px;color:var(--gy);margin-top:6px}
.fcct{text-align:center;font-size:12px;color:var(--gy);margin-bottom:6px}
.fcbtns{display:flex;gap:8px;margin-top:12px}
.fck{flex:1;background:var(--g);color:white;padding:12px;border-radius:10px;border:none;cursor:pointer;font-weight:700;font-size:14px;font-family:inherit}
.fcl{flex:1;background:var(--a);color:white;padding:12px;border-radius:10px;border:none;cursor:pointer;font-weight:700;font-size:14px;font-family:inherit}
.chips{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.chip{padding:6px 12px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;border:2px solid var(--gy3);background:white;color:var(--gy);transition:.15s}
.chip.on{background:var(--b);color:white;border-color:var(--b)}
/* HOME */
.hero{background:linear-gradient(135deg,#1e40af 0%,#1e3a8a 100%);border-radius:var(--rad);padding:22px;color:white;margin-bottom:14px}
.hero h1{font-size:22px;font-weight:800;margin-bottom:5px}
.hero p{font-size:13px;opacity:.85;line-height:1.5}
.hstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.hs{background:rgba(255,255,255,.15);border-radius:var(--rads);padding:10px;text-align:center}
.hs b{display:block;font-size:20px;font-weight:800}
.hs span{font-size:10px;opacity:.8}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.qac{background:var(--wh);border-radius:var(--rad);box-shadow:var(--sh);padding:14px;cursor:pointer;transition:.15s;border:2px solid transparent}
.qac:hover{border-color:var(--b3)}
.qac .ico{font-size:26px;margin-bottom:4px}
.qac strong{display:block;font-size:13px;font-weight:700}
.qac span{font-size:11px;color:var(--gy)}
/* PHRASEBOOK */
.pcat{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--gy);text-transform:uppercase;padding:12px 0 6px}
.pi{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--gy3)}
.pi:last-child{border-bottom:none}
.pes{font-weight:600;font-size:13px}
.pen{font-size:12px;color:var(--gy);margin-top:1px}
/* STATS */
.sg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.sc{background:var(--wh);border-radius:var(--rad);box-shadow:var(--sh);padding:14px;text-align:center}
.sn{font-size:30px;font-weight:800;color:var(--b)}
.sl{font-size:12px;color:var(--gy);margin-top:3px}
@media(min-width:600px){.main{padding:20px 24px 80px}}
</style>
</head>

{id:1,unit:'Survival',lvl:'B1',dur:15,emoji:'👋',title:'First Day Essentials',desc:'Greetings, introductions and phrases you need in the first hour',
obj:['Greet people at different times of day','Introduce yourself and ask basic questions','Use polite survival phrases everywhere'],
theory:`<h3>Greetings that actually get used</h3>
<p>Spanish people greet everyone — in the lift, at the shop counter, passing on the street. A quick <strong>Buenos días</strong> goes a long way. Skip it and you seem rude.</p>
<table><tr><th>Time</th><th>Greeting</th></tr>
<tr><td>Morning</td><td>Buenos días</td></tr>
<tr><td>Afternoon</td><td>Buenas tardes</td></tr>
<tr><td>Evening/Night</td><td>Buenas noches</td></tr>
<tr><td>Any time (casual)</td><td>Buenas / Hola</td></tr>
</table>
<div class="note">In Catalonia you may also hear <strong>Bon dia</strong> (Catalan). Just smile and respond in Spanish — everyone understands.</div>
<h3>Introducing yourself</h3>
<p>Keep it simple. People don't need your life story — just name and where you're from.</p>
<div class="eg">Me llamo Sam. Soy de Inglaterra. Estoy aquí un mes.<em>My name is Sam. I'm from England. I'm here for a month.</em></div>
<h3>Key survival phrases</h3>
<p>These four phrases will get you through most awkward moments:</p>
<div class="eg">No hablo español muy bien.<em>I don't speak Spanish very well.</em></div>
<div class="eg">¿Habla inglés?<em>Do you speak English?</em></div>
<div class="eg">¿Puede hablar más despacio, por favor?<em>Can you speak more slowly, please?</em></div>
<div class="eg">No entiendo. ¿Puede repetir?<em>I don't understand. Can you repeat?</em></div>
<div class="tip">Saying "No hablo bien español" upfront makes locals patient with you. They appreciate the effort.</div>`,
vocab:[
{es:'Buenos días',en:'Good morning',ex:'Buenos días, ¿cómo está?',xt:'Good morning, how are you?'},
{es:'Buenas tardes',en:'Good afternoon',ex:'Buenas tardes, una mesa para dos.',xt:'Good afternoon, a table for two.'},
{es:'Buenas noches',en:'Good evening / Good night',ex:'Buenas noches, hasta mañana.',xt:'Good evening, see you tomorrow.'},
{es:'Hola',en:'Hello / Hi',ex:'Hola, ¿qué tal?',xt:'Hi, how are you?'},
{es:'Buenas',en:'Hi (any time, casual)',ex:'Buenas, ¿tiene pan?',xt:'Hi, do you have bread?'},
{es:'Adiós',en:'Goodbye',ex:'Adiós, hasta luego.',xt:'Goodbye, see you later.'},
{es:'Hasta luego',en:'See you later',ex:'Hasta luego, gracias.',xt:'See you later, thanks.'},
{es:'Hasta mañana',en:'See you tomorrow',ex:'Buenas noches, hasta mañana.',xt:'Good night, see you tomorrow.'},

{es:'Gracias',en:'Thank you',ex:'Gracias, muy amable.',xt:'Thank you, very kind.'},
{es:'De nada',en:'You\'re welcome',ex:'De nada, que lo disfrutes.',xt:'You\'re welcome, enjoy it.'},
{es:'Perdona / Perdone',en:'Excuse me / Sorry',ex:'Perdona, ¿dónde está el baño?',xt:'Excuse me, where is the bathroom?'},
{es:'Disculpe',en:'Excuse me (formal)',ex:'Disculpe, ¿puede ayudarme?',xt:'Excuse me, can you help me?'},
{es:'Me llamo...',en:'My name is...',ex:'Me llamo Sarah.',xt:'My name is Sarah.'},
{es:'Soy de...',en:'I\'m from...',ex:'Soy de Australia.',xt:'I\'m from Australia.'},
{es:'Estoy aquí de vacaciones',en:'I\'m here on holiday',ex:'Estoy aquí de vacaciones un mes.',xt:'I\'m here on holiday for a month.'},
{es:'¿Cómo se llama usted?',en:'What is your name? (formal)',ex:'¿Cómo se llama usted?',xt:'What is your name?'},
{es:'¿Cómo te llamas?',en:'What is your name? (casual)',ex:'Hola, ¿cómo te llamas?',xt:'Hi, what is your name?'},
{es:'Mucho gusto',en:'Nice to meet you',ex:'Mucho gusto, soy Tom.',xt:'Nice to meet you, I\'m Tom.'},
{es:'No hablo bien español',en:'I don\'t speak Spanish well',ex:'Perdona, no hablo bien español.',xt:'Sorry, I don\'t speak Spanish well.'},
{es:'¿Habla inglés?',en:'Do you speak English?',ex:'Disculpe, ¿habla inglés?',xt:'Excuse me, do you speak English?'},
{es:'No entiendo',en:'I don\'t understand',ex:'Lo siento, no entiendo.',xt:'I\'m sorry, I don\'t understand.'},
{es:'¿Puede repetir?',en:'Can you repeat?',ex:'¿Puede repetir, por favor?',xt:'Can you repeat, please?'},
{es:'Más despacio',en:'More slowly',ex:'Hable más despacio, por favor.',xt:'Speak more slowly, please.'},
{es:'Sí',en:'Yes',ex:'Sí, gracias.',xt:'Yes, thank you.'},
{es:'No',en:'No',ex:'No, gracias.',xt:'No, thank you.'},
{es:'Quizás',en:'Maybe / Perhaps',ex:'Quizás mañana.',xt:'Maybe tomorrow.'},
{es:'¿Cómo?',en:'Pardon? / What?',ex:'¿Cómo? No he entendido.',xt:'Pardon? I didn\'t understand.'},
{es:'Un momento',en:'One moment',ex:'Un momento, por favor.',xt:'One moment, please.'},
{es:'¿Qué tal?',en:'How are you?',ex:'Hola, ¿qué tal?',xt:'Hi, how are you?'},

{id:2,unit:'Café',lvl:'B1',dur:15,emoji:'☕',title:'Coffee & Breakfast',desc:'Order coffee, breakfast and snacks at a Spanish café like a local',
obj:['Order coffee the Spanish way','Ask for breakfast items','Pay and leave properly'],
theory:`<h3>Coffee is serious in Spain</h3>
<p>A "coffee" in Spain is not what you might expect. Here's what to order:</p>
<table><tr><th>Name</th><th>What it is</th></tr>
<tr><td>Café solo</td><td>Espresso (small, strong, black)</td></tr>
<tr><td>Café con leche</td><td>Espresso with hot milk (50/50) — most popular</td></tr>
<tr><td>Cortado</td><td>Espresso with a dash of milk</td></tr>
<tr><td>Café americano</td><td>Espresso with hot water (less common)</td></tr>
<tr><td>Café con hielo</td><td>Hot espresso + glass of ice (summer staple)</td></tr>
</table>
<div class="note">Ordering "a coffee" without specifying will usually get you a café solo. Say what you want exactly.</div>
<h3>At the counter vs table</h3>
<p>Standing at the <em>barra</em> (bar counter) is cheaper and faster. Sitting at a table (especially outside) costs more. It's normal to pay when you leave, not when you order.</p>
<div class="eg">Ponme un café con leche y una tostada.<em>Give me a coffee with milk and a toast.</em></div>
<div class="tip">Say <strong>ponme</strong> (put me / give me) — it sounds natural. Using <em>quiero</em> (I want) alone can sound blunt; add please or use <em>me pone</em>.</div>
<h3>Breakfast items</h3>
<p>Spanish breakfast is light: toast with olive oil or tomato paste, pastries, or churros on weekends.</p>`,
vocab:[
{es:'Un café con leche',en:'A coffee with milk',ex:'Buenos días, un café con leche, por favor.',xt:'Good morning, a coffee with milk, please.'},
{es:'Un café solo',en:'An espresso',ex:'Quiero un café solo, sin azúcar.',xt:'I want an espresso, without sugar.'},
{es:'Un cortado',en:'Espresso with a dash of milk',ex:'Ponme un cortado, gracias.',xt:'Give me a cortado, thanks.'},
{es:'Un café con hielo',en:'Coffee over ice',ex:'En verano siempre pido café con hielo.',xt:'In summer I always order coffee over ice.'},
{es:'Una tostada',en:'A toast',ex:'Una tostada con aceite, por favor.',xt:'A toast with olive oil, please.'},
{es:'Con aceite',en:'With olive oil',ex:'La tostada, ¿la quieres con aceite o mantequilla?',xt:'The toast, do you want it with olive oil or butter?'},
{es:'Con tomate',en:'With tomato paste',ex:'Tostada con tomate y jamón.',xt:'Toast with tomato and ham.'},
{es:'Con mantequilla',en:'With butter',ex:'Una tostada con mantequilla y mermelada.',xt:'A toast with butter and jam.'},
{es:'Un zumo de naranja',en:'An orange juice',ex:'¿Tiene zumo de naranja natural?',xt:'Do you have fresh orange juice?'},
{es:'Natural',en:'Fresh (juice)',ex:'El zumo es natural, recién exprimido.',xt:'The juice is fresh, freshly squeezed.'},
{es:'Un croissant',en:'A croissant',ex:'Un croissant y un café con leche.',xt:'A croissant and a coffee with milk.'},
{es:'Una napolitana',en:'A chocolate pastry',ex:'¿Quedan napolitanas?',xt:'Are there any chocolate pastries left?'},
{es:'Churros',en:'Churros (fried dough)',ex:'Los fines de semana piden churros.',xt:'At weekends they order churros.'},
{es:'Con chocolate',en:'With hot chocolate',ex:'Churros con chocolate, por favor.',xt:'Churros with hot chocolate, please.'},
{es:'La barra',en:'The bar counter',ex:'Me quedo en la barra, es más rápido.',xt:'I\'ll stay at the counter, it\'s faster.'},
{es:'Una mesa',en:'A table',ex:'¿Hay una mesa libre?',xt:'Is there a free table?'},
{es:'Para llevar',en:'To take away',ex:'El café, ¿para aquí o para llevar?',xt:'The coffee, to have here or to take away?'},
{es:'Para aquí',en:'To have here',ex:'Para aquí, gracias.',xt:'To have here, thanks.'},
{es:'¿Me pone...?',en:'Can you give me...? (ordering)',ex:'¿Me pone un café solo?',xt:'Can you give me an espresso?'},

{id:3,unit:'Café',lvl:'B1',dur:15,emoji:'🍺',title:'Tapas Bar & Drinks',desc:'Order drinks and tapas at a Spanish bar with confidence',

theory:`<h3>Bar culture in Spain</h3>
<p>The bar is the social centre of Spanish life. You go to bars at all hours — for morning coffee, midday drinks, afternoon tapas, evening socialising. There is no shame in going alone.</p>
<div class="note">In Catalonia, <em>tapa</em> culture is less automatic than in Andalusia. You usually have to order and pay for tapas separately. Ask <strong>¿Qué tapas tienen?</strong></div>
<h3>Ordering drinks</h3>
<table><tr><th>Drink</th><th>What to say</th></tr>
<tr><td>Draft beer</td><td>Una caña (small) / Un tercio (bottle)</td></tr>
<tr><td>White wine</td><td>Un vino blanco</td></tr>
<tr><td>Red wine</td><td>Un vino tinto</td></tr>
<tr><td>Sangria</td><td>Una sangría</td></tr>
<tr><td>Water</td><td>Un agua (con gas / sin gas)</td></tr>
<tr><td>Soft drink</td><td>Una Coca-Cola / Un refresco</td></tr>
</table>
<div class="eg">Ponme una caña y una ración de patatas bravas.<em>Give me a beer and a portion of patatas bravas.</em></div>
<h3>Useful bar words</h3>
<p>A <strong>ración</strong> is a larger sharing portion. A <strong>media ración</strong> is half. A <strong>pincho</strong> is a small snack on bread. <strong>Vermut</strong> (vermouth) is very popular in Catalonia before lunch.</p>
<div class="tip">Say <strong>otra ronda</strong> for another round. Locals take turns buying rounds — <em>la ronda</em>.</div>`,

theory:`<h3>Spanish dinner timing</h3>
<p>Dinner in Spain starts late — restaurants often don't open until 8pm and locals eat at 9 or 10pm. If you arrive at 7pm you may find an empty restaurant. Lunch (2-3pm) is the main meal of the day.</p>
<h3>The menu structure</h3>
<table><tr><th>Section</th><th>Spanish</th></tr>
<tr><td>Starters</td><td>Entrantes / Primeros</td></tr>
<tr><td>Main course</td><td>Segundos / Platos principales</td></tr>
<tr><td>Desserts</td><td>Postres</td></tr>
<tr><td>Set menu</td><td>Menú del día</td></tr>
</table>
<div class="note">The <strong>menú del día</strong> (set lunch menu) is amazing value — starter + main + dessert + drink for €12-15. Only available at lunchtime.</div>
<h3>Ordering</h3>
<div class="eg">De primero quiero la ensalada. De segundo, el pescado del día.<em>For starters I want the salad. For the main course, the fish of the day.</em></div>
<div class="tip">Waiters don't always come straight away — make eye contact and raise a hand slightly. Calling out <strong>¡Oiga!</strong> or <strong>¡Por favor!</strong> is acceptable.</div>`,

theory:`<h3>Supermarkets in Calella</h3>
<p>You'll likely find a Mercadona, Consum, or local supermercado nearby. They work the same as home but knowing the Spanish words saves time and confusion.</p>
<h3>Asking where things are</h3>
<div class="eg">Perdona, ¿dónde están los yogures?<em>Excuse me, where are the yoghurts?</em></div>
<div class="eg">¿En qué pasillo están las conservas?<em>Which aisle are the tinned goods in?</em></div>
<h3>Quantities and measures</h3>
<table><tr><th>Quantity</th><th>Spanish</th></tr>
<tr><td>A litre of...</td><td>Un litro de...</td></tr>
<tr><td>Half a kilo of...</td><td>Medio kilo de...</td></tr>

<tr><td>A tin of...</td><td>Una lata de...</td></tr>
<tr><td>A bottle of...</td><td>Una botella de...</td></tr>
</table>
<div class="tip">Self-checkout (<em>caja automática</em>) is common. If you need bags, ask: <strong>¿Tiene bolsas?</strong></div>`,

{id:6,unit:'Compras',lvl:'B1',dur:15,emoji:'🥖',title:'Market & Local Shops',desc:'Shop at the local market, bakery and specialty shops',
obj:['Buy fresh produce at the market','Order from a bakery and deli counter','Ask about local products'],
theory:`<h3>Local shopping in Calella</h3>
<p>Calella likely has a local market on certain days — a great place for fresh produce, cheap prices and authentic contact with locals. Check the notice boards (<em>tablones</em>) for market days.</p>
<h3>At a market stall or deli counter</h3>
<p>You're talking directly to the seller, not self-serving. Use numbers for quantities and be ready to negotiate slightly.</p>
<div class="eg">¿A cómo están los tomates?<em>How much are the tomatoes?</em></div>
<div class="eg">Póngame medio kilo de aceitunas, por favor.<em>Give me half a kilo of olives, please.</em></div>
<h3>Key shops in any Spanish town</h3>

theory:`<h3>Directions vocabulary</h3>
<p>Directions are essential. Learn these words and you can piece together what any local tells you:</p>
<table><tr><th>Direction</th><th>Spanish</th></tr>
<tr><td>Straight ahead</td><td>Todo recto / Todo seguido</td></tr>
<tr><td>Turn left</td><td>Gira a la izquierda</td></tr>
<tr><td>Turn right</td><td>Gira a la derecha</td></tr>
<tr><td>At the traffic lights</td><td>En el semáforo</td></tr>
<tr><td>At the roundabout</td><td>En la rotonda</td></tr>
<tr><td>100 metres</td><td>Cien metros</td></tr>
</table>
<div class="eg">Sigue todo recto hasta el semáforo, luego gira a la derecha.<em>Go straight ahead to the traffic lights, then turn right.</em></div>
<h3>Useful phrases</h3>
<div class="eg">¿Por dónde se va a la playa?<em>Which way is it to the beach?</em></div>
<div class="eg">Está a cinco minutos andando.<em>It's five minutes on foot.</em></div>
<div class="tip">In Calella most things are walkable. The main street is the Passeig (promenade). The train station and beach are key reference points.</div>`,

theory:`<h3>Calella to Barcelona by train</h3>
<p>Calella is on the R1 Rodalies line — the regional train run by RENFE. It takes about 50-60 minutes to Barcelona Sants or Passeig de Gràcia. Trains run every 30 minutes roughly.</p>
<h3>Buying tickets</h3>
<p>You can buy at the machine (<em>la máquina</em>) or at the ticket window (<em>la taquilla</em>). A T-Casual card (10 journeys) saves money if you're going often.</p>
<div class="eg">Un billete de ida y vuelta a Barcelona, por favor.<em>A return ticket to Barcelona, please.</em></div>
<div class="eg">¿A qué hora sale el próximo tren?<em>What time does the next train leave?</em></div>
<h3>At the station</h3>
<table><tr><th>Sign</th><th>Meaning</th></tr>
<tr><td>Salidas</td><td>Departures</td></tr>
<tr><td>Llegadas</td><td>Arrivals</td></tr>
<tr><td>Andén</td><td>Platform</td></tr>
<tr><td>Taquilla</td><td>Ticket office</td></tr>
<tr><td>Consigna</td><td>Left luggage</td></tr>
</table>
<div class="tip">Validate your ticket at the yellow machines on the platform before boarding — you can be fined if you don't.</div>`,

theory:`<h3>Renting in Spain</h3>
<p>Short-term holiday rental is very common in Calella. You'll probably deal with a local agent or landlord directly. Knowing key housing vocabulary avoids misunderstandings.</p>
<h3>Reporting problems</h3>
<div class="eg">El grifo de la cocina gotea.<em>The kitchen tap is dripping.</em></div>
<div class="eg">No funciona el aire acondicionado.<em>The air conditioning is not working.</em></div>
<div class="eg">No hay agua caliente.<em>There's no hot water.</em></div>
<h3>Utilities and facilities</h3>
<table><tr><th>Utility</th><th>Spanish</th></tr>
<tr><td>Electricity</td><td>La luz / La electricidad</td></tr>
<tr><td>Water</td><td>El agua</td></tr>

<tr><td>Air conditioning</td><td>El aire acondicionado</td></tr>

</table>
<div class="tip">In Spain, keys are called <em>llaves</em>. If you need a spare key, ask: <strong>¿Me puede dar una llave extra?</strong></div>`,

theory:`<h3>Beach culture in Calella</h3>
<p>Calella has a long sandy beach on the Costa del Maresme. The beach is well equipped with <em>chiringuitos</em> (beach bars), sun lounger rentals and lifeguards.</p>
<h3>Beach services</h3>
<div class="eg">¿Cuánto cuesta alquilar una hamaca y una sombrilla?<em>How much is it to hire a sun lounger and umbrella?</em></div>
<div class="eg">¿Hay duchas aquí?<em>Are there showers here?</em></div>

theory:`<h3>The farmacia in Spain</h3>
<p>Spanish pharmacists (<em>farmacéuticos</em>) are highly trained and can advise on many conditions without a doctor's appointment. They're your first port of call for minor ailments. Look for the green cross.</p>
<h3>Describing symptoms</h3>
<div class="eg">Me duele la cabeza.<em>My head hurts. / I have a headache.</em></div>
<div class="eg">Tengo fiebre y me encuentro mal.<em>I have a fever and I feel unwell.</em></div>
<div class="note">Use <strong>me duele</strong> (singular) for one thing hurting, <strong>me duelen</strong> for multiple things. "Me duele el estómago" — "me duelen las piernas."</div>
<h3>Common requests</h3>
<div class="eg">¿Tiene algo para el dolor de cabeza?<em>Do you have something for a headache?</em></div>
<div class="eg">¿Necesito receta?<em>Do I need a prescription?</em></div>
<div class="tip">Many medicines available only on prescription in the UK are over-the-counter in Spain. Ibuprofen, antihistamines and antifungal creams are easy to get.</div>`,

theory:`<h3>Payment culture in Spain</h3>
<p>Spain is increasingly cashless but having some cash is useful for markets, small bars and taxis. Card payments are accepted almost everywhere now.</p>
<h3>At the ATM</h3>
<div class="eg">Quiero sacar dinero del cajero.<em>I want to take out money from the ATM.</em></div>
<p>Most ATMs offer English. If you choose Spanish, these are the key words:</p>
<table><tr><th>Screen text</th><th>Meaning</th></tr>
<tr><td>Importe</td><td>Amount</td></tr>
<tr><td>Confirmar</td><td>Confirm</td></tr>
<tr><td>Cancelar</td><td>Cancel</td></tr>
<tr><td>Retirar efectivo</td><td>Withdraw cash</td></tr>
</table>
<h3>Tipping</h3>
<p>Tips are NOT obligatory in Spain and service charge is rarely added automatically. Leaving the small change or rounding up is common. A €1-2 tip for a sit-down meal is appreciated but never expected.</p>
<div class="tip">If a bar gives you a free <em>tapa</em> with your drink, leaving the coins is the done thing.</div>`,

{id:13,unit:'Social',lvl:'B1',dur:15,emoji:'🤝',title:'Making Friends & Small Talk',desc:'Chat with locals, make plans and understand life in Catalan Spain',
obj:['Make small talk with locals','Invite someone for a drink or outing','Understand the Catalan-Spanish context'],
theory:`<h3>Small talk in Spain</h3>
<p>Spanish people are warm and sociable. Small talk covers the classics: weather, food, football (especially if FC Barcelona is playing) and family. Don't be afraid to start conversations.</p>
<h3>Starting a conversation</h3>
<div class="eg">¿Es usted de aquí?<em>Are you from here?</em></div>
<div class="eg">¿Qué le parece Calella?<em>What do you think of Calella?</em></div>
<h3>Catalonia context</h3>
<p>Calella is in Catalonia. Locals may speak Catalan among themselves but switch to Spanish easily. You may see signs in both languages. A <strong>Bon dia</strong> or <strong>Gràcies</strong> in Catalan is always appreciated.</p>
<div class="note">Catalan basics: <em>Bon dia</em> (good morning), <em>Gràcies</em> (thank you), <em>Si us plau</em> (please), <em>Adéu</em> (goodbye).</div>
<div class="tip">Don't call Catalan people "Spanish" — they may prefer "Catalan." Just be aware and follow their lead.</div>`,
vocab:[

{id:14,unit:'Social',lvl:'B1',dur:15,emoji:'🌙',title:'Going Out at Night',desc:'Make evening plans, find bars and navigate Calella\'s nightlife',

theory:`<h3>The Spanish evening</h3>
<p>Evening in Spain runs late. Dinner starts at 9pm. Bars fill up from 10pm. A "nightcap" may be at 2am. This is not unusual — it's just how it works.</p>
<h3>Evening vocab</h3>
<div class="eg">¿A qué hora quedamos?<em>What time shall we meet?</em></div>
<div class="eg">¿Conoces algún bar chulo por aquí?<em>Do you know any cool bars around here?</em></div>
<h3>Calella at night</h3>
<p>The main strip has bars and restaurants. La Llar de Foc is a local favourite — they cook on an open BBQ. La Torre for pizza after a late evening. For a quieter option, NUI on the beach is a bit more upscale.</p>
<div class="note">Spanish people don't pre-drink and rush. The evening is the event. Pace yourself — you'll be there until late.</div>`,

{id:15,unit:'Restaurantes',lvl:'B1',dur:25,emoji:'🍗',title:'Calella\'s Best Restaurants',desc:'Know what to order at Calella\'s top restaurants — NUI, La Roda, La Gavina and more',
obj:['Know what each restaurant specialises in','Order confidently at each venue','Use vocabulary for seafood, grilled dishes and pizza'],
theory:`<h3>Your guide to eating in Calella</h3>
<p>Calella has an excellent restaurant scene. Here are the must-visits — with what to say when you get there.</p>
<h3>On the beach</h3>
<p><strong>NUI</strong> — upscale beach restaurant. Great for a special meal. Say: <em>"Una mesa para dos, tenemos reserva."</em><br>
<strong>Restaurant Padel Calella</strong> — excellent lunches on the beach. Relaxed, great value.<br>
<strong>Club Náutico</strong> — nautical club setting, right on the water. Fresh fish and rice dishes.<br>
<strong>La Gavina</strong> — the best paella in Calella. Order it for two minimum, 30 minutes wait. Say: <em>"Una paella valenciana para dos, por favor."</em></p>
<h3>Local classics</h3>
<p><strong>La Peixeteria</strong> — best seafood in the area. Order whatever is freshest that day.<br>
<strong>La Roda</strong> — famous rotisserie chicken. Eclectic atmosphere. Say: <em>"Un pollo asado entero, por favor."</em><br>
<strong>La Llar de Foc</strong> — everything cooked on an open BBQ. Family friends of the user. Relaxed, authentic.<br>
<strong>La Riera</strong> — big family-style restaurant, good quality at great price.<br>
<strong>La Fusta</strong> — traditional and reliable. Great food.<br>
<strong>La Torre</strong> — best pizza in Calella. Perfect for a casual evening.</p>
<div class="tip">Booking ahead (<em>reservar una mesa</em>) is strongly recommended at NUI and La Peixeteria on weekends.</div>`,

theory:`<h3>Weather in Calella</h3>
<p>Calella enjoys a Mediterranean climate — hot, dry summers and mild winters. In summer expect 28-35°C with low humidity. The sea is warm from June to October.</p>
<h3>Talking about the weather</h3>
<div class="eg">¿Qué tiempo hace hoy?<em>What's the weather like today?</em></div>
<div class="eg">Hace mucho calor, más de treinta grados.<em>It's very hot, more than thirty degrees.</em></div>
<h3>Weather expressions with HACER and ESTAR</h3>
<table><tr><th>Expression</th><th>Meaning</th></tr>
<tr><td>Hace calor</td><td>It's hot</td></tr>
<tr><td>Hace frío</td><td>It's cold</td></tr>
<tr><td>Hace viento</td><td>It's windy</td></tr>
<tr><td>Hace sol</td><td>It's sunny</td></tr>
<tr><td>Está nublado</td><td>It's cloudy</td></tr>
<tr><td>Está lloviendo</td><td>It's raining</td></tr>
</table>
<div class="tip">The wind in Calella can be strong — particularly the <em>tramuntana</em> from the north. This can close beaches and affect boat trips.</div>`,

{id:17,unit:'Problemas',lvl:'B1',dur:15,emoji:'🆘',title:'Problems & Misunderstandings',desc:'Handle difficult situations, complaints and emergencies in Spanish',
obj:['Express that you didn\'t understand','Make a complaint politely','Handle basic emergency situations'],
theory:`<h3>When things go wrong</h3>
<p>Problems happen. Knowing how to express yourself calmly in Spanish means you can resolve most situations without panic. The key is to stay polite but persistent.</p>
<h3>The power of "no"</h3>
<p>Spanish people can be direct. Learning to say no clearly, or to disagree politely, is important:</p>
<div class="eg">Lo siento, pero esto no es lo que pedí.<em>I'm sorry, but this isn't what I ordered.</em></div>
<div class="eg">Hay un error en la cuenta.<em>There's an error on the bill.</em></div>
<h3>Emergencies</h3>
<p>In Spain, the emergency number is <strong>112</strong> for all services (police, ambulance, fire). You can speak English — they have English-speaking operators.</p>

</table>`,

theory:`<h3>Staying connected in Spain</h3>
<p>Spain has excellent mobile coverage. You can buy a prepaid SIM at any <em>estanco</em> (tobacconist), phone shop or supermarket. Main operators: Vodafone, Orange, Movistar, Yoigo. For visitors, Orange is popular and widely available.</p>
<h3>Getting a SIM</h3>
<div class="eg">Quiero una tarjeta SIM de prepago con datos.<em>I want a prepaid SIM card with data.</em></div>
<div class="eg">¿Cuántos gigas incluye?<em>How many gigabytes does it include?</em></div>
<h3>WiFi everywhere</h3>
<p>Most bars and restaurants have free WiFi. Just ask: <strong>¿Cuál es la contraseña del WiFi?</strong></p>
<div class="tip">The Spanish word for WiFi is pronounced like English — "wee-fee." Ask any bar staff and they'll happily share the password.</div>`,

{id:19,unit:'Excursiones',lvl:'B1',dur:15,emoji:'🏙️',title:'Day Trips from Calella',desc:'Visit Barcelona, Sitges and nearby towns with the right Spanish vocabulary',

theory:`<h3>Day trips from Calella</h3>
<p>Calella is perfectly placed for day trips. Barcelona is under an hour by train (R1 line). Sitges — the beautiful beach town — is about 1.5 hours. Blanes and Lloret de Mar are close too.</p>
<h3>Barcelona essentials</h3>
<p>Key sights: La Sagrada Família, Park Güell, La Barceloneta (beach), Las Ramblas, El Born, Montjuïc.</p>
<div class="eg">Quiero visitar la Sagrada Família. ¿Hay que reservar?<em>I want to visit the Sagrada Família. Do you need to book?</em></div>
<div class="note">YES — always book Sagrada Família in advance online. Queues without booking are hours long.</div>
<h3>Getting tourist information</h3>
<div class="eg">¿Dónde está la oficina de turismo?<em>Where is the tourist office?</em></div>
<div class="eg">¿Qué recomienda visitar cerca de aquí?<em>What do you recommend visiting near here?</em></div>`,

theory:`<h3>Wrapping up your month</h3>
<p>After a month in Calella you'll have built relationships — with your landlord, local shopkeepers, bar staff. Saying goodbye properly is important in Spanish culture.</p>
<h3>Checking out</h3>
<div class="eg">Mañana me voy. ¿Podría confirmar el check-out?<em>I'm leaving tomorrow. Could you confirm check-out?</em></div>
<div class="eg">¿A qué hora tengo que dejar el apartamento?<em>What time do I have to leave the apartment?</em></div>
<h3>Compliments and thanks</h3>
<p>A genuine <em>thank you</em> goes a long way with locals. If you've been eating at the same restaurant all month, tell them you've loved it.</p>
<div class="eg">He pasado un mes increíble en Calella. Todo el mundo ha sido muy amable.<em>I've had an incredible month in Calella. Everyone has been very kind.</em></div>
<div class="tip">Leaving a Google review in Spanish for your favourite restaurants — La Roda, La Gavina, La Peixeteria — will genuinely mean a lot to local businesses.</div>`,

function save() {

// ── TTS ──────────────────────────────────────────────────────────────────────
let ttsReady = false;
let ttsVoice = null;
function initTTS() {
  if (!window.speechSynthesis) return;
  function findVoice() {
    const vs = speechSynthesis.getVoices();
    ttsVoice = vs.find(v => v.lang.startsWith('es')) || null;
    ttsReady = vs.length > 0;
  }
  findVoice();
  speechSynthesis.onvoiceschanged = findVoice;
}
initTTS();
function speak(txt) {
  if (!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(txt);
  u.lang = 'es-ES';
  if (ttsVoice) u.voice = ttsVoice;
  u.rate = 0.85;
  speechSynthesis.speak(u);
}

// ── Helpers ──────────────────────────────────────────────────────────────────
function getLesson(id) { return LESSONS.find(l => l.id === id); }
function lessonProg(id) { return ST.prog[id] || {done:false, score:0, total:0}; }
function totalCompleted() { return Object.values(ST.prog).filter(p => p.done).length; }
function totalScore() { return Object.values(ST.prog).reduce((a,p) => a + (p.score||0), 0); }
function totalItems() { return Object.values(ST.prog).reduce((a,p) => a + (p.total||0), 0); }
function accuracy() { const t = totalItems(); return t ? Math.round(totalScore()/t*100) : 0; }
function masteredCount() { return LESSONS.reduce((a,l) => {
  const p = ST.prog[l.id];
  return a + (p && p.mastered ? p.mastered.length : 0);
},0); }

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function normalize(s) {
  return s.trim().toLowerCase()
    .replace(/á/g,'a').replace(/é/g,'e').replace(/í/g,'i').replace(/ó/g,'o').replace(/ú/g,'u').replace(/ü/g,'u')
    .replace(/ñ/g,'n').replace(/[^a-z0-9\s]/g,'').replace(/\s+/g,' ');
}

function lessonCard(l) {
  const p = lessonProg(l.id);
  const pct = p.total ? Math.round(p.score/p.total*100) : 0;
  return `<div class="lc${p.done?' done':''}" onclick="startLesson(${l.id})">
    <div class="le">${l.emoji}</div>
    <div class="li">
      <div class="lt">${l.title}</div>
      <div class="lm">
        <span class="bdg b1">${l.unit}</span>
        <span>${l.dur}min</span>
        ${p.done ? `<span class="bdg gd">✓ Done</span>` : ''}
      </div>
      ${p.total ? `<div class="pm"><div class="pf" style="width:${pct}%"></div></div>` : ''}
    </div>
  </div>`;
}

function viewLessons() {
  const units = {};
  LESSONS.forEach(l => { if (!units[l.unit]) units[l.unit] = []; units[l.unit].push(l); });
  let html = `<div class="hdr"><div class="htx">🇪🇸 All Lessons</div></div><div class="main">`;
  Object.keys(units).forEach(u => {
    html += `<div class="unit-lbl">${u}</div>`;
    units[u].forEach(l => { html += lessonCard(l); });
  });
  html += `</div>${nav()}`;
  return html;
}

  if (!l) return viewLessons();

  const hdr = `<div class="hdr">
    <button class="hbk" onclick="goto('lessons')">${icons('back')}</button>
    <div><div class="htx">${l.title}</div><div class="hsub">${l.unit} · ${l.dur}min · Lesson ${l.id}</div></div>
  </div>`;
  const tabHtml = `<div class="tabs">${tabs.map((t,i)=>`<button class="tab${ST.ltab===t?' on':''}" onclick="setLTab('${t}')">${tl[i]}</button>`).join('')}</div>`;

    content = `<div class="card"><div class="th">${l.theory}</div></div>

    content = `<div class="card" style="padding:0 16px">

            <div class="vxt">${escHtml(v.xt)}</div>
          </div>
        </div>`).join('')}

function exView(l) {
  const exs = l.ex;
  const idx = ST.eidx;
  if (idx >= exs.length) {
    const sc = ST.ecor;
    const tot = exs.length;
    const pct = Math.round(sc/tot*100);
    ST.prog[l.id] = {done: true, score: sc, total: tot};
    save();
    return `<div class="card" style="text-align:center;padding:28px 20px">
      <div style="font-size:48px;margin-bottom:12px">${pct>=80?'🏆':'⭐'}</div>
      <div style="font-size:22px;font-weight:800;margin-bottom:6px">${pct>=80?'Excellent!':'Good effort!'}</div>
      <div style="font-size:15px;color:var(--gy);margin-bottom:18px">${sc}/${tot} correct (${pct}%)</div>
      <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
        <button class="btn bp" onclick="startEx(${l.id})">Retry</button>
        <button class="btn bs" onclick="setLTab('vocab')">Review vocab</button>
        <button class="btn bs" onclick="nextLesson(${l.id})">Next lesson →</button>
      </div>
    </div>`;
  }

  const ex = exs[idx];
  const prog = `<div class="exhdr">
    <div class="excnt">${idx+1}/${exs.length}</div>
    <div class="expb"><div class="expf" style="width:${idx/exs.length*100}%"></div></div>
    <div class="excnt">✓${ST.ecor}</div>
  </div>`;

  if (ex.t === 'mc') {
    const done = ST.edone;
    return `${prog}<div class="excard">
      <div class="extype">Multiple choice</div>
      <div class="exq">${escHtml(ex.q)}</div>
      ${ex.o.map((o,i)=>{
        let cls = '';
        if (done) { cls = i===ex.c ? ' ok' : (ST.echeck===i && i!==ex.c ? ' no' : ''); }
        return `<button class="opt${cls}"${done?' disabled':''} onclick="checkMC(${i},${ex.c})">${escHtml(o)}</button>`;
      }).join('')}
      ${done ? `<div class="fb ${ST.echeck===ex.c?'ok':'no'}">${ST.echeck===ex.c?'✓ Correct!':'✗ Correct answer: '+escHtml(ex.o[ex.c])}</div>
      <div class="exact"><button class="btn bp bfw" onclick="nextEx()">Next →</button></div>` : ''}
    </div>`;
  }

  if (ex.t === 'fill') {
    const done = ST.edone;
    const qParts = ex.q.split('___');
    const qHtml = qParts.length > 1
      ? escHtml(qParts[0]) + `<span class="bl">${done ? escHtml(ex.a) : '&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;'}</span>` + escHtml(qParts.slice(1).join('___'))
      : escHtml(ex.q);
    return `${prog}<div class="excard">
      <div class="extype">Fill in the blank</div>
      <div class="exq">${qHtml}</div>
      ${done ? `
        <div class="fb ${ST.echeck?'ok':'no'}">${ST.echeck?'✓ Correct!':'✗ Answer: '+escHtml(ex.a)}</div>
        <div style="font-size:12px;color:var(--gy);margin-top:6px">Hint: ${escHtml(ex.h)}</div>
        <div class="exact"><button class="btn bp bfw" onclick="nextEx()">Next →</button></div>
      ` : `
        <div style="font-size:12px;color:var(--gy);margin-bottom:8px">Hint: ${escHtml(ex.h)}</div>
        <input id="fians" class="fi" placeholder="Type your answer..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" onkeydown="if(event.key==='Enter')checkFill()">
        <div class="exact"><button class="btn bp bfw" onclick="checkFill()">Check</button></div>
      `}
    </div>`;
  }
  return '';
}

    return `<div class="hdr"><div class="htx">⚡ Flashcards</div></div>
    <div class="main"><div class="card" style="text-align:center;padding:24px">No cards available.</div></div>${nav()}`;
  }
  const idx = ST.flidx % pool.length;
  const item = pool[idx];
  const flipped = ST.flflip;
  const key = item._lid + '_' + item.es;

  return `<div class="hdr"><div class="htx">⚡ Flashcards</div><div class="hsub">${idx+1}/${pool.length} cards</div></div>
  <div class="main">
    <div class="chips">
      <button class="chip${ST.flset==='all'?' on':''}" onclick="setFlSet('all')">All vocab</button>
      <button class="chip${ST.flset==='learn'?' on':''}" onclick="setFlSet('learn')">Still learning</button>
      ${LESSONS.map(l=>`<button class="chip${ST.flset===String(l.id)?' on':''}" onclick="setFlSet('${l.id}')">L${l.id}</button>`).join('')}
    </div>
    <div class="fcct">Tap card to reveal · ${Object.keys(ST.fllearn).length} marked as "learning"</div>
    <div class="fcs" onclick="flipCard()">
      <div class="fcc${flipped?' fl':''}">
        <div class="fcf fcfr">
          <div class="fcw">${escHtml(item.es)}</div>
          <div class="fcs2">L${item._lid} — tap to reveal</div>
        </div>
        <div class="fcf fcbk">
          <div class="fcw" style="color:var(--b)">${escHtml(item.en)}</div>
          <div class="fcs2" style="color:var(--gy)">${escHtml(item.ex)}</div>
          <div class="fchi">${escHtml(item.xt)}</div>
        </div>
      </div>
    </div>
    ${flipped ? `<div class="fcbtns">
      <button class="fcl" onclick="markLearn('${key}')">📚 Still learning</button>
      <button class="fck" onclick="markKnow('${key}')">✓ Know it</button>
    </div>` : `<div style="text-align:center;color:var(--gy);font-size:13px;margin-top:8px">Tap the card to see the answer</div>`}
    <div class="exact" style="margin-top:16px">
      <button class="btn bs bfw" onclick="prevCard()">← Prev</button>
      <button class="btn bp bfw" onclick="nextCard()">Next →</button>
    </div>
  </div>${nav()}`;
}

function viewPhrase() {
  const cat = ST.pbcat;
  return `<div class="hdr"><div class="htx">💬 Phrasebook</div></div>
  <div class="main">
    <div class="chips">
      ${PB.map((c,i)=>`<button class="chip${cat===i?' on':''}" onclick="setPBCat(${i})">${c.cat}</button>`).join('')}
    </div>
    <div class="card" style="padding:0 16px">
      ${PB[cat].phrases.map(p=>`
        <div class="pi">
          <div style="flex:1">
            <div class="pes">${escHtml(p.es)}</div>
            <div class="pen">${escHtml(p.en)}</div>
            ${p.note ? `<div style="font-size:11px;color:var(--a);margin-top:2px">${escHtml(p.note)}</div>` : ''}
          </div>
          <button class="spk" onclick="speak('${escHtml(p.es)}')">${icons('spk')}</button>
        </div>`).join('')}
    </div>
  </div>${nav()}`;
}

function viewStats() {
  const done = totalCompleted();
  const tot = LESSONS.length;
  const sc = totalScore();
  const ti = totalItems();
  const acc = accuracy();
  const m = masteredCount();
  const allVoc = LESSONS.reduce((a,l)=>a+l.vocab.length,0);

  return `<div class="hdr"><div class="htx">📊 Progress</div></div>
  <div class="main">
    <div class="sg">
      <div class="sc"><div class="sn">${done}</div><div class="sl">Lessons completed</div></div>
      <div class="sc"><div class="sn">${tot-done}</div><div class="sl">Lessons remaining</div></div>
      <div class="sc"><div class="sn">${acc}%</div><div class="sl">Exercise accuracy</div></div>
      <div class="sc"><div class="sn">${m}</div><div class="sl">Words mastered</div></div>
    </div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;font-size:13px;color:var(--gy);margin-bottom:8px">
        <span>Overall progress</span><span>${done}/${tot}</span>
      </div>
      <div class="pm" style="height:8px"><div class="pf" style="width:${Math.round(done/tot*100)}%"></div></div>
    </div>
    <div class="card">
      <div style="font-weight:700;margin-bottom:10px">Lesson breakdown</div>
      ${LESSONS.map(l => {
        const p = lessonProg(l.id);
        const pct = p.total ? Math.round(p.score/p.total*100) : 0;
        return `<div style="display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--gy3)">
          <span style="font-size:18px">${l.emoji}</span>
          <div style="flex:1;min-width:0">
            <div style="font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${l.title}</div>
            ${p.done ? `<div style="font-size:11px;color:var(--g)">✓ ${pct}% · ${p.score}/${p.total} correct</div>` : `<div style="font-size:11px;color:var(--gy)">Not started</div>`}
          </div>
          <span class="bdg b1">${l.unit}</span>
        </div>`;
      }).join('')}
    </div>
    <button class="btn bs bfw" style="margin-top:4px" onclick="if(confirm('Reset all progress?')){ST.prog={};ST.fllearn={};save();render()}">Reset progress</button>
  </div>${nav()}`;
}

// ── Actions ───────────────────────────────────────────────────────────────────
function goto(v) {
  ST.view = v;
  if (v === 'flash') buildFlashPool();
  render();
}

function startLesson(id) {
  ST.view = 'lesson';
  ST.lid = id;
  ST.ltab = 'theory';
  render();
}

function nextLesson(id) {
  const idx = LESSONS.findIndex(l => l.id === id);
  const next = LESSONS[idx+1];
  if (next) { startLesson(next.id); }
  else { goto('lessons'); }
}

function setLTab(t) {
  ST.ltab = t;
  if (t === 'ex') { startEx(ST.lid); return; }
  render();
}

function startEx(id) {
  ST.lid = id;
  ST.ltab = 'ex';
  ST.eidx = 0;
  ST.edone = false;
  ST.ecor = 0;
  ST.echeck = null;
  render();
}

function checkMC(chosen, correct) {
  if (ST.edone) return;
  ST.edone = true;
  ST.echeck = chosen;
  if (chosen === correct) ST.ecor++;
  render();
}

function checkFill() {
  if (ST.edone) return;
  const inp = document.getElementById('fians');
  if (!inp) return;
  const val = inp.value;
  const l = getLesson(ST.lid);
  const ex = l.ex[ST.eidx];
  const correct = normalize(val) === normalize(ex.a);
  ST.edone = true;
  ST.echeck = correct;
  if (correct) ST.ecor++;
  render();
  setTimeout(()=>{
    const fi = document.getElementById('fians');
    if (fi) { fi.value = val; fi.classList.add(correct?'ok':'no'); }
  },10);
}

function nextEx() {
  ST.eidx++;
  ST.edone = false;
  ST.echeck = null;
  render();
}

function buildFlashPool() {
  let pool = [];
  if (ST.flset === 'all') {
    LESSONS.forEach(l => { l.vocab.forEach(v => pool.push({...v, _lid: l.id})); });
  } else if (ST.flset === 'learn') {
    LESSONS.forEach(l => { l.vocab.forEach(v => {
      if (ST.fllearn[l.id+'_'+v.es]) pool.push({...v, _lid: l.id});
    });});
    if (!pool.length) { ST.flset='all'; buildFlashPool(); return; }
  } else {
    const lid = parseInt(ST.flset);
    const l = getLesson(lid);
    if (l) pool = l.vocab.map(v => ({...v, _lid: l.id}));
  }
  for (let i = pool.length-1; i>0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [pool[i],pool[j]] = [pool[j],pool[i]];
  }
  ST.flpool = pool;
  ST.flidx = 0;
  ST.flflip = false;
}

function setFlSet(s) {
  ST.flset = s;
  buildFlashPool();
  render();
}

function flipCard() { ST.flflip = !ST.flflip; render(); }
function nextCard() { ST.flidx = (ST.flidx+1) % ST.flpool.length; ST.flflip = false; render(); }
function prevCard() { ST.flidx = (ST.flidx-1+ST.flpool.length) % ST.flpool.length; ST.flflip = false; render(); }

function markLearn(key) {
  ST.fllearn[key] = true;
  save();
  nextCard();
}
function markKnow(key) {
  delete ST.fllearn[key];
  save();
  nextCard();
}

function setPBCat(i) { ST.pbcat = i; render(); }

// ── Main render ───────────────────────────────────────────────────────────────
function render() {
  let html = '';
  if (ST.view === 'home') html = viewHome();
  else if (ST.view === 'lessons') html = viewLessons();
  else if (ST.view === 'lesson') html = viewLesson(ST.lid);
  else if (ST.view === 'flash') html = viewFlash();
  else if (ST.view === 'phrase') html = viewPhrase();
  else if (ST.view === 'stats') html = viewStats();
  document.getElementById('app').innerHTML = html;
  bindAll();
}

function bindAll() {
  const fi = document.getElementById('fians');
  if (fi && !ST.edone) { setTimeout(()=>fi.focus(),80); }
}

// ── SW Registration ───────────────────────────────────────────────────────────
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/spanish/sw.js').catch(()=>{});
  });
}

// ── Boot ──────────────────────────────────────────────────────────────────────
render();

</script></body></html>
