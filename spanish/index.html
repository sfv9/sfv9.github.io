  const hrs = Math.round(LESSONS.reduce((a,l)=>a+l.dur,0)/60*10)/10;
  const voc = LESSONS.reduce((a,l)=>a+l.vocab.length,0);
  const nextL = LESSONS.find(l => !lessonProg(l.id).done) || LESSONS[LESSONS.length-1];
  return `
<div class="main">
  <div class="hero">
    <h1>🇪🇸 Advanced Spanish</h1>
    <p>B1–B2 CEFR · ${LESSONS.length} lessons · ${hrs}h content · ${voc} vocabulary items</p>
    <div class="hstats">
      <div class="hs"><b>${done}</b><span>Lessons done</span></div>
      <div class="hs"><b>${masteredCount()}</b><span>Words mastered</span></div>
      <div class="hs"><b>${accuracy()}%</b><span>Accuracy</span></div>
    </div>
  </div>
  <div class="qa">
    <div class="qac" onclick="startLesson(${nextL.id})">
      <div class="ico">${nextL.emoji}</div>
      <strong>Continue</strong>
      <span>${nextL.title.substring(0,28)}</span>
    </div>
    <div class="qac" onclick="goto('flash')">
      <div class="ico">⚡</div>
      <strong>Flashcards</strong>
      <span>Review vocab</span>
    </div>
    <div class="qac" onclick="goto('phrase')">
      <div class="ico">💬</div>
      <strong>Phrasebook</strong>
      <span>${PB.length} categories</span>
    </div>
    <div class="qac" onclick="goto('stats')">
      <div class="ico">📊</div>
      <strong>Progress</strong>
      <span>${done}/${LESSONS.length} complete</span>
    </div>
  </div>
  <div class="unit-lbl">Recent lessons</div>
  ${LESSONS.slice(0,5).map(l => lessonCard(l)).join('')}
  <button class="btn bs bfw" onclick="goto('lessons')" style="margin-top:4px">View all ${LESSONS.length} lessons →</button>
</div>${nav()}`;
}

function lessonCard(l) {
  const p = lessonProg(l.id);
  const pct = p.total ? Math.round(p.score/p.total*100) : 0;
  return `<div class="lc${p.done?' done':''}" onclick="startLesson(${l.id})">
    <div class="le">${l.emoji}</div>
    <div class="li">
      <div class="lt">${l.title}</div>
      <div class="lm">
        <span class="bdg ${l.lvl==='B1'?'b1':'b2'}">${l.lvl}</span>
        <span>${l.dur}min</span>
        ${p.done ? `<span class="bdg gd">✓ Done</span>` : ''}
      </div>
      ${p.total ? `<div class="pm"><div class="pf" style="width:${pct}%"></div></div>` : ''}
    </div>
  </div>`;
}

function viewLessons() {
  const units = {};
  LESSONS.forEach(l => { if (!units[l.unit]) units[l.unit] = []; units[l.unit].push(l); });
  const unitNames = {1:'Unit 1 — Grammar Foundations',2:'Unit 2 — Subjunctive Mastery',3:'Unit 3 — Conditionals',4:'Unit 4 — Advanced Structures',5:'Unit 5 — Professional & Academic',6:'Unit 6 — Idioms & Culture',7:'Unit 7 — Mastery & Fluency'};
  let html = `<div class="main">`;
  Object.keys(units).forEach(u => {
    html += `<div class="unit-lbl">${unitNames[u] || 'Unit '+u}</div>`;
    units[u].forEach(l => { html += lessonCard(l); });
  });
  html += `</div>${nav()}`;
  return html;
}

function viewLesson(id) {
  const l = getLesson(id);
  if (!l) return viewLessons();
  const tabs = ['theory','vocab','ex'];
  const tl = ['Theory','Vocab','Practice'];
  const p = lessonProg(id);
  const hdr = `<div class="hdr">
    <button class="hbk" onclick="goto('lessons')">${icons('back')}</button>
    <div><div class="htx">${l.title}</div><div class="hsub">${l.lvl} · ${l.dur}min · L${l.id}</div></div>
  </div>`;
  const tabHtml = `<div class="tabs">${tabs.map((t,i)=>`<button class="tab${ST.ltab===t?' on':''}" onclick="setLTab('${t}')">${tl[i]}</button>`).join('')}</div>`;

  let content = '';
  if (ST.ltab === 'theory') {
    content = `<div class="card"><div class="th">${l.theory}</div></div>
    <div class="card">
      <div style="font-weight:700;margin-bottom:8px">Learning objectives</div>
      ${l.obj.map(o=>`<div style="display:flex;gap:8px;margin-bottom:6px;font-size:14px"><span style="color:var(--g)">✓</span>${escHtml(o)}</div>`).join('')}
    </div>
    <div class="card">
      <div style="font-size:12px;color:var(--gy);margin-bottom:10px">DESCRIPTION</div>
      <div style="font-size:14px;line-height:1.65">${escHtml(l.desc)}</div>
    </div>
    <button class="btn bp bfw" onclick="setLTab('vocab')">Continue to Vocabulary →</button>`;
  }

  if (ST.ltab === 'vocab') {
    content = `<div class="card" style="padding:0 16px">
      ${l.vocab.map((v,i)=>`
        <div class="vi">
          <button class="spk" title="Pronounce" onclick="speak('${escHtml(v.es)}')">${icons('spk')}</button>
          <div style="flex:1">
            <div class="ves">${escHtml(v.es)}</div>
            <div class="ven">${escHtml(v.en)}</div>
            <div class="vex">${escHtml(v.ex)}</div>
            <div class="vxt">${escHtml(v.xt)}</div>
          </div>
        </div>`).join('')}
    </div>
    <button class="btn bp bfw" onclick="startEx(${id})" style="margin-top:12px">Start Practice Exercises →</button>`;
  }

  if (ST.ltab === 'ex') {
    content = exView(l);
  }

  return `${hdr}<div class="main">${tabHtml}${content}</div>${nav()}`;
}

function exView(l) {
  const exs = l.ex;
  const idx = ST.eidx;
  if (idx >= exs.length) {
    const sc = ST.ecor;
    const tot = exs.length;
    const pct = Math.round(sc/tot*100);
    // save progress
    ST.prog[l.id] = {done: true, score: sc, total: tot};
    save();
    return `<div class="card" style="text-align:center;padding:28px 20px">
      <div style="font-size:48px;margin-bottom:12px">${pct>=80?'🏆':'⭐'}</div>
      <div style="font-size:22px;font-weight:800;margin-bottom:6px">${pct>=80?'Excellent!':'Good effort!'}</div>
      <div style="font-size:15px;color:var(--gy);margin-bottom:18px">${sc}/${tot} correct (${pct}%)</div>
      <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
        <button class="btn bp" onclick="startEx(${l.id})">Retry</button>
        <button class="btn bs" onclick="setLTab('vocab')">Review vocab</button>
        <button class="btn bs" onclick="nextLesson(${l.id})">Next lesson →</button>
      </div>
    </div>`;
  }

  const ex = exs[idx];
  const prog = `<div class="exhdr">
    <div class="excnt">${idx+1}/${exs.length}</div>
    <div class="expb"><div class="expf" style="width:${idx/exs.length*100}%"></div></div>
    <div class="excnt">✓${ST.ecor}</div>
  </div>`;

  if (ex.t === 'mc') {
    const done = ST.edone;
    return `${prog}<div class="excard">
      <div class="extype">Multiple choice</div>
      <div class="exq">${escHtml(ex.q)}</div>
      ${ex.o.map((o,i)=>{
        let cls = '';
        if (done) { cls = i===ex.c ? ' ok' : (ST.echeck===i && i!==ex.c ? ' no' : ''); }
        return `<button class="opt${cls}"${done?' disabled':''} onclick="checkMC(${i},${ex.c})">${escHtml(o)}</button>`;
      }).join('')}
      ${done ? `<div class="fb ${ST.echeck===ex.c?'ok':'no'}">${ST.echeck===ex.c?'✓ Correct!':'✗ Correct answer: '+escHtml(ex.o[ex.c])}</div>
      <div class="exact"><button class="btn bp bfw" onclick="nextEx()">Next →</button></div>` : ''}
    </div>`;
  }

  if (ex.t === 'fill') {
    const done = ST.edone;
    const qParts = ex.q.split('___');
    const qHtml = qParts.length > 1
      ? escHtml(qParts[0]) + `<span class="bl">${done ? escHtml(ex.a) : '&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;'}</span>` + escHtml(qParts.slice(1).join('___'))
      : escHtml(ex.q);
    return `${prog}<div class="excard">
      <div class="extype">Fill in the blank</div>
      <div class="exq">${qHtml}</div>
      ${done ? `
        <div class="fb ${ST.echeck?'ok':'no'}">${ST.echeck?'✓ Correct!':'✗ Answer: '+escHtml(ex.a)}</div>
        <div style="font-size:12px;color:var(--gy);margin-top:6px">Hint was: ${escHtml(ex.h)}</div>
        <div class="exact"><button class="btn bp bfw" onclick="nextEx()">Next →</button></div>
      ` : `
        <div style="font-size:12px;color:var(--gy);margin-bottom:8px">Hint: ${escHtml(ex.h)}</div>
        <input id="fians" class="fi" placeholder="Type your answer..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" onkeydown="if(event.key==='Enter')checkFill()">
        <div class="exact"><button class="btn bp bfw" onclick="checkFill()">Check</button></div>
      `}
    </div>`;
  }
  return '';
}

function viewFlash() {
  // build pool
  if (!ST.flpool.length) buildFlashPool();
  const pool = ST.flpool;
  if (!pool.length) {
    return `<div class="hdr"><div class="htx">⚡ Flashcards</div></div>
    <div class="main"><div class="card" style="text-align:center;padding:24px">No cards available.</div></div>${nav()}`;
  }
  const idx = ST.flidx % pool.length;
  const item = pool[idx];
  const flipped = ST.flflip;
  const key = item._lid + '_' + item.es;
  const isLearn = !!ST.fllearn[key];

  return `<div class="hdr"><div class="htx">⚡ Flashcards</div><div class="hsub">${idx+1}/${pool.length} cards</div></div>
  <div class="main">
    <div class="chips">
      <button class="chip${ST.flset==='all'?' on':''}" onclick="setFlSet('all')">All vocab</button>
      <button class="chip${ST.flset==='learn'?' on':''}" onclick="setFlSet('learn')">Still learning</button>
      ${LESSONS.map(l=>`<button class="chip${ST.flset===String(l.id)?' on':''}" onclick="setFlSet('${l.id}')">L${l.id}</button>`).join('')}
    </div>
    <div class="fcct">Tap card to reveal · ${Object.keys(ST.fllearn).length} marked as "learning"</div>
    <div class="fcs" onclick="flipCard()">
      <div class="fcc${flipped?' fl':''}">
        <div class="fcf fcfr">
          <div class="fcw">${escHtml(item.es)}</div>
          <div class="fcs2">L${item._lid} — tap to reveal</div>
        </div>
        <div class="fcf fcbk">
          <div class="fcw" style="color:var(--b)">${escHtml(item.en)}</div>
          <div class="fcs2" style="color:var(--gy)">${escHtml(item.ex)}</div>
          <div class="fchi">${escHtml(item.xt)}</div>
        </div>
      </div>
    </div>
    ${flipped ? `<div class="fcbtns">
      <button class="fcl" onclick="markLearn('${key}')">📚 Still learning</button>
      <button class="fck" onclick="markKnow('${key}')">✓ Know it</button>
    </div>` : `<div style="text-align:center;color:var(--gy);font-size:13px;margin-top:8px">Tap the card to see the answer</div>`}
    <div class="exact" style="margin-top:16px">
      <button class="btn bs bfw" onclick="prevCard()">← Prev</button>
      <button class="btn bp bfw" onclick="nextCard()">Next →</button>
    </div>
  </div>${nav()}`;
}

function viewPhrase() {
  const cat = ST.pbcat;
  return `<div class="hdr"><div class="htx">💬 Phrasebook</div></div>
  <div class="main">
    <div class="chips">
      ${PB.map((c,i)=>`<button class="chip${cat===i?' on':''}" onclick="setPBCat(${i})">${c.cat}</button>`).join('')}
    </div>
    <div class="card" style="padding:0 16px">
      ${PB[cat].phrases.map(p=>`
        <div class="pi">
          <div style="flex:1">
            <div class="pes">${escHtml(p.es)}</div>
            <div class="pen">${escHtml(p.en)}</div>
            ${p.note ? `<div style="font-size:11px;color:var(--a);margin-top:2px">${escHtml(p.note)}</div>` : ''}
          </div>
          <button class="spk" onclick="speak('${escHtml(p.es)}')">${icons('spk')}</button>
        </div>`).join('')}
    </div>
  </div>${nav()}`;
}

function viewStats() {
  const done = totalCompleted();
  const tot = LESSONS.length;
  const sc = totalScore();
  const ti = totalItems();
  const acc = accuracy();
  const m = masteredCount();
  const allVoc = LESSONS.reduce((a,l)=>a+l.vocab.length,0);
  const hrs = Math.round(done * 47 / 60 * 10) / 10;

  return `<div class="hdr"><div class="htx">📊 Progress</div></div>
  <div class="main">
    <div class="sg">
      <div class="sc"><div class="sn">${done}</div><div class="sl">Lessons completed</div></div>
      <div class="sc"><div class="sn">${tot-done}</div><div class="sl">Lessons remaining</div></div>
      <div class="sc"><div class="sn">${acc}%</div><div class="sl">Exercise accuracy</div></div>
      <div class="sc"><div class="sn">${m}</div><div class="sl">Words mastered</div></div>
    </div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;font-size:13px;color:var(--gy);margin-bottom:8px">
        <span>Overall progress</span><span>${done}/${tot}</span>
      </div>
      <div class="pm" style="height:8px"><div class="pf" style="width:${Math.round(done/tot*100)}%"></div></div>
    </div>
    <div class="card">
      <div style="font-weight:700;margin-bottom:10px">Lesson breakdown</div>
      ${LESSONS.map(l => {
        const p = lessonProg(l.id);
        const pct = p.total ? Math.round(p.score/p.total*100) : 0;
        return `<div style="display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--gy3)">
          <span style="font-size:18px">${l.emoji}</span>
          <div style="flex:1;min-width:0">
            <div style="font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${l.title}</div>
            ${p.done ? `<div style="font-size:11px;color:var(--g)">✓ ${pct}% · ${p.score}/${p.total} correct</div>` : `<div style="font-size:11px;color:var(--gy)">Not started</div>`}
          </div>
          <span class="bdg ${l.lvl==='B1'?'b1':'b2'}">${l.lvl}</span>
        </div>`;
      }).join('')}
    </div>
    <button class="btn bs bfw" style="margin-top:4px" onclick="if(confirm('Reset all progress?')){ST.prog={};ST.fllearn={};save();render()}">Reset progress</button>
  </div>${nav()}`;
}

// ── Actions ───────────────────────────────────────────────────────────────────
function goto(v) {
  ST.view = v;
  if (v === 'flash') buildFlashPool();
  render();
}

function startLesson(id) {
  ST.view = 'lesson';
  ST.lid = id;
  ST.ltab = 'theory';
  render();
}

function nextLesson(id) {
  const idx = LESSONS.findIndex(l => l.id === id);
  const next = LESSONS[idx+1];
  if (next) { startLesson(next.id); }
  else { goto('lessons'); }
}

function setLTab(t) {
  ST.ltab = t;
  if (t === 'ex') { startEx(ST.lid); return; }
  render();
}

function startEx(id) {
  ST.lid = id;
  ST.ltab = 'ex';
  ST.eidx = 0;
  ST.edone = false;
  ST.ecor = 0;
  ST.echeck = null;
  render();
}

function checkMC(chosen, correct) {
  if (ST.edone) return;
  ST.edone = true;
  ST.echeck = chosen;
  if (chosen === correct) ST.ecor++;
  render();
}

function checkFill() {
  if (ST.edone) return;
  const inp = document.getElementById('fians');
  if (!inp) return;
  const val = inp.value;
  const l = getLesson(ST.lid);
  const ex = l.ex[ST.eidx];
  const correct = normalize(val) === normalize(ex.a);
  ST.edone = true;
  ST.echeck = correct;
  if (correct) ST.ecor++;
  render();
  setTimeout(()=>{
    const fi = document.getElementById('fians');
    if (fi) { fi.value = val; fi.classList.add(correct?'ok':'no'); }
  },10);
}

function nextEx() {
  ST.eidx++;
  ST.edone = false;
  ST.echeck = null;
  render();
}

// Flashcard actions
function buildFlashPool() {
  let pool = [];
  if (ST.flset === 'all') {
    LESSONS.forEach(l => { l.vocab.forEach(v => pool.push({...v, _lid: l.id})); });
  } else if (ST.flset === 'learn') {
    LESSONS.forEach(l => { l.vocab.forEach(v => {
      if (ST.fllearn[l.id+'_'+v.es]) pool.push({...v, _lid: l.id});
    });});
    if (!pool.length) { ST.flset='all'; buildFlashPool(); return; }
  } else {
    const lid = parseInt(ST.flset);
    const l = getLesson(lid);
    if (l) pool = l.vocab.map(v => ({...v, _lid: l.id}));
  }
  // shuffle
  for (let i = pool.length-1; i>0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [pool[i],pool[j]] = [pool[j],pool[i]];
  }
  ST.flpool = pool;
  ST.flidx = 0;
  ST.flflip = false;
}

function setFlSet(s) {
  ST.flset = s;
  buildFlashPool();
  render();
}

function flipCard() { ST.flflip = !ST.flflip; render(); }
function nextCard() { ST.flidx = (ST.flidx+1) % ST.flpool.length; ST.flflip = false; render(); }
function prevCard() { ST.flidx = (ST.flidx-1+ST.flpool.length) % ST.flpool.length; ST.flflip = false; render(); }

function markLearn(key) {
  ST.fllearn[key] = true;
  save();
  nextCard();
}
function markKnow(key) {
  delete ST.fllearn[key];
  save();
  nextCard();
}

function setPBCat(i) { ST.pbcat = i; render(); }

// ── Main render ───────────────────────────────────────────────────────────────
function render() {
  let html = '';
  if (ST.view === 'home') html = viewHome();
  else if (ST.view === 'lessons') html = viewLessons();
  else if (ST.view === 'lesson') html = viewLesson(ST.lid);
  else if (ST.view === 'flash') html = viewFlash();
  else if (ST.view === 'phrase') html = viewPhrase();
  else if (ST.view === 'stats') html = viewStats();
  document.getElementById('app').innerHTML = html;
  bindAll();
}

function bindAll() {
  // Focus fill input if present
  const fi = document.getElementById('fians');
  if (fi && !ST.edone) { setTimeout(()=>fi.focus(),80); }
}

// ── SW Registration ───────────────────────────────────────────────────────────
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/spanish/sw.js').catch(()=>{});
  });
}

// ── Boot ──────────────────────────────────────────────────────────────────────
render();
</script></body></html>
