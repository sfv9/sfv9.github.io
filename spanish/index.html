<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Spanish Advanced</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1e40af">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--b:#1e40af;--b2:#3b82f6;--b3:#dbeafe;--g:#059669;--g2:#d1fae5;--r:#dc2626;--r2:#fee2e2;--a:#d97706;--a2:#fef3c7;--gy:#64748b;--gy2:#f1f5f9;--gy3:#e2e8f0;--tx:#0f172a;--mu:#475569;--wh:#fff;--bg:#f8fafc;--rad:12px;--rads:8px;--sh:0 1px 3px rgba(0,0,0,.1),0 1px 2px rgba(0,0,0,.06);--shm:0 4px 6px rgba(0,0,0,.07),0 2px 4px rgba(0,0,0,.06)}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;line-height:1.5}
#app{min-height:100vh}
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--wh);border-top:1px solid var(--gy3);display:flex;z-index:100;padding-bottom:env(safe-area-inset-bottom)}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px;cursor:pointer;color:var(--gy);border:none;background:none;font-size:10px;font-weight:600;transition:.15s;text-transform:uppercase;letter-spacing:.04em}
.nb.on{color:var(--b2)}
.nb svg{width:22px;height:22px}
.hdr{background:var(--wh);border-bottom:1px solid var(--gy3);padding:14px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:50;min-height:60px}
.hbk{display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;background:var(--gy2);cursor:pointer;border:none;color:var(--tx);flex-shrink:0;font-size:18px}
.htx{font-size:17px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hsub{font-size:11px;color:var(--gy);margin-top:1px}
.main{padding:16px;padding-bottom:80px;max-width:680px;margin:0 auto}
.card{background:var(--wh);border-radius:var(--rad);box-shadow:var(--sh);padding:16px;margin-bottom:12px}
/* LESSON LIST */
.unit-lbl{padding:14px 0 6px;font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--gy);text-transform:uppercase}
.lc{background:var(--wh);border-radius:var(--rad);box-shadow:var(--sh);padding:14px 16px;margin-bottom:8px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:.15s;border:2px solid transparent}
.lc:hover{border-color:var(--b3);box-shadow:var(--shm)}
.lc.done{border-color:var(--g2)}
.le{font-size:26px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:var(--gy2);border-radius:10px;flex-shrink:0}
.li{flex:1;min-width:0}
.lt{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lm{font-size:12px;color:var(--gy);margin-top:2px;display:flex;align-items:center;gap:8px}
.bdg{font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;letter-spacing:.04em}
.b1{background:#e0e7ff;color:#3730a3}.b2{background:#f3e8ff;color:#7e22ce}.gd{background:var(--g2);color:var(--g)}
.pm{height:3px;background:var(--gy3);border-radius:2px;margin-top:6px}
.pf{height:100%;background:var(--g);border-radius:2px;transition:.3s}
/* TABS */
.tabs{display:flex;background:var(--gy2);border-radius:10px;padding:3px;margin-bottom:16px}
.tab{flex:1;text-align:center;padding:8px 4px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;color:var(--mu);transition:.15s;border:none;background:none}
.tab.on{background:var(--wh);color:var(--b);box-shadow:var(--sh)}
/* THEORY */
.th h3{font-size:16px;font-weight:700;margin:18px 0 8px;color:var(--b)}
.th h3:first-child{margin-top:0}
.th h4{font-size:14px;font-weight:600;margin:14px 0 6px}
.th p{font-size:14px;line-height:1.65;margin-bottom:10px;color:var(--tx)}
.th table{width:100%;border-collapse:collapse;margin:8px 0 14px;font-size:13px}
.th th{background:var(--b);color:white;padding:7px 10px;text-align:left;font-weight:600}
.th td{padding:7px 10px;border-bottom:1px solid var(--gy3)}
.th tr:nth-child(even) td{background:var(--gy2)}
.eg{background:var(--b3);border-left:3px solid var(--b2);padding:10px 12px;border-radius:0 var(--rads) var(--rads) 0;margin:8px 0;font-size:14px}
.eg em{display:block;color:var(--gy);font-style:normal;font-size:12px;margin-top:4px}
.note{background:var(--a2);border-left:3px solid var(--a);padding:10px 12px;border-radius:0 var(--rads) var(--rads) 0;margin:10px 0;font-size:13px}
.tip{background:var(--g2);border-left:3px solid var(--g);padding:10px 12px;border-radius:0 var(--rads) var(--rads) 0;margin:10px 0;font-size:13px}
/* VOCAB */
.vi{display:flex;align-items:flex-start;gap:10px;padding:11px 0;border-bottom:1px solid var(--gy3)}
.vi:last-child{border-bottom:none}
.ves{font-weight:700;font-size:15px}
.ven{font-size:12px;color:var(--mu);margin-top:1px}
.vex{font-size:12px;color:var(--gy);font-style:italic;margin-top:3px}
.vxt{font-size:11px;color:var(--mu);margin-top:2px}
.spk{background:none;border:none;cursor:pointer;color:var(--b2);padding:2px;flex-shrink:0;font-size:20px;margin-top:1px}
/* EXERCISES */
.exhdr{display:flex;align-items:center;margin-bottom:16px;gap:10px}
.excnt{font-size:12px;color:var(--gy);font-weight:500;white-space:nowrap}
.expb{flex:1;height:4px;background:var(--gy3);border-radius:2px}
.expf{height:100%;background:var(--b2);border-radius:2px;transition:.3s}
.excard{background:var(--wh);border-radius:var(--rad);box-shadow:var(--sh);padding:20px}
.extype{font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--mu);text-transform:uppercase;margin-bottom:8px}
.exq{font-size:16px;font-weight:600;line-height:1.55;margin-bottom:16px}
.exq .bl{display:inline-block;min-width:70px;border-bottom:2px solid var(--b2);text-align:center}
.opt{display:block;width:100%;text-align:left;padding:11px 14px;border:2px solid var(--gy3);border-radius:10px;margin-bottom:8px;font-size:14px;cursor:pointer;background:white;transition:.15s;color:var(--tx);font-family:inherit}
.opt:hover:not(:disabled){border-color:var(--b2);background:var(--b3)}
.opt.ok{border-color:var(--g);background:var(--g2);color:var(--g)}
.opt.no{border-color:var(--r);background:var(--r2);color:var(--r)}
.opt:disabled{cursor:default}
.fi{width:100%;padding:11px 14px;border:2px solid var(--gy3);border-radius:10px;font-size:15px;outline:none;font-family:inherit;transition:.15s}
.fi:focus{border-color:var(--b2)}
.fi.ok{border-color:var(--g);background:var(--g2)}
.fi.no{border-color:var(--r);background:var(--r2)}
.fb{margin-top:12px;padding:11px 13px;border-radius:var(--rads);font-size:14px;font-weight:500}
.fb.ok{background:var(--g2);color:var(--g)}
.fb.no{background:var(--r2);color:var(--r)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 20px;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;border:none;transition:.15s;font-family:inherit}
.bp{background:var(--b);color:white}.bp:hover{background:#1d3da8}
.bs{background:var(--gy2);color:var(--tx)}.bs:hover{background:var(--gy3)}
.bfw{width:100%}
.exact{display:flex;gap:10px;margin-top:16px}
/* FLASHCARDS */
.fcs{perspective:1200px;margin:16px 0;cursor:pointer}
.fcc{position:relative;height:220px;transform-style:preserve-3d;transition:transform .45s}
.fcc.fl{transform:rotateY(180deg)}
.fcf{position:absolute;inset:0;backface-visibility:hidden;border-radius:var(--rad);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;box-shadow:var(--shm)}
.fcfr{background:var(--b);color:white}
.fcbk{background:white;transform:rotateY(180deg)}
.fcw{font-size:26px;font-weight:800;margin-bottom:6px}
.fcs2{font-size:13px;opacity:.75}
.fchi{font-size:12px;color:var(--gy);margin-top:6px}
.fcct{text-align:center;font-size:12px;color:var(--gy);margin-bottom:6px}
.fcbtns{display:flex;gap:8px;margin-top:12px}
.fck{flex:1;background:var(--g);color:white;padding:12px;border-radius:10px;border:none;cursor:pointer;font-weight:700;font-size:14px;font-family:inherit}
.fcl{flex:1;background:var(--a);color:white;padding:12px;border-radius:10px;border:none;cursor:pointer;font-weight:700;font-size:14px;font-family:inherit}
.chips{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.chip{padding:6px 12px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;border:2px solid var(--gy3);background:white;color:var(--gy);transition:.15s}
.chip.on{background:var(--b);color:white;border-color:var(--b)}
/* HOME */
.hero{background:linear-gradient(135deg,#1e40af 0%,#1e3a8a 100%);border-radius:var(--rad);padding:22px;color:white;margin-bottom:14px}
.hero h1{font-size:22px;font-weight:800;margin-bottom:5px}
.hero p{font-size:13px;opacity:.85;line-height:1.5}
.hstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.hs{background:rgba(255,255,255,.15);border-radius:var(--rads);padding:10px;text-align:center}
.hs b{display:block;font-size:20px;font-weight:800}
.hs span{font-size:10px;opacity:.8}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.qac{background:var(--wh);border-radius:var(--rad);box-shadow:var(--sh);padding:14px;cursor:pointer;transition:.15s;border:2px solid transparent}
.qac:hover{border-color:var(--b3)}
.qac .ico{font-size:26px;margin-bottom:4px}
.qac strong{display:block;font-size:13px;font-weight:700}
.qac span{font-size:11px;color:var(--gy)}
/* PHRASEBOOK */
.pcat{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--gy);text-transform:uppercase;padding:12px 0 6px}
.pi{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--gy3)}
.pi:last-child{border-bottom:none}
.pes{font-weight:600;font-size:13px}
.pen{font-size:12px;color:var(--gy);margin-top:1px}
/* STATS */
.sg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.sc{background:var(--wh);border-radius:var(--rad);box-shadow:var(--sh);padding:14px;text-align:center}
.sn{font-size:30px;font-weight:800;color:var(--b)}
.sl{font-size:12px;color:var(--gy);margin-top:3px}
@media(min-width:600px){.main{padding:20px 24px 80px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
const L=[
{id:1,unit:1,lvl:'B1',dur:40,emoji:'📖',title:'Preterite vs. Imperfect',desc:'Master the core contrast between the two main past tenses through narrative.',
obj:['Use preterite for completed bounded actions','Use imperfect for habitual/ongoing states','Combine both in extended storytelling'],
theory:`<h3>The Core Distinction</h3><p>Both describe the past, but frame it differently:</p><table><tr><th>Preterite (Indefinido)</th><th>Imperfect (Imperfecto)</th></tr><tr><td>Completed, bounded action</td><td>Ongoing / habitual state</td></tr><tr><td>Specific moment in time</td><td>Background description</td></tr><tr><td>Sudden event</td><td>Interrupted action</td></tr><tr><td><em>ayer, de repente, una vez</em></td><td><em>siempre, a veces, cuando era niño</em></td></tr></table><div class="eg">De repente <strong>estalló</strong> un incendio. Todos <strong>dormían</strong>.<em>Suddenly a fire broke out. Everyone was sleeping.</em></div><h3>Ser &amp; Ir in Preterite</h3><p>Both are identical: fui, fuiste, fue, fuimos, fuisteis, fueron — context clarifies meaning.</p><div class="tip">💡 Think of the imperfect as the <em>film backdrop</em> and the preterite as the <em>action scenes</em>.</div><h3>Common Signal Words</h3><table><tr><th>→ Preterite</th><th>→ Imperfect</th></tr><tr><td>ayer, anoche, el lunes</td><td>siempre, normalmente, cada día</td></tr><tr><td>de repente, en ese momento</td><td>cuando era niño, antes</td></tr><tr><td>una vez, por primera vez</td><td>mientras, a menudo, solía</td></tr></table>`,
vocab:[
{es:'acontecer',en:'to happen / occur (formal)',ex:'El accidente aconteció a medianoche.',xt:'The accident occurred at midnight.'},
{es:'acudir',en:'to turn up / attend / come',ex:'Nadie acudió a la reunión.',xt:'Nobody turned up to the meeting.'},
{es:'advertir',en:'to warn / to notice',ex:'Me advirtió del peligro antes de salir.',xt:'She warned me of the danger before leaving.'},
{es:'albergar',en:'to harbour (a feeling) / to house',ex:'Su corazón albergaba una esperanza secreta.',xt:'His heart harboured a secret hope.'},
{es:'atravesar',en:'to cross / go through (a period)',ex:'Atravesó una etapa muy difícil.',xt:'She went through a very difficult period.'},
{es:'averiguar',en:'to find out / ascertain',ex:'Intentó averiguar la verdad por sí mismo.',xt:'He tried to find out the truth on his own.'},
{es:'carecer de',en:'to lack',ex:'Carecía de los recursos necesarios.',xt:'He lacked the necessary resources.'},
{es:'concluir',en:'to conclude / finish',ex:'El proyecto concluyó antes de lo previsto.',xt:'The project concluded ahead of schedule.'},
{es:'contemplar',en:'to gaze at / to consider',ex:'Contemplaba el paisaje en silencio.',xt:'She gazed at the landscape in silence.'},
{es:'cosechar',en:'to reap / harvest',ex:'Cosechó los frutos de años de trabajo.',xt:'He reaped the fruits of years of work.'},
{es:'darse cuenta de',en:'to realise',ex:'Me di cuenta de que había cometido un error.',xt:'I realised I had made a mistake.'},
{es:'dedicarse a',en:'to devote oneself to',ex:'Se dedicaba a la enseñanza con pasión.',xt:'She devoted herself to teaching with passion.'},
{es:'desaparecer',en:'to disappear',ex:'De repente, la figura desapareció.',xt:'Suddenly the figure disappeared.'},
{es:'desempeñar',en:'to carry out / fulfil (a role)',ex:'Desempeñó un papel crucial en el proceso.',xt:'She played a crucial role in the process.'},
{es:'destacar',en:'to stand out / highlight',ex:'Siempre destacaba entre sus compañeros.',xt:'He always stood out among his peers.'},
{es:'encargarse de',en:'to take charge of',ex:'Se encargó de organizar todo el evento.',xt:'She took charge of organising the whole event.'},
{es:'enfrentarse a',en:'to face / confront',ex:'Se enfrentaron a enormes dificultades.',xt:'They faced enormous difficulties.'},
{es:'enterarse de',en:'to find out about',ex:'Se enteró de la noticia muy tarde.',xt:'He found out about the news very late.'},
{es:'estallar',en:'to break out / explode',ex:'La guerra estalló de forma inesperada.',xt:'The war broke out unexpectedly.'},
{es:'extrañar',en:'to miss (someone/something)',ex:'Extrañaba a su familia en el extranjero.',xt:'She missed her family abroad.'},
{es:'fallecer',en:'to pass away / die (formal)',ex:'Su abuelo falleció a los noventa años.',xt:'His grandfather passed away at ninety.'},
{es:'hallarse',en:'to find oneself / be located',ex:'Se hallaba en una situación complicada.',xt:'She found herself in a complicated situation.'},
{es:'lograr',en:'to achieve / manage to',ex:'Logró terminar la carrera con honores.',xt:'He managed to finish the degree with honours.'},
{es:'marcharse',en:'to leave / go away',ex:'Se marchó sin decir una sola palabra.',xt:'She left without saying a single word.'},
{es:'ocurrir',en:'to occur / happen',ex:'¿Sabes lo que ocurrió aquella noche?',xt:'Do you know what happened that night?'},
{es:'percatarse de',en:'to notice / become aware of',ex:'No se percató de la presencia del intruso.',xt:'He did not notice the intruder\'s presence.'},
{es:'pertenecer a',en:'to belong to',ex:'Este manuscrito pertenece al siglo XVIII.',xt:'This manuscript belongs to the 18th century.'},
{es:'recuperarse',en:'to recover',ex:'Tardó meses en recuperarse de la lesión.',xt:'It took months to recover from the injury.'},
{es:'rendirse',en:'to give up / surrender',ex:'No se rindió a pesar de los obstáculos.',xt:'She didn\'t give up despite the obstacles.'},
{es:'superar',en:'to overcome / surpass',ex:'Con el tiempo, superó todos sus miedos.',xt:'Over time, she overcame all her fears.'},
{es:'trasladarse',en:'to move / relocate',ex:'Se trasladaron a otra ciudad por trabajo.',xt:'They relocated to another city for work.'}
],
ex:[
{t:'mc',q:'Which trigger word typically calls for the <strong>imperfect</strong>?',o:['de repente','ayer por la noche','una vez','cuando era niño'],c:3},
{t:'fill',q:'La guerra _____ de madrugada. [estallar — preterite]',a:'estalló',h:'3rd-person singular preterite of -ar verb: -ó'},
{t:'mc',q:'"Carecer de" means:',o:['to care for','to carry','to lack','to find'],c:2},
{t:'fill',q:'De niño, me _____ a coleccionar sellos con mi padre. [dedicarse — imperfect]',a:'dedicaba',h:'imperfect -ar reflex: me dedicaba'},
{t:'mc',q:'"Percatarse de algo" is a synonym of:',o:['marcharse','darse cuenta de algo','rendirse','extrañar algo'],c:1},
{t:'fill',q:'No _____ a pesar de todos los obstáculos. [rendirse — preterite, 3rd sg]',a:'se rindió',h:'rind- (stem-change) + -ió + reflexive'},
{t:'mc',q:'Choose the correct combination: "Mientras yo _____ (read), ella _____ (arrived)"',o:['leí / llegó','leía / llegaba','leía / llegó','leí / llegaba'],c:2},
{t:'fill',q:'Con el tiempo, _____ sus miedos. [superar — preterite, 3rd sg]',a:'superó',h:'superar → superó'},
{t:'mc',q:'"Desempeñar un papel" means:',o:['to play music','to play a role','to deploy troops','to perform surgery'],c:1},
{t:'fill',q:'Se _____ en una situación muy difícil. [hallarse — preterite, 3rd sg]',a:'halló',h:'reflexive halló / se halló'},
{t:'mc',q:'Which is the formal/literary equivalent of "morirse"?',o:['marcharse','desaparecer','fallecer','rendirse'],c:2},
{t:'fill',q:'El proyecto _____ antes de lo previsto. [concluir — preterite]',a:'concluyó',h:'-uir verb: concluyó'}
]},

{id:2,unit:1,lvl:'B1',dur:40,emoji:'🌅',title:'The Imperfect — Habits, States & Atmosphere',desc:'Use the imperfect to describe habitual past actions, emotional states, and scene-setting.',
obj:['Conjugate all verb types in the imperfect','Recognise the 3 fully irregular imperfects (ser, ir, ver)','Describe atmosphere and ongoing states naturally'],
theory:`<h3>Regular Imperfect Conjugation</h3><table><tr><th>Person</th><th>-AR (hablar)</th><th>-ER/-IR (comer/vivir)</th></tr><tr><td>yo</td><td>hablaba</td><td>comía / vivía</td></tr><tr><td>tú</td><td>hablabas</td><td>comías</td></tr><tr><td>él/ella</td><td>hablaba</td><td>comía</td></tr><tr><td>nosotros</td><td>hablábamos</td><td>comíamos</td></tr><tr><td>ellos</td><td>hablaban</td><td>comían</td></tr></table><h3>The Only Irregular Imperfects</h3><table><tr><th>SER</th><th>IR</th><th>VER</th></tr><tr><td>era / eras / era</td><td>iba / ibas / iba</td><td>veía / veías / veía</td></tr><tr><td>éramos / eran</td><td>íbamos / iban</td><td>veíamos / veían</td></tr></table><h3>Key Uses</h3><p><strong>1. Habitual actions:</strong> <em>Siempre se levantaba a las seis.</em></p><p><strong>2. Ongoing states:</strong> <em>Estaba muy nervioso aquella tarde.</em></p><p><strong>3. Background description:</strong> <em>Llovía y las calles estaban vacías.</em></p><p><strong>4. Soler + infinitive</strong> = used to: <em>Solía pasear por el parque.</em></p><div class="note">⚠️ "Soler" only exists in present and imperfect — no preterite form.</div>`,
vocab:[
{es:'acostumbrarse',en:'to get used to / be accustomed to',ex:'Con el tiempo se acostumbraba a vivir solo.',xt:'Over time he got used to living alone.'},
{es:'afligir',en:'to afflict / distress',ex:'Le afligía no poder ayudar a los demás.',xt:'Not being able to help others distressed her.'},
{es:'aguardar',en:'to wait / await',ex:'La aguardaba en la entrada del museo.',xt:'He was waiting for her at the museum entrance.'},
{es:'alegrarse',en:'to be glad / happy',ex:'Se alegraba de verlos sanos y salvos.',xt:'She was glad to see them safe and sound.'},
{es:'aliviar',en:'to relieve / soothe',ex:'La música aliviaba su dolor interior.',xt:'Music soothed her inner pain.'},
{es:'amanecer',en:'to dawn',ex:'Cuando amanecía, los pájaros cantaban.',xt:'When it dawned, the birds were singing.'},
{es:'anochecer',en:'to get dark / nightfall',ex:'Al anochecer, encendía todas las lámparas.',xt:'At nightfall, she lit all the lamps.'},
{es:'apetecer',en:'to feel like / crave',ex:'Le apetecía un café caliente en invierno.',xt:'He felt like a hot coffee in winter.'},
{es:'arrepentirse',en:'to regret / repent',ex:'Se arrepentía de no haber estudiado más.',xt:'She regretted not having studied more.'},
{es:'asomarse',en:'to lean out / look out',ex:'Cada mañana se asomaba a la ventana.',xt:'Every morning she looked out the window.'},
{es:'atreverse a',en:'to dare to',ex:'No se atrevía a decirle la verdad.',xt:'He didn\'t dare tell her the truth.'},
{es:'charlar',en:'to chat',ex:'Los vecinos charlaban en el portal.',xt:'The neighbours were chatting in the doorway.'},
{es:'disfrutar de',en:'to enjoy',ex:'Disfrutaba de los domingos tranquilos.',xt:'She enjoyed peaceful Sundays.'},
{es:'echar de menos',en:'to miss (someone/something)',ex:'Echaba de menos a sus amigos de la infancia.',xt:'He missed his childhood friends.'},
{es:'empeñarse en',en:'to insist on / be determined to',ex:'Se empeñaba en resolver el problema sola.',xt:'She was determined to solve the problem alone.'},
{es:'entristecer',en:'to sadden',ex:'Le entristecía ver la ciudad tan cambiada.',xt:'Seeing the city so changed saddened him.'},

{id:3,unit:1,lvl:'B1',dur:40,emoji:'✈️',title:'Present Perfect — Experience & Relevance',desc:'Use the pretérito perfecto to link the past to the present and describe life experiences.',
obj:['Form the present perfect with haber + past participle','Use it correctly for recent events and life experiences','Distinguish its use from the preterite (Spain vs. Latin America)'],
theory:`<h3>Formation</h3><p><strong>haber</strong> (conjugated) + <strong>past participle</strong></p><table><tr><th>he</th><th>has</th><th>ha</th><th>hemos</th><th>habéis</th><th>han</th></tr></table><h3>Irregular Past Participles</h3><table><tr><th>Infinitive</th><th>Participle</th><th>Infinitive</th><th>Participle</th></tr><tr><td>hacer</td><td>hecho</td><td>ver</td><td>visto</td></tr><tr><td>decir</td><td>dicho</td><td>escribir</td><td>escrito</td></tr><tr><td>poner</td><td>puesto</td><td>abrir</td><td>abierto</td></tr><tr><td>volver</td><td>vuelto</td><td>romper</td><td>roto</td></tr><tr><td>morir</td><td>muerto</td><td>cubrir</td><td>cubierto</td></tr></table><h3>Key Uses</h3><p><strong>1. Recent past (Spain):</strong> <em>Esta mañana he tomado café.</em></p><p><strong>2. Life experience:</strong> <em>¿Has estado alguna vez en Tokio?</em></p><p><strong>3. Relevance to present:</strong> <em>He perdido las llaves — no puedo entrar.</em></p><div class="note">⚠️ In most of Latin America, the preterite (fui, comí) is preferred even for today's events. The perfect is more common in Spain.</div><h3>Key Adverbs</h3><table><tr><th>With Perfect</th><th>Meaning</th></tr><tr><td>ya</td><td>already</td></tr><tr><td>todavía no / aún no</td><td>not yet</td></tr><tr><td>alguna vez</td><td>ever</td></tr><tr><td>nunca / jamás</td><td>never / ever (neg)</td></tr><tr><td>recientemente / últimamente</td><td>recently / lately</td></tr></table>`,
vocab:[
{es:'alcanzar',en:'to reach / attain',ex:'Ha alcanzado un nivel muy alto en español.',xt:'She has reached a very high level in Spanish.'},
{es:'alojarse',en:'to stay (in accommodation)',ex:'Nunca me he alojado en un hotel de lujo.',xt:'I have never stayed in a luxury hotel.'},
{es:'ampliar',en:'to expand / broaden',ex:'Este viaje ha ampliado mi visión del mundo.',xt:'This trip has broadened my worldview.'},
{es:'arriesgarse',en:'to take a risk',ex:'Nunca se ha arriesgado tanto en su vida.',xt:'She has never taken such a risk in her life.'},
{es:'asombrar',en:'to astonish / amaze',ex:'Sus resultados han asombrado a todos.',xt:'His results have astonished everyone.'},

{es:'demostrar',en:'to demonstrate / prove',ex:'Ha demostrado su valía en varias ocasiones.',xt:'He has proved his worth on several occasions.'},
{es:'descubrir',en:'to discover',ex:'Hemos descubierto un restaurante increíble.',xt:'We have discovered an incredible restaurant.'},
{es:'emprender',en:'to undertake / embark on',ex:'Ha emprendido un nuevo negocio este año.',xt:'She has embarked on a new business this year.'},
{es:'enriquecer',en:'to enrich',ex:'Vivir en el extranjero me ha enriquecido.',xt:'Living abroad has enriched me.'},

{id:4,unit:1,lvl:'B1',dur:40,emoji:'⏮️',title:'The Pluperfect — The Past Before the Past',desc:'Express actions completed before another past moment using the pluperfect tense.',
obj:['Form the pluperfect with había/habías... + past participle','Correctly sequence past events','Recognise pluperfect triggers in narrative'],
theory:`<h3>Formation</h3><p><strong>había/habías/había/habíamos/habíais/habían</strong> + past participle</p><div class="eg">Cuando llegué, ella <strong>ya había salido</strong>.<em>When I arrived, she had already left.</em></div><h3>Key Uses</h3><p><strong>1. Completed before another past action:</strong> <em>Nunca había viajado en avión antes de aquello.</em></p><p><strong>2. After "cuando" with a past main clause:</strong> <em>Cuando llamé, ya habían comido.</em></p><p><strong>3. After "ya", "todavía no", "nunca antes":</strong> <em>Ya había terminado cuando llegaron.</em></p><h3>Sequence Markers</h3><table><tr><th>Marker</th><th>Use</th></tr><tr><td>ya había</td><td>had already</td></tr><tr><td>todavía no había</td><td>had not yet</td></tr><tr><td>nunca antes había</td><td>had never before</td></tr><tr><td>antes de que</td><td>before (+ subjunctive)</td></tr><tr><td>cuando</td><td>when (+ preterite main)</td></tr></table><div class="tip">💡 The pluperfect in Spanish works exactly like "had + participle" in English.</div>`,
vocab:[
{es:'abandonar',en:'to abandon / leave',ex:'Había abandonado el proyecto a mitad.',xt:'He had abandoned the project halfway.'},
{es:'agudizarse',en:'to worsen / intensify',ex:'La crisis se había agudizado antes de la reforma.',xt:'The crisis had worsened before the reform.'},
{es:'anticipar',en:'to anticipate',ex:'Nadie había anticipado ese resultado.',xt:'Nobody had anticipated that result.'},

{es:'ceder',en:'to yield / give way',ex:'Había cedido ante la presión del grupo.',xt:'He had yielded to group pressure.'},
{es:'colapsar',en:'to collapse',ex:'El sistema había colapsado antes del rescate.',xt:'The system had collapsed before the rescue.'},
{es:'comprometerse',en:'to commit / get engaged',ex:'Se habían comprometido a terminar a tiempo.',xt:'They had committed to finishing on time.'},
{es:'confesar',en:'to confess',ex:'Le había confesado la verdad la noche anterior.',xt:'She had confessed the truth the previous night.'},
{es:'contraer',en:'to contract (an illness) / take on',ex:'Había contraído una enfermedad tropical.',xt:'He had contracted a tropical illness.'},
{es:'dañar',en:'to damage / harm',ex:'El temporal había dañado varios edificios.',xt:'The storm had damaged several buildings.'},
{es:'derrumbar',en:'to demolish / collapse',ex:'El edificio se había derrumbado durante la noche.',xt:'The building had collapsed during the night.'},

{es:'deteriorarse',en:'to deteriorate',ex:'Las relaciones se habían deteriorado irremediablemente.',xt:'Relations had deteriorated irreparably.'},
{es:'disminuir',en:'to diminish / decrease',ex:'Las reservas habían disminuido drásticamente.',xt:'Reserves had decreased drastically.'},
{es:'eliminar',en:'to eliminate',ex:'Habían eliminado todas las opciones viables.',xt:'They had eliminated all viable options.'},

{es:'fracasar',en:'to fail',ex:'El primer intento había fracasado rotundamente.',xt:'The first attempt had failed completely.'},

{es:'incumplir',en:'to breach / fail to fulfil',ex:'Había incumplido el contrato sin excusa.',xt:'He had breached the contract without excuse.'},

{es:'negarse a',en:'to refuse to',ex:'Se habían negado a firmar el acuerdo.',xt:'They had refused to sign the agreement.'},
{es:'rechazar',en:'to reject',ex:'Habían rechazado todas las propuestas.',xt:'They had rejected all the proposals.'},
{es:'retrasar',en:'to delay / postpone',ex:'Los problemas técnicos habían retrasado el lanzamiento.',xt:'Technical problems had delayed the launch.'},
{es:'sacrificar',en:'to sacrifice',ex:'Había sacrificado su carrera por la familia.',xt:'She had sacrificed her career for her family.'},
{es:'separarse',en:'to separate',ex:'Ya se habían separado cuando llegó la noticia.',xt:'They had already separated when the news arrived.'},
{es:'subestimar',en:'to underestimate',ex:'Habían subestimado la dificultad del proyecto.',xt:'They had underestimated the difficulty of the project.'},
{es:'traicionar',en:'to betray',ex:'Nunca había creído que lo traicionaría.',xt:'He had never believed she would betray him.'}
],

{id:5,unit:1,lvl:'B1',dur:45,emoji:'🔗',title:'Narrative Tenses Combined',desc:'Blend preterite, imperfect, perfect and pluperfect in extended storytelling with discourse connectors.',
obj:['Select the appropriate past tense in complex narrative','Use discourse connectors to link past actions','Write cohesive extended past-tense passages'],
theory:`<h3>The Four Past Tenses in Narrative</h3><table><tr><th>Tense</th><th>Function</th><th>Example</th></tr><tr><td>Preterite</td><td>Completed action / plot event</td><td><em>estalló, llegó, dijo</em></td></tr><tr><td>Imperfect</td><td>Background / ongoing state / habit</td><td><em>llovía, era, vivía</em></td></tr><tr><td>Perfect</td><td>Recent / relevant past</td><td><em>ha ocurrido, hemos llegado</em></td></tr><tr><td>Pluperfect</td><td>Before another past moment</td><td><em>había salido, habían terminado</em></td></tr></table><h3>Building a Narrative</h3><div class="eg">Era una tarde fría. <strong>[background — imp.]</strong> De repente, alguien llamó a la puerta. <strong>[event — pret.]</strong> Nos dimos cuenta de que ya lo habíamos visto antes. <strong>[pluperfect]</strong><em>It was a cold afternoon. Suddenly, someone knocked at the door. We realised we had seen him before.</em></div><h3>Discourse Connectors</h3><p>These words glue your narrative together and signal which tense to use:</p><table><tr><th>Connector</th><th>Meaning</th></tr><tr><td>de repente / de golpe</td><td>suddenly — → preterite</td></tr><tr><td>mientras tanto</td><td>meanwhile — → imperfect</td></tr><tr><td>al cabo de + time</td><td>after (period) — → preterite</td></tr><tr><td>acto seguido</td><td>immediately after — → preterite</td></tr><tr><td>sin embargo / no obstante</td><td>however — → any tense</td></tr><tr><td>al fin y al cabo</td><td>after all / in the end</td></tr><tr><td>por consiguiente / por lo tanto</td><td>therefore — → any tense</td></tr></table>`,
vocab:[
{es:'a medida que',en:'as / while (progressive change)',ex:'A medida que pasaban los años, la ciudad cambiaba.',xt:'As the years passed, the city changed.'},
{es:'a pesar de',en:'despite / in spite of',ex:'A pesar del cansancio, siguió trabajando.',xt:'Despite the tiredness, she kept working.'},
{es:'a propósito',en:'on purpose / by the way (parenthetical)',ex:'A propósito, ¿le has dicho ya lo que pasó?',xt:'By the way, have you told him what happened?'},
{es:'acto seguido',en:'immediately after / right afterwards',ex:'Acto seguido, tomó la decisión más difícil.',xt:'Right afterwards, he made the hardest decision.'},
{es:'al cabo de',en:'after (a period of time)',ex:'Al cabo de unas horas, llegaron los refuerzos.',xt:'After a few hours, reinforcements arrived.'},
{es:'al fin y al cabo',en:'after all / in the end',ex:'Al fin y al cabo, tenía razón desde el principio.',xt:'After all, she had been right from the start.'},
{es:'aunque',en:'although / even though / even if',ex:'Aunque llovía, salimos a pasear de todas formas.',xt:'Although it was raining, we went out for a walk anyway.'},
{es:'conforme',en:'as / in accordance with',ex:'Conforme avanzaba la tarde, el ambiente se tensaba.',xt:'As the afternoon progressed, the atmosphere grew tense.'},
{es:'de antemano',en:'beforehand / in advance',ex:'Sabíamos de antemano que sería difícil.',xt:'We knew beforehand that it would be difficult.'},
{es:'de golpe',en:'all at once / suddenly',ex:'De golpe, todo cobró sentido.',xt:'All at once, everything made sense.'},
{es:'de modo que',en:'so that / in such a way that',ex:'Llegó tarde, de modo que no pudo entrar.',xt:'He arrived late, so he couldn\'t get in.'},
{es:'de repente',en:'suddenly',ex:'De repente, se cortó la luz en todo el edificio.',xt:'Suddenly, the power went out in the whole building.'},
{es:'de vez en cuando',en:'from time to time',ex:'De vez en cuando, la visitaba en el hospital.',xt:'From time to time, he would visit her in hospital.'},
{es:'debido a',en:'due to / owing to',ex:'Debido a los problemas técnicos, se retrasó todo.',xt:'Due to technical problems, everything was delayed.'},
{es:'en cambio',en:'on the other hand / instead',ex:'Ella protestó; él, en cambio, se quedó callado.',xt:'She protested; he, on the other hand, stayed silent.'},
{es:'en cuanto',en:'as soon as',ex:'En cuanto llegó, empezó a trabajar.',xt:'As soon as she arrived, she started working.'},
{es:'en el fondo',en:'deep down / at bottom',ex:'En el fondo, sabía que no era culpa suya.',xt:'Deep down, she knew it wasn\'t her fault.'},
{es:'en seguida',en:'right away / immediately',ex:'En seguida se dio cuenta del error.',xt:'He immediately noticed the mistake.'},
{es:'en torno a',en:'around / about (a topic/time)',ex:'En torno a las tres, la situación cambió.',xt:'Around three o\'clock, the situation changed.'},
{es:'en vano',en:'in vain',ex:'Intentó explicarse, pero fue en vano.',xt:'He tried to explain himself, but it was in vain.'},
{es:'en vez de',en:'instead of',ex:'En vez de rendirse, buscó otra solución.',xt:'Instead of giving up, she looked for another solution.'},
{es:'es decir',en:'that is to say / in other words',ex:'Llegó tarde, es decir, perdió la oportunidad.',xt:'He arrived late — in other words, he missed the chance.'},
{es:'finalmente',en:'finally / ultimately',ex:'Finalmente, decidieron no presentar la denuncia.',xt:'Finally, they decided not to file the complaint.'},
{es:'incluso',en:'even / including',ex:'Incluso los más optimistas dudaban del resultado.',xt:'Even the most optimistic doubted the result.'},
{es:'mientras tanto',en:'meanwhile',ex:'Mientras tanto, el resto esperaba noticias.',xt:'Meanwhile, the rest were waiting for news.'},

{id:6,unit:2,lvl:'B1',dur:40,emoji:'🙏',title:'Present Subjunctive — Desire, Emotion & Recommendation',desc:'Form and use the present subjunctive after verbs of will, desire, and recommendation.',
obj:['Conjugate all verb types in the present subjunctive','Identify the "WEIRDO" triggers','Use subjunctive in que-clauses with a different subject'],
theory:`<h3>Formation — Present Subjunctive</h3><p>Start from the <strong>yo present indicative</strong>, drop the -o, add subjunctive endings:</p><table><tr><th>Type</th><th>Yo indic.</th><th>yo / tú / él / nos / vos / ellos</th></tr><tr><td>-AR (hablar)</td><td>hablo</td><td>hable / hables / hable / hablemos / habléis / hablen</td></tr><tr><td>-ER (comer)</td><td>como</td><td>coma / comas / coma / comamos / comáis / coman</td></tr><tr><td>-IR (vivir)</td><td>vivo</td><td>viva / vivas / viva / vivamos / viváis / vivan</td></tr></table><h3>Key Irregular Subjunctives</h3><table><tr><th>Verb</th><th>yo subj.</th></tr><tr><td>ser</td><td>sea</td></tr><tr><td>estar</td><td>esté</td></tr><tr><td>ir</td><td>vaya</td></tr><tr><td>haber</td><td>haya</td></tr><tr><td>saber</td><td>sepa</td></tr><tr><td>dar</td><td>dé</td></tr></table><h3>WEIRDO Triggers</h3><p>The subjunctive follows verbs / expressions of: <strong>W</strong>ishes, <strong>E</strong>motions, <strong>I</strong>mpersonal expressions, <strong>R</strong>ecommendations, <strong>D</strong>oubt/Denial, <strong>O</strong>jalá</p><div class="note">⚠️ Subjunctive is ONLY needed when the subject of the main clause and the subordinate clause are DIFFERENT.<br>"Quiero estudiar" (same subject) vs. "Quiero que estudies" (different subjects).</div>`,
vocab:[
{es:'aceptar',en:'to accept',ex:'Espero que acepten nuestra propuesta.',xt:'I hope they accept our proposal.'},
{es:'aconsejar',en:'to advise',ex:'Te aconsejo que no te rindas.',xt:'I advise you not to give up.'},
{es:'agradecer',en:'to be grateful for / thank',ex:'Agradezco que hayas venido a ayudarme.',xt:'I\'m grateful that you came to help me.'},
{es:'aguantar',en:'to put up with / endure',ex:'No aguanto que lleguen siempre tarde.',xt:'I can\'t stand them always arriving late.'},
{es:'animarse a',en:'to pluck up courage to / feel encouraged to',ex:'Ojalá se anime a hablar con el jefe.',xt:'I hope she plucks up courage to talk to the boss.'},
{es:'apoyar',en:'to support',ex:'Es importante que nos apoyemos mutuamente.',xt:'It\'s important that we support each other.'},
{es:'asegurar',en:'to assure / ensure',ex:'Quiero que me asegures que esto no volverá a ocurrir.',xt:'I want you to assure me this won\'t happen again.'},
{es:'callar',en:'to be quiet / fall silent',ex:'Te pido que te calles un momento.',xt:'I ask you to be quiet for a moment.'},
{es:'comprensivo',en:'understanding / sympathetic',ex:'Espero que sea comprensivo con las circunstancias.',xt:'I hope he is understanding about the circumstances.'},
{es:'confiar en',en:'to trust in',ex:'Es fundamental que confiemos en el proceso.',xt:'It\'s essential that we trust the process.'},
{es:'consolar',en:'to console',ex:'Me alegra que la hayas consolado en ese momento.',xt:'I\'m glad you consoled her at that moment.'},
{es:'culpar',en:'to blame',ex:'No quiero que me culpes por lo sucedido.',xt:'I don\'t want you to blame me for what happened.'},
{es:'decepcionar',en:'to disappoint',ex:'Me decepciona que no hayas cumplido tu palabra.',xt:'It disappoints me that you haven\'t kept your word.'},
{es:'desear',en:'to wish / desire',ex:'Deseo que todos tengan buena suerte.',xt:'I wish everyone good luck.'},
{es:'disculparse',en:'to apologise',ex:'Es necesario que te disculpes con ella.',xt:'It\'s necessary for you to apologise to her.'},
{es:'distanciarse',en:'to distance oneself',ex:'Siento que se esté distanciando de nosotros.',xt:'I feel she\'s distancing herself from us.'},
{es:'dudar',en:'to doubt',ex:'Dudo que lleguen antes de las seis.',xt:'I doubt they\'ll arrive before six.'},
{es:'emocionar',en:'to move emotionally / excite',ex:'Me emociona que hayas conseguido el trabajo.',xt:'I\'m moved that you got the job.'},

{es:'envidiar',en:'to envy',ex:'Ojalá no envidies lo que otros tienen.',xt:'I hope you don\'t envy what others have.'},

{es:'exigir',en:'to demand / require',ex:'El director exige que todos lleguen puntual.',xt:'The director demands that everyone arrives on time.'},

{es:'molestar',en:'to bother / annoy',ex:'Me molesta que me interrumpas constantemente.',xt:'It bothers me that you constantly interrupt me.'},

{es:'rogar',en:'to beg / request formally',ex:'Les ruego que guarden silencio.',xt:'I ask you all to please be quiet.'}
],

{id:7,unit:2,lvl:'B1',dur:40,emoji:'🤔',title:'Subjunctive — Doubt, Denial & Impersonal Expressions',desc:'Use the subjunctive to express doubt, deny facts, and make impersonal assertions.',
obj:['Use subjunctive after no creer que and dudar que','Trigger subjunctive with impersonal expressions','Distinguish indicative (certainty) vs. subjunctive (doubt/denial)'],
theory:`<h3>Indicative vs. Subjunctive After Opinion Verbs</h3><table><tr><th>Indicative (certainty)</th><th>Subjunctive (doubt / negation)</th></tr><tr><td>Creo que <em>viene</em>. (I think he's coming)</td><td>No creo que <em>venga</em>. (I don\'t think he\'s coming)</td></tr><tr><td>Es cierto que <em>existe</em>.</td><td>No es cierto que <em>exista</em>.</td></tr><tr><td>Está claro que <em>funciona</em>.</td><td>No está claro que <em>funcione</em>.</td></tr></table><h3>Impersonal Expressions</h3><table><tr><th>→ Subjunctive</th><th>→ Indicative</th></tr><tr><td>Es posible que...</td><td>Es cierto que...</td></tr><tr><td>Es probable que...</td><td>Es obvio que...</td></tr><tr><td>Es importante que...</td><td>Es evidente que...</td></tr><tr><td>Es necesario que...</td><td>Es verdad que...</td></tr><tr><td>Es una lástima que...</td><td>Es un hecho que...</td></tr></table><div class="tip">💡 Rule of thumb: if you could replace the expression with "I know for certain", use indicative. If you\'d say "I\'m not sure", use subjunctive.</div>`,
vocab:[
{es:'admitir',en:'to admit',ex:'Admite que puede haber errores en el sistema.',xt:'He admits there may be errors in the system.'},
{es:'afirmar',en:'to affirm / assert',ex:'Afirma que el proyecto es viable.',xt:'She asserts that the project is feasible.'},

{es:'rebatir',en:'to refute / counter',ex:'Difícilmente se puede rebatir ese argumento.',xt:'That argument can hardly be refuted.'},

{id:8,unit:2,lvl:'B1',dur:45,emoji:'🔮',title:'Imperfect Subjunctive — Hypotheticals & Reported Speech',desc:'Master the imperfect subjunctive in si-clauses, "como si" constructions, and reported speech backshift.',
obj:['Conjugate verbs in the imperfect subjunctive','Use -ra and -se forms interchangeably','Apply in si-clauses and with "como si"'],
theory:`<h3>Formation — Imperfect Subjunctive</h3><p>Take the 3rd-person plural preterite, drop -ron, add endings:</p><table><tr><th>Person</th><th>-ra endings</th><th>-se endings (equiv.)</th></tr><tr><td>yo</td><td>-ra</td><td>-se</td></tr><tr><td>tú</td><td>-ras</td><td>-ses</td></tr><tr><td>él/ella</td><td>-ra</td><td>-se</td></tr><tr><td>nosotros</td><td>-ramos</td><td>-semos</td></tr><tr><td>vosotros</td><td>-rais</td><td>-seis</td></tr><tr><td>ellos</td><td>-ran</td><td>-sen</td></tr></table><div class="eg">hablar → hablaron → hablara/hablase<br>tener → tuvieron → tuviera/tuviese<br>ir/ser → fueron → fuera/fuese</div><h3>Key Uses</h3><p><strong>1. Si-clauses (hypothetical present):</strong> <em>Si tuviera dinero, viajaría más.</em></p><p><strong>2. "Como si":</strong> <em>Habla como si lo supiera todo.</em></p><p><strong>3. Reported speech backshift:</strong> <em>Dijo que fuera al médico.</em></p><p><strong>4. Polite requests:</strong> <em>Quisiera un café, por favor.</em></p><div class="tip">💡 The -ra form is more common in speech; -se appears mainly in formal writing.</div>`,
vocab:[

{es:'formular',en:'to formulate',ex:'Si lo formularas de otra manera, quedaría mejor.',xt:'If you formulated it differently, it would sound better.'},
{es:'funcionar',en:'to function / work',ex:'Como si funcionara perfectamente, siguió adelante.',xt:'As if it were working perfectly, she carried on.'},
{es:'imaginar',en:'to imagine',ex:'Imagina que pudieras vivir donde quisieras.',xt:'Imagine you could live wherever you wanted.'},
{es:'implicar',en:'to imply / involve',ex:'Eso implicaría que revisáramos todo de nuevo.',xt:'That would imply we review everything again.'},

{id:9,unit:2,lvl:'B2',dur:45,emoji:'⏳',title:'Subjunctive in Adverbial Clauses',desc:'Use the subjunctive in purpose, concession, condition, and time clauses pointing to future/uncertain events.',

{id:10,unit:2,lvl:'B2',dur:50,emoji:'🎭',title:'Perfect Subjunctive & Sequence of Tenses',desc:'Use haya + participle and hubiera + participle to express past events within subjunctive clauses.',
obj:['Form the perfect and pluperfect subjunctive','Apply sequence-of-tenses rules correctly','Express regret and unrealised possibilities with perfect subjunctive'],
theory:`<h3>Perfect Subjunctive (Pretérito Perfecto de Subjuntivo)</h3><p><strong>haya / hayas / haya / hayamos / hayáis / hayan</strong> + past participle</p><div class="eg">Me alegra que <strong>hayas llegado</strong> a tiempo.<em>I\'m glad you arrived / have arrived on time.</em></div><h3>Pluperfect Subjunctive (Pretérito Pluscuamperfecto de Subjuntivo)</h3><p><strong>hubiera/hubiese + past participle</strong></p><div class="eg">Ojalá <strong>hubiera sabido</strong> antes.<em>If only I had known sooner.</em></div><h3>Sequence of Tenses</h3><table><tr><th>Main clause</th><th>Subordinate (subj)</th><th>Time relation</th></tr><tr><td>Present / Future</td><td>Present subj. (hable)</td><td>simultaneous or future</td></tr><tr><td>Present / Future</td><td>Perfect subj. (haya hablado)</td><td>completed before main</td></tr><tr><td>Past / Conditional</td><td>Imperfect subj. (hablara)</td><td>simultaneous or future</td></tr><tr><td>Past / Conditional</td><td>Pluperfect subj. (hubiera hablado)</td><td>completed before main</td></tr></table><div class="tip">💡 "Ojalá + perfect subj." expresses a wish about the past: <em>Ojalá haya aprobado.</em> (I hope she passed.)<br>"Ojalá + pluperfect subj." expresses an unfulfilled past wish: <em>Ojalá hubiera aprobado.</em> (If only she had passed.)</div>`,

{id:11,unit:3,lvl:'B1',dur:45,emoji:'🌍',

desc:'Master conditional structures to discuss scientific facts, environmental realities, and realistic future scenarios.',
obj:['Distinguish zero conditional (fact) from first conditional (real future)','Apply conditionals in environmental and scientific contexts','Form negative and question conditional structures'],
theory:`<h3>Zero Conditional — Universal Truths</h3>
<p>Use the zero conditional for facts, laws of nature, and general truths. Both clauses use the <strong>present indicative</strong>.</p>
<table><tr><th>If clause</th><th>Result clause</th></tr>
<tr><td>Si + present</td><td>present indicative</td></tr>
<tr><td>Si el hielo se calienta,</td><td>se derrite.</td></tr>
<tr><td>Si no llueve,</td><td>los cultivos se secan.</td></tr></table>
<h3>First Conditional — Real/Likely Future</h3>
<p>For realistic future scenarios. The if-clause uses <strong>present subjunctive</strong>; result uses <strong>future indicative</strong> or <strong>imperative</strong>.</p>
<table><tr><th>If clause</th><th>Result clause</th></tr>
<tr><td>Si + present indicative*</td><td>future / imperative</td></tr>
<tr><td>Si seguimos contaminando,</td><td>el planeta sufrirá.</td></tr>
<tr><td>Si encuentras trabajo,</td><td>avísame.</td></tr></table>
<p><em>*Note: Spanish uses present indicative (not subjunctive) after "si" in real conditionals — unlike English.</em></p>
<div class="eg"><strong>Key contrast:</strong><br>
Zero: Si bebes agua contaminada, <strong>te enfermas</strong>. (always true)<br>
First: Si bebes agua contaminada, <strong>te enfermarás</strong>. (real risk)</div>
<h3>Negative & Question Forms</h3>
<p>Si no reduces tu huella de carbono, el problema empeorará.<br>
¿Qué pasará si no actuamos ahora?</p>`,

{id:12,unit:3,lvl:'B1',dur:45,emoji:'💭',
title:'Second Conditional — Hypothetical Present/Future',
desc:'Express hypothetical situations, life decisions, and unreal present conditions using the second conditional.',
obj:['Form second conditional with imperfect subjunctive + conditional','Use second conditional for hypotheticals and wishes','Distinguish first from second conditional in context'],
theory:`<h3>Second Conditional Structure</h3>
<p>The second conditional describes <strong>hypothetical or unreal present/future</strong> situations — things that are unlikely, imagined, or contrary to current fact.</p>
<table><tr><th>If clause</th><th>Result clause</th></tr>
<tr><td>Si + imperfect subjunctive</td><td>conditional (would)</td></tr>
<tr><td>Si tuviera más tiempo,</td><td>estudiaría otro idioma.</td></tr>
<tr><td>Si fuera presidente,</td><td>cambiaría las leyes.</td></tr></table>
<h3>Key Imperfect Subjunctive Forms</h3>
<table><tr><th>Verb</th><th>-ra form</th></tr>
<tr><td>tener</td><td>tuviera</td></tr>
<tr><td>ser</td><td>fuera</td></tr>
<tr><td>poder</td><td>pudiera</td></tr>
<tr><td>ir</td><td>fuera</td></tr>
<tr><td>haber</td><td>hubiera</td></tr>
<tr><td>saber</td><td>supiera</td></tr></table>
<h3>Common Patterns</h3>
<p>¿Qué harías si... ? — What would you do if...?<br>
Si yo fuera tú, ... — If I were you, ...<br>
Si pudiera elegir, ... — If I could choose, ...</p>
<div class="eg"><strong>First vs Second Conditional:</strong><br>
First (realistic): Si consigo el trabajo, me mudaré. (I might get it)<br>
Second (hypothetical): Si consiguiera ese trabajo de mis sueños, me mudaría. (unlikely/wishful)</div>`,

{id:13,unit:3,lvl:'B2',dur:50,emoji:'⏮️',
title:'Third Conditional — Unreal Past',
desc:'Reflect on historical turning points, personal regrets, and counterfactual history using the third conditional.',
obj:['Form third conditional with pluperfect subjunctive + conditional perfect','Apply third conditional to historical and personal contexts','Use mixed conditionals when appropriate'],
theory:`<h3>Third Conditional Structure</h3>
<p>The third conditional refers to <strong>unreal past situations</strong> — things that did not happen and whose consequences are imagined.</p>
<table><tr><th>If clause</th><th>Result clause</th></tr>
<tr><td>Si + pluperfect subjunctive</td><td>conditional perfect (would have)</td></tr>
<tr><td>Si hubiera estudiado más,</td><td>habría aprobado el examen.</td></tr>
<tr><td>Si no hubiera llovido,</td><td>habrían salido.</td></tr></table>
<h3>Pluperfect Subjunctive Formation</h3>
<p><strong>hubiera/hubieras/hubiera/hubiéramos/hubierais/hubieran + past participle</strong></p>
<table><tr><th>Infinitive</th><th>Past participle</th><th>Pluperfect subj.</th></tr>
<tr><td>ganar</td><td>ganado</td><td>hubiera ganado</td></tr>
<tr><td>perder</td><td>perdido</td><td>hubiera perdido</td></tr>
<tr><td>hacer</td><td>hecho</td><td>hubiera hecho</td></tr>
<tr><td>decir</td><td>dicho</td><td>hubiera dicho</td></tr></table>
<h3>Mixed Conditionals</h3>
<p>Mix past condition with present result:<br>
Si hubiera elegido bien (past), ahora sería rico (present).</p>
<div class="eg"><strong>Historical use:</strong><br>
Si el archiduque Francisco Fernando no hubiera sido asesinado, la Primera Guerra Mundial no habría estallado de la misma forma.<br>
<em>If Archduke Franz Ferdinand had not been assassinated, WWI would not have broken out in the same way.</em></div>`,

{id:14,unit:3,lvl:'B2',dur:45,emoji:'📰',
title:'Passive Voice — Ser & Estar',
desc:'Master the passive voice in news, media, and formal writing contexts. Understand the difference between passive with ser and the resultant state with estar.',
obj:['Form passive voice with ser + past participle','Distinguish passive ser from resultant estar','Use passive se and impersonal constructions in journalism'],
theory:`<h3>Passive with Ser</h3>
<p>The true passive uses <strong>ser + past participle</strong>. The past participle agrees with the grammatical subject.</p>
<table><tr><th>Active</th><th>Passive</th></tr>
<tr><td>El periodista escribió el artículo.</td><td>El artículo fue escrito por el periodista.</td></tr>
<tr><td>Van a publicar los resultados.</td><td>Los resultados van a ser publicados.</td></tr></table>
<h3>Resultant State with Estar</h3>
<p><strong>Estar + past participle</strong> describes the resulting STATE after an action, not the action itself.</p>
<table><tr><th>Passive action (ser)</th><th>Resultant state (estar)</th></tr>
<tr><td>La tienda fue cerrada (por el dueño).</td><td>La tienda está cerrada.</td></tr>
<tr><td>El artículo fue publicado.</td><td>El artículo está publicado.</td></tr></table>
<h3>Passive Se</h3>
<p>Very common in formal Spanish when the agent is unknown or unimportant:</p>
<p>Se anunció la decisión. / Se publicarán los resultados.<br>
Se han detectado irregularidades.</p>
<div class="eg"><strong>Journalism tip:</strong><br>
La ley fue aprobada por unanimidad. (passive, emphasizes action)<br>
La ley está aprobada. (resultant state, emphasizes current situation)<br>
Se aprobó la ley. (passive se, no agent mentioned)</div>`,

desc:'Go beyond the basics of ser and estar to master nuanced distinctions including identity, temporary states, location of events, and meaning changes.',
obj:['Apply ser and estar in advanced, non-obvious contexts','Understand how choice of verb changes meaning','Use estar for location of people/things; ser for events'],
theory:`<h3>Advanced Ser Uses</h3>
<table><tr><th>Use</th><th>Example</th></tr>
<tr><td>Essential identity</td><td>Soy médico / Es un genio</td></tr>
<tr><td>Origin & material</td><td>Es de Madrid / Es de madera</td></tr>
<tr><td>Ownership</td><td>El libro es mío</td></tr>
<tr><td>Time & date</td><td>Son las tres / Es lunes</td></tr>
<tr><td>Passive (with agent)</td><td>Fue construido por Gaudí</td></tr>
<tr><td>Location of EVENTS</td><td>La reunión es en Madrid</td></tr></table>
<h3>Advanced Estar Uses</h3>
<table><tr><th>Use</th><th>Example</th></tr>
<tr><td>Location (people/things)</td><td>El hotel está en Madrid</td></tr>
<tr><td>Temporary states</td><td>Está cansado / Está ocupado</td></tr>
<tr><td>Resultant states</td><td>La puerta está abierta</td></tr>
<tr><td>Progressive tense</td><td>Está comiendo</td></tr>
<tr><td>Unexpected quality</td><td>¡Estás muy guapo hoy!</td></tr></table>
<h3>Meaning Changes</h3>
<table><tr><th>Adjective</th><th>Con ser</th><th>Con estar</th></tr>
<tr><td>listo</td><td>clever</td><td>ready</td></tr>
<tr><td>malo</td><td>bad/evil</td><td>ill/sick</td></tr>
<tr><td>bueno</td><td>good (character)</td><td>tasty / looking good</td></tr>
<tr><td>rico</td><td>wealthy</td><td>delicious</td></tr>
<tr><td>aburrido</td><td>boring (person)</td><td>bored</td></tr>
<tr><td>muerto</td><td>(rare)</td><td>dead</td></tr></table>`,

theory:`<h3>Relative Pronouns</h3>
<table><tr><th>Pronoun</th><th>Use</th><th>Example</th></tr>
<tr><td>que</td><td>people & things (defining)</td><td>El edificio que ves es modernista.</td></tr>
<tr><td>quien/quienes</td><td>people only (after preposition or non-defining)</td><td>El arquitecto, quien diseñó la Sagrada Familia, es Gaudí.</td></tr>
<tr><td>el/la/los/las que</td><td>people & things (after preposition)</td><td>La ciudad en la que nació es pequeña.</td></tr>
<tr><td>el/la/los/las cual(es)</td><td>formal; non-defining</td><td>El tratado, el cual fue firmado en 1848, cambió Europa.</td></tr>
<tr><td>cuyo/cuya</td><td>possession (whose)</td><td>El artista cuya obra admiro vive en Sevilla.</td></tr>
<tr><td>donde</td><td>place</td><td>La ciudad donde nació es patrimonio mundial.</td></tr></table>
<h3>Defining vs Non-Defining</h3>
<p><strong>Defining</strong> (no commas): identifies which one<br>
El monumento <u>que construyeron en 1900</u> es famoso. (which one? the one from 1900)</p>
<p><strong>Non-defining</strong> (with commas): adds extra info<br>
La Sagrada Familia, <u>que lleva más de un siglo en construcción</u>, es un símbolo de Barcelona.</p>`,

{id:17,unit:4,lvl:'B2',dur:50,emoji:'💼',
title:'Gerunds, Infinitives & Past Participles',
desc:'Master the three non-personal verb forms in professional and formal contexts — when to use each and common errors to avoid.',
obj:['Use gerunds as progressive action or manner','Apply infinitives as verbal nouns and complements','Recognize past participles in compound tenses and adjective use'],
theory:`<h3>The Gerund (Gerundio)</h3>
<p>Formation: -ar → <strong>-ando</strong>; -er/-ir → <strong>-iendo</strong></p>
<p>Uses: progressive action (está trabajando), manner (entró corriendo), simultaneous action (habla gesticulando)</p>
<p><strong>Error to avoid:</strong> In Spanish, the gerund CANNOT be a subject or object noun.<br>
✗ Trabajar demasiado es malo. ✓ (use infinitive)<br>
✗ Vivo para trabajar. ✓ (use infinitive)</p>
<h3>The Infinitive (Infinitivo)</h3>
<p>Used as: verbal noun (subject/object), after prepositions, after modal verbs</p>
<table><tr><th>Function</th><th>Example</th></tr>
<tr><td>Subject</td><td>Negociar bien es un arte.</td></tr>
<tr><td>Object</td><td>Quiero ascender.</td></tr>
<tr><td>After prep.</td><td>Antes de firmar, lee.</td></tr>
<tr><td>After modal</td><td>Debes presentar el informe.</td></tr></table>
<h3>Past Participle (Participio Pasado)</h3>
<p>Formation: -ar → <strong>-ado</strong>; -er/-ir → <strong>-ido</strong> (+ irregulars)</p>
<p>Uses: compound tenses (ha firmado), passive (fue aprobado), adjective (contrato firmado)</p>
<div class="eg"><strong>Professional context:</strong><br>
Habiendo revisado el informe (having reviewed — compound gerund)<br>
El contrato, una vez firmado, es vinculante. (once signed)<br>
Hay que negociar antes de cerrar el trato. (infinitive after preposition)</div>`,

title:'Reported Speech — Estilo Indirecto',
desc:'Report what others said, asked, or ordered in journalism and professional contexts. Master tense backshift rules.',
obj:['Apply tense backshift in reported speech','Report statements, questions, and commands','Recognize common reporting verbs and their structures'],
theory:`<h3>Reported Statements</h3>
<p>Main verb: <strong>dijo que, afirmó que, explicó que</strong> + tense shift</p>
<table><tr><th>Direct speech</th><th>Reported speech</th></tr>
<tr><td>Present → "Trabajo aquí"</td><td>Imperfect: dijo que trabajaba allí</td></tr>
<tr><td>Preterite → "Fui"</td><td>Pluperfect: dijo que había ido</td></tr>
<tr><td>Future → "Iré"</td><td>Conditional: dijo que iría</td></tr>
<tr><td>Present perfect → "He visto"</td><td>Pluperfect: dijo que había visto</td></tr></table>
<h3>Reported Questions</h3>
<p>Use <strong>preguntó si</strong> (yes/no questions) or <strong>preguntó qué/cómo/cuándo...</strong> (info questions)</p>
<p>Me preguntó si venía a la reunión.<br>
Me preguntó cuándo llegaría el informe.</p>
<h3>Reported Commands</h3>
<p>Use <strong>dijo/pidió/ordenó + que + imperfect subjunctive</strong></p>
<p>Me dijo que enviara el informe. (He told me to send the report.)<br>
Les ordenó que callaran. (He ordered them to be quiet.)</p>
<div class="eg"><strong>Journalism example:</strong><br>
Direct: "Dimitiré mañana," declaró el ministro.<br>
Reported: El ministro declaró que dimitiría al día siguiente.</div>`,

theory:`<h3>Opening a Meeting</h3>
<p>Buenos días a todos. Pasemos al orden del día.<br>
El objetivo de esta reunión es...<br>
Antes de empezar, quiero agradecer la presencia de...</p>
<h3>Negotiation Language</h3>
<table><tr><th>Function</th><th>Phrase</th></tr>
<tr><td>Proposal</td><td>Les propongo que consideremos...</td></tr>
<tr><td>Counter-offer</td><td>Entiendo su posición, sin embargo...</td></tr>
<tr><td>Agreement</td><td>Podemos llegar a un acuerdo si...</td></tr>
<tr><td>Deadline</td><td>Necesitamos una respuesta antes del...</td></tr>
<tr><td>Concession</td><td>Estaríamos dispuestos a ceder en...</td></tr></table>
<h3>Presentation Structure</h3>
<p><strong>Opening:</strong> Quisiera comenzar presentando...<br>
<strong>Signposting:</strong> En primer lugar... / A continuación... / Por último...<br>
<strong>Data:</strong> Como muestran los datos... / Cabe destacar que...<br>
<strong>Closing:</strong> Para concluir... / Quedo a su disposición para...</p>
<div class="eg"><strong>Diplomatic disagreement:</strong><br>
Entiendo su punto de vista; no obstante, los datos sugieren que...<br>
Con todo el respeto, me gustaría matizar que...</div>`,

title:'Academic Spanish — Essays & Arguments',
desc:'Write and structure academic essays in Spanish. Master argumentation, citation, hedging, and formal academic register.',
obj:['Structure an academic essay in Spanish','Use academic hedging and citation language','Employ argumentation and counter-argument vocabulary'],
theory:`<h3>Essay Structure</h3>
<table><tr><th>Part</th><th>Function</th><th>Key phrases</th></tr>
<tr><td>Introducción</td><td>Introduce topic & thesis</td><td>El presente trabajo analiza... / En este ensayo se argumentará que...</td></tr>
<tr><td>Desarrollo</td><td>Arguments with evidence</td><td>En primer lugar... / Asimismo... / Por otro lado...</td></tr>
<tr><td>Contraargumento</td><td>Acknowledge opposition</td><td>Aunque algunos sostienen que... / Si bien es cierto que...</td></tr>
<tr><td>Conclusión</td><td>Synthesize & restate</td><td>A modo de conclusión... / En síntesis...</td></tr></table>
<h3>Academic Hedging</h3>
<p>Avoid absolute claims — hedge with:</p>
<p>parece que / tiende a / cabe señalar que / en cierta medida / podría argumentarse que</p>
<h3>Citation Language</h3>
<p>Según [autor] (año), ... / Como señala [autor], ... / De acuerdo con los datos...</p>
<h3>Linking Words</h3>
<table><tr><th>Function</th><th>Words</th></tr>
<tr><td>Addition</td><td>asimismo, además, igualmente</td></tr>
<tr><td>Contrast</td><td>sin embargo, no obstante, a pesar de ello</td></tr>
<tr><td>Cause</td><td>puesto que, dado que, en virtud de</td></tr>
<tr><td>Consequence</td><td>por ello, de ahí que, en consecuencia</td></tr></table>`,

<p>Native speakers use idioms constantly. Literal translation fails completely — you must learn them as fixed units.</p>
<h3>Body Part Idioms</h3>
<table><tr><th>Idiom</th><th>Literal</th><th>Meaning</th></tr>
<tr><td>costar un ojo de la cara</td><td>cost an eye from the face</td><td>to cost a fortune</td></tr>
<tr><td>meter la pata</td><td>put the paw in</td><td>to put your foot in it</td></tr>
<tr><td>no tener pelos en la lengua</td><td>no hairs on tongue</td><td>to speak one's mind bluntly</td></tr>
<tr><td>tomar el pelo</td><td>take the hair</td><td>to pull someone's leg</td></tr>
<tr><td>estar hasta las narices</td><td>be up to the nostrils</td><td>to be fed up</td></tr></table>
<h3>Emotional Idioms</h3>
<table><tr><th>Idiom</th><th>Meaning</th></tr>
<tr><td>no caber en sí de gozo</td><td>to be overjoyed</td></tr>
<tr><td>ponerse los pelos de punta</td><td>hair-raising; to get goosebumps</td></tr>
<tr><td>quedarse de piedra</td><td>to be stunned/petrified</td></tr></table>`,

title:'Idioms — Nature, Animals & Daily Life',
desc:'Master idiomatic expressions drawn from nature, animals, and everyday life situations for truly natural Spanish.',
obj:['Use 30+ nature and animal idioms','Recognize register differences in idiom use','Deploy idioms appropriately in oral and written contexts'],
theory:`<h3>Animal Idioms</h3>
<table><tr><th>Idiom</th><th>Meaning</th></tr>
<tr><td>ser un ave de paso</td><td>to be a transient person</td></tr>
<tr><td>dar gato por liebre</td><td>to sell a pig in a poke / deceive</td></tr>
<tr><td>matar dos pájaros de un tiro</td><td>to kill two birds with one stone</td></tr>
<tr><td>a caballo regalado no le mires el diente</td><td>don't look a gift horse in the mouth</td></tr>
<tr><td>perros que ladran no muerden</td><td>barking dogs don't bite</td></tr></table>
<h3>Nature & Weather Idioms</h3>
<table><tr><th>Idiom</th><th>Meaning</th></tr>
<tr><td>llover sobre mojado</td><td>when it rains it pours</td></tr>
<tr><td>no hay mal que por bien no venga</td><td>every cloud has a silver lining</td></tr>
<tr><td>a río revuelto, ganancia de pescadores</td><td>fish in troubled waters</td></tr></table>
<h3>Register Notes</h3>
<p>Some idioms are colloquial (oral use), others neutral (any context). Avoid very colloquial idioms in formal writing.</p>`,

{id:26,unit:6,lvl:'B2',dur:50,emoji:'🎩',
title:'Formal Register — Written & Spoken',
desc:'Master the elevated formal register used in official communications, legal documents, speeches, and high-stakes professional contexts.',
obj:['Identify markers of formal register in Spanish','Write formal letters and official communications','Use formal vocabulary to replace informal equivalents'],
theory:`<h3>Characteristics of Formal Register</h3>
<ul><li>Passive voice and impersonal se</li><li>Complex sentence structures with subordination</li><li>Formal vocabulary (Latin-origin words preferred)</li><li>No contractions, slang, or colloquialisms</li><li>Polite subjunctive forms (quisiera, pudiera)</li></ul>
<h3>Formal vs Informal Equivalents</h3>
<table><tr><th>Informal</th><th>Formal</th></tr>
<tr><td>decir</td><td>manifestar / expresar / indicar</td></tr>
<tr><td>pedir</td><td>solicitar / requerir / recabar</td></tr>
<tr><td>ayudar</td><td>asistir / coadyuvar</td></tr>
<tr><td>querer</td><td>desear / tener a bien</td></tr>
<tr><td>necesitar</td><td>precisar / requerir / necesitar de</td></tr>
<tr><td>usar</td><td>hacer uso de / emplear / utilizar</td></tr></table>
<h3>Formal Letter Structure</h3>
<p>Encabezamiento → Saludo → Exposición → Solicitud → Despedida → Firma<br>
Me dirijo a usted para... / En respuesta a su comunicación de fecha...<br>
En espera de su respuesta, le saluda atentamente.</p>`,
vocab:[
{es:'a tal efecto',en:'to that end/effect',ex:'Se han tomado medidas, a tal efecto.',xt:'Measures have been taken to that end.'},
{es:'adjunto',en:'enclosed/attached (formal)',ex:'Adjunto le remito la documentación solicitada.',xt:'Enclosed herewith I send you the requested documentation.'},
{es:'atentamente',en:'yours sincerely/faithfully',ex:'Le saluda atentamente, [firma].',xt:'Yours faithfully, [signature].'},
{es:'caber la posibilidad',en:'there being a possibility',ex:'Cabe la posibilidad de aplazar la reunión.',xt:'There is a possibility of postponing the meeting.'},
{es:'conforme a',en:'in accordance with',ex:'Conforme a lo establecido en el artículo 5, se procede a...',xt:'In accordance with Article 5, proceedings shall begin...'},
{es:'con carácter urgente',en:'on an urgent basis',ex:'Le ruego que tramite esta solicitud con carácter urgente.',xt:'I request that you process this application on an urgent basis.'},
{es:'con la mayor brevedad posible',en:'as soon as possible (formal)',ex:'Le agradecemos que nos responda con la mayor brevedad posible.',xt:'We thank you for responding as soon as possible.'},
{es:'coadyuvar',en:'to contribute/assist (formal)',ex:'Su experiencia coadyuvará al éxito del proyecto.',xt:'His experience will contribute to the success of the project.'},
{es:'dicho',en:'said/aforementioned (formal)',ex:'Dicho informe fue presentado ante el tribunal.',xt:'The aforementioned report was presented before the court.'},
{es:'en virtud de',en:'by virtue of / pursuant to',ex:'En virtud de lo anterior, se solicita la revisión del contrato.',xt:'By virtue of the foregoing, a review of the contract is requested.'},
{es:'exponer',en:'to set forth/state (formal)',ex:'Me permito exponer a continuación los hechos relevantes.',xt:'I take the liberty of setting forth hereunder the relevant facts.'},
{es:'hacer constar',en:'to place on record',ex:'Por medio de la presente, hago constar que el empleado...',xt:'By means of this letter, I place on record that the employee...'},
{es:'instancia',en:'application/petition (formal)',ex:'Se presentó la instancia ante el registro oficial.',xt:'The petition was submitted to the official registry.'},
{es:'interponer',en:'to lodge/file (a complaint)',ex:'Se interpondrá un recurso de alzada.',xt:'An appeal will be lodged.'},
{es:'la presente',en:'this letter/document (formal)',ex:'Por medio de la presente, le comunicamos que...',xt:'By means of this letter, we inform you that...'},
{es:'manifestar',en:'to state/express (formal)',ex:'Me complace manifestar que los resultados son satisfactorios.',xt:'I am pleased to state that the results are satisfactory.'},
{es:'mediante',en:'by means of',ex:'Nos ponemos en contacto mediante esta carta.',xt:'We are getting in touch by means of this letter.'},
{es:'objeto',en:'subject/purpose (formal)',ex:'El objeto de la presente es comunicarle la resolución.',xt:'The purpose of this letter is to inform you of the decision.'},
{es:'obrar en poder de',en:'to be in the possession of',ex:'Los documentos obran en poder de la notaría.',xt:'The documents are in the possession of the notary\'s office.'},
{es:'poner en conocimiento',en:'to bring to attention',ex:'Me es grato poner en su conocimiento los siguientes hechos.',xt:'It is my pleasure to bring the following facts to your attention.'},
{es:'por conducto reglamentario',en:'through official/proper channels',ex:'Eleve la solicitud por conducto reglamentario.',xt:'Submit the application through official channels.'},
{es:'preceder',en:'to precede (formal)',ex:'Los documentos que preceden acreditan la situación.',xt:'The preceding documents certify the situation.'},
{es:'quisiera',en:'I would like (polite conditional)',ex:'Quisiera solicitarle una reunión urgente.',xt:'I would like to request an urgent meeting.'},
{es:'recabar',en:'to obtain/gather (formal)',ex:'Se procederá a recabar información adicional.',xt:'Additional information will be obtained.'},
{es:'recurso',en:'appeal/resource (legal)',ex:'Tiene derecho a interponer recurso en el plazo de un mes.',xt:'You have the right to file an appeal within one month.'},
{es:'requerir',en:'to require/request (formal)',ex:'La situación requiere una respuesta inmediata.',xt:'The situation requires an immediate response.'},
{es:'resolución',en:'resolution/decision (official)',ex:'La resolución fue notificada a todas las partes.',xt:'The resolution was notified to all parties.'},
{es:'se adjunta',en:'enclosed/attached (passive)',ex:'Se adjunta la factura correspondiente al mes de marzo.',xt:'Enclosed is the invoice for the month of March.'},
{es:'sin otro particular',en:'nothing further to add',ex:'Sin otro particular, queda a su disposición.',xt:'Nothing further to add, I remain at your disposal.'},
{es:'suscrito',en:'undersigned',ex:'El abajo suscrito solicita la renovación del contrato.',xt:'The undersigned requests the renewal of the contract.'},
{es:'tener a bien',en:'to be so kind as to (formal)',ex:'Le ruego tenga a bien confirmar la recepción.',xt:'I kindly ask you to confirm receipt.'}
],

<tr><td>la verdad es que</td><td>the truth is / honestly</td></tr>

<tr><td>guay</td><td>bacán/chido</td><td>great</td></tr></table>`,

title:'Nuance & Hedging — Expressing Uncertainty',
desc:'Master the art of nuanced expression: hedging, approximating, expressing degrees of certainty, and qualifying statements like a native speaker.',
obj:['Use hedging devices to soften claims','Express degrees of certainty and probability','Qualify and approximate in natural Spanish'],
theory:`<h3>Modal Probability</h3>
<table><tr><th>Expression</th><th>Certainty level</th></tr>
<tr><td>Indudablemente / Sin duda</td><td>100% — certain</td></tr>
<tr><td>Seguramente / Probablemente</td><td>~80% — probable</td></tr>
<tr><td>Posiblemente / Quizás + subjunctive</td><td>~50% — possible</td></tr>
<tr><td>Tal vez + subjunctive</td><td>~40% — maybe</td></tr>
<tr><td>Puede (ser) que + subjunctive</td><td>~30% — might</td></tr></table>
<h3>Hedging Expressions</h3>
<p>en cierta medida / hasta cierto punto — to some extent<br>
en principio — in principle<br>
por lo general — generally speaking<br>
a grandes rasgos — broadly speaking<br>
que yo sepa — as far as I know<br>
por lo visto — apparently<br>
según parece — it seems that</p>
<h3>Approximation</h3>
<p>unos/unas + number — approximately<br>
alrededor de / en torno a — around<br>
más o menos — more or less<br>
aproximadamente — approximately</p>`,

{id:29,unit:7,lvl:'B2',dur:55,emoji:'📖',
title:'Reading Strategies & Inference',
desc:'Develop advanced comprehension strategies: inference, implication, author stance, tone detection, and critical reading in Spanish.',
obj:['Identify implicit meaning and inference in texts','Detect author stance, tone, and bias','Use context to deduce unknown vocabulary'],
theory:`<h3>Levels of Meaning</h3>
<table><tr><th>Level</th><th>Description</th><th>Question type</th></tr>
<tr><td>Literal</td><td>What the text explicitly says</td><td>¿Qué dice el texto sobre...?</td></tr>
<tr><td>Inferential</td><td>What is implied but not stated</td><td>¿Qué se puede deducir de...?</td></tr>
<tr><td>Critical</td><td>Author's stance, bias, purpose</td><td>¿Qué actitud muestra el autor hacia...?</td></tr></table>
<h3>Inferring Meaning</h3>
<p>Clues for inference: choice of vocabulary, what is emphasized, what is omitted, grammatical structures used</p>
<p>El texto sugiere que... / Se puede inferir que... / El autor implica que...<br>
La elección de la palabra "X" indica que... / El tono del texto es...</p>
<h3>Guessing Unknown Words</h3>
<p>Use: root knowledge, context, grammatical category, cognates, collocations<br>
"Aunque desconozco la palabra, por el contexto se entiende que..."</p>
<div class="eg"><strong>Tone vocabulary:</strong><br>
irónico / satírico / crítico / elogioso / neutral / emotivo / alarmista / optimista / escéptico</div>`,

// persist / load
function save() {
  try { localStorage.setItem('spv2', JSON.stringify({prog: ST.prog, fllearn: ST.fllearn})); } catch(e) {}
}
function load() {
  try {
    const d = JSON.parse(localStorage.getItem('spv2') || '{}');
    if (d.prog) ST.prog = d.prog;
    if (d.fllearn) ST.fllearn = d.fllearn;
  } catch(e) {}
}
load();

// ── TTS ──────────────────────────────────────────────────────────────────────
let ttsReady = false;
let ttsVoice = null;
function initTTS() {
  if (!window.speechSynthesis) return;
  function findVoice() {
    const vs = speechSynthesis.getVoices();
    ttsVoice = vs.find(v => v.lang.startsWith('es')) || null;
    ttsReady = vs.length > 0;
  }
  findVoice();
  speechSynthesis.onvoiceschanged = findVoice;
}
initTTS();
function speak(txt) {
  if (!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(txt);
  u.lang = 'es-ES';
  if (ttsVoice) u.voice = ttsVoice;
  u.rate = 0.85;
  speechSynthesis.speak(u);
}

// ── Helpers ──────────────────────────────────────────────────────────────────
function getLesson(id) { return LESSONS.find(l => l.id === id); }
function lessonProg(id) { return ST.prog[id] || {done:false, score:0, total:0}; }
function totalCompleted() { return Object.values(ST.prog).filter(p => p.done).length; }
function totalScore() { return Object.values(ST.prog).reduce((a,p) => a + (p.score||0), 0); }
function totalItems() { return Object.values(ST.prog).reduce((a,p) => a + (p.total||0), 0); }
function accuracy() { const t = totalItems(); return t ? Math.round(totalScore()/t*100) : 0; }
function masteredCount() { return LESSONS.reduce((a,l) => {
  const p = ST.prog[l.id];
  return a + (p && p.mastered ? p.mastered.length : 0);
},0); }

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function normalize(s) {
  return s.trim().toLowerCase()
    .replace(/á/g,'a').replace(/é/g,'e').replace(/í/g,'i').replace(/ó/g,'o').replace(/ú/g,'u').replace(/ü/g,'u')
    .replace(/ñ/g,'n').replace(/[^a-z0-9\s]/g,'').replace(/\s+/g,' ');
}
